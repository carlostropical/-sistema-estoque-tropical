// CONTAGEM DE GELADEIRA (abastecimento por turno + sobra)
// ============================================================
var FRIDGE_ROLE = "Contagem de Geladeira";
var DEFAULT_FRIDGE_ITEMS = [
  "Guaraná lata 350 ml","Fanta lata 350 ml","Coca-Cola lata 350 ml","Coca-Cola Zero lata 350 ml",
  "Mini Coca-Cola 200 ml","Mini Coca-Cola Zero 200 ml","Pudim Tropical","Coca-Cola Zero 2 L",
  "Coca-Cola normal 2 L","Guaraná Antarctica 2 L","Sprite Zero 2 L"
];
var fridgeDate = "";
var fridgeConfig = null;     // {items:[{id,name}]}
var fridgeDay = null;        // documento do dia (ou null se ainda não existe)
var fridgeDayLoaded = false;
var fridgePrev = null;       // documento do dia anterior
var fridgeDraft = {};        // itemId -> campos digitados ainda não salvos
var fridgeSaveTimers = {};
var fridgePendingRender = false;
var fridgeSaving = 0;
var fridgeDocExists = false;
var fridgeStatusText = "";

function isFridgeOnly() { return currentRole() === FRIDGE_ROLE; }
function canFridge() {
  return !!(currentEmployeeId && employees[currentEmployeeId]);
}
function canManageFridge() { var r = currentRole(); return r === "Gerência" || r === "Diretoria"; }
function fridgeItems() {
  if (fridgeConfig && fridgeConfig.items && fridgeConfig.items.length) return fridgeConfig.items;
  return DEFAULT_FRIDGE_ITEMS.map(function(n, i){ return {id: "f" + (i+1), name: n}; });
}
function fridgeDocId(storeId, date) { return storeId + "_" + date.replace(/-/g, ""); }
function prevDateStr(d) { var x = dateFromStr(d); x.setDate(x.getDate()-1); return ymd(x); }
function numOrNull(v) { if (v === "" || v === null || v === undefined) return null; var n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; }
function fridgeRow(id) {
  var saved = (fridgeDay && fridgeDay["r_" + id]) || {};
  var d = fridgeDraft[id] || {};
  var out = {};
  ["lunchTime","lunchQty","dinnerTime","dinnerQty","finalCount"].forEach(function(k){
    out[k] = d.hasOwnProperty(k) ? d[k] : (saved[k] === null || saved[k] === undefined ? "" : saved[k]);
  });
  out.by = saved.by || ""; out.at = saved.at || 0;
  return out;
}
function fridgeEditable() { return canManageFridge() || fridgeDate === todayStr(); }

function subscribeFridge(storeId) {
  if (!fridgeDate) fridgeDate = todayStr();
  fridgeDay = null; fridgeDayLoaded = false; fridgePrev = null; fridgeDraft = {}; fridgeDocExists = false; fridgeStatusText = "";
  scopedUnsubs.push(db.doc("meta/fridgeConfig").onSnapshot(function(snap){
    fridgeConfig = snap.exists ? snap.data() : null;
    if (currentRoute === "geladeira") renderGeladeira();
  }, function(){}));
  scopedUnsubs.push(db.doc("fridge/" + fridgeDocId(storeId, fridgeDate)).onSnapshot(function(snap){
    fridgeDay = snap.exists ? Object.assign({}, snap.data()) : null; fridgeDayLoaded = true;
    if (snap.exists) fridgeDocExists = true;
    if (currentRoute === "geladeira") renderGeladeira();
  }, function(){ fridgeDayLoaded = true; }));
  db.doc("fridge/" + fridgeDocId(storeId, prevDateStr(fridgeDate))).get().then(function(snap){
    fridgePrev = snap.exists ? snap.data() : null;
    if (currentRoute === "geladeira") renderGeladeira();
  }).catch(function(){});
}

function renderGeladeira() {
  var ae = document.activeElement;
  if (ae && ae.classList && ae.classList.contains("fgInp") && currentRoute === "geladeira") { fridgePendingRender = true; return; }
  fridgePendingRender = false;
  if (!canFridge()) {
    content.innerHTML = '<div class="empty-state"><div class="emoji">🧊</div>' + (currentEmployeeId
        ? 'Seu usuário não tem acesso à Contagem de geladeira.<br>Peça para a Diretoria liberar no seu cadastro (Funcionários → 🧊 Acesso à Contagem de geladeira).'
        : 'Escolha quem está usando o sistema para abrir a Contagem de geladeira.') + '</div>' +
      '<button class="btn btn-primary" id="fgWho">' + (currentEmployeeId ? 'Trocar usuário' : 'Escolher usuário') + '</button>';
    document.getElementById("fgWho").addEventListener("click", openOperatorPicker);
    return;
  }
  if (!currentStoreId) { content.innerHTML = '<div class="empty-state">Selecione uma loja.</div>'; return; }
  if (!fridgeDate) fridgeDate = todayStr();
  if (!fridgeDayLoaded) { content.innerHTML = '<div class="loading-msg">Carregando contagem…</div>'; return; }

  var editable = fridgeEditable();
  var items = fridgeItems();
  var html = '<div class="section-head"><h2>🧊 Contagem de geladeira</h2>' +
    (canManageFridge() ? '<button class="link-btn" id="fgEditList">✏️ Editar lista</button>' : '') + '</div>';
  html += '<div class="row2"><div class="field" style="margin-bottom:8px;"><label>Data</label><input type="date" id="fgDate" value="' + fridgeDate + '"' +
    (canManageFridge() ? '' : ' max="' + todayStr() + '"') + '></div>' +
    '<div class="field" style="margin-bottom:8px;"><label>Loja</label><input type="text" value="' + esc(stores[currentStoreId] ? stores[currentStoreId].name : "") + '" disabled></div></div>';
  html += '<div style="font-size:12.5px;color:var(--text-2);margin-bottom:10px;">Registre a quantidade abastecida na geladeira no <b>almoço</b> e no <b>jantar</b>. Ao final do jantar, faça a <b>contagem final</b> (sobra). O sistema salva sozinho.' +
    (editable ? '' : ' <span style="color:var(--amber);font-weight:700;">Dia anterior: somente leitura.</span>') + '</div>';
  html += '<div id="fgStatus" style="font-size:12px;color:var(--text-2);min-height:16px;margin-bottom:6px;">' + esc(fridgeStatusText) + '</div>';

  var tot = {ab:0, fin:0, said:0, saidKnown:0, finCount:0};
  items.forEach(function(it){
    var r = fridgeRow(it.id);
    var lq = numOrNull(r.lunchQty) || 0, dq = numOrNull(r.dinnerQty) || 0, ab = lq + dq;
    var fin = numOrNull(r.finalCount);
    var prevRow = fridgePrev && fridgePrev["r_" + it.id];
    var prevFin = prevRow ? numOrNull(prevRow.finalCount) : null;
    var saida = (fin !== null && prevFin !== null) ? prevFin + ab - fin : null;
    tot.ab += ab; if (fin !== null) { tot.fin += fin; tot.finCount++; }
    if (saida !== null) { tot.said += saida; tot.saidKnown++; }
    var dis = editable ? "" : " disabled";
    function inp(field, type, val, ph, w) {
      return '<input class="fgInp" data-fid="' + it.id + '" data-ff="' + field + '" type="' + type + '"' + (type === "number" ? ' inputmode="numeric" min="0" step="any"' : '') +
        ' value="' + esc(val) + '" placeholder="' + ph + '"' + dis + ' style="width:' + w + ';padding:8px 6px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:15px;text-align:center;">';
    }
    html += '<div class="item-row" style="padding:10px 12px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;">' +
        '<div style="font-weight:700;font-size:14.5px;">' + esc(it.name) + '</div>' +
        '<div style="font-size:11.5px;color:var(--text-2);white-space:nowrap;">' + (r.by ? '👤 ' + esc(r.by.split(" ")[0]) : '') + '</div></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">' +
        '<div><div style="font-size:11px;font-weight:700;color:var(--text-2);margin-bottom:4px;">☀️ ALMOÇO</div><div style="display:flex;gap:6px;">' +
          inp("lunchTime", "time", r.lunchTime, "Hora", "58%") + inp("lunchQty", "number", r.lunchQty, "Qtd", "42%") + '</div></div>' +
        '<div><div style="font-size:11px;font-weight:700;color:var(--text-2);margin-bottom:4px;">🌙 JANTAR</div><div style="display:flex;gap:6px;">' +
          inp("dinnerTime", "time", r.dinnerTime, "Hora", "58%") + inp("dinnerQty", "number", r.dinnerQty, "Qtd", "42%") + '</div></div>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px;align-items:end;">' +
        '<div><div style="font-size:11px;font-weight:700;color:var(--text-2);">Total abastecido</div><div class="fgTot" data-fid="' + it.id + '" style="font-size:17px;font-weight:800;padding:6px 0;">' + fmtQty(ab) + '</div></div>' +
        '<div><div style="font-size:11px;font-weight:700;color:var(--text-2);margin-bottom:4px;">Contagem final</div>' + inp("finalCount", "number", r.finalCount, "Sobra", "100%") + '</div>' +
        '<div><div style="font-size:11px;font-weight:700;color:var(--text-2);">Saída do dia</div><div class="fgSaida" data-fid="' + it.id + '" style="font-size:17px;font-weight:800;padding:6px 0;color:' + (saida !== null && saida < 0 ? 'var(--red)' : 'var(--text)') + ';">' +
          (saida !== null ? fmtQty(saida) : '<span style="font-size:12px;font-weight:500;color:var(--text-2);">' + (fin === null ? '—' : 'sem sobra de ontem') + '</span>') + '</div></div>' +
      '</div></div>';
  });

  html += '<div class="item-row" style="background:var(--amber-bg);border-color:var(--amber);">' +
    '<div style="font-weight:800;margin-bottom:6px;">Totais do dia</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:13px;">' +
      '<div>Abastecido<br><b style="font-size:17px;">' + fmtQty(tot.ab) + '</b></div>' +
      '<div>Contagem final<br><b style="font-size:17px;">' + (tot.finCount ? fmtQty(tot.fin) : "—") + '</b>' + (tot.finCount && tot.finCount < items.length ? '<br><span style="font-size:11px;">' + tot.finCount + '/' + items.length + ' contados</span>' : '') + '</div>' +
      '<div>Saída<br><b style="font-size:17px;">' + (tot.saidKnown ? fmtQty(tot.said) : "—") + '</b></div>' +
    '</div></div>';
  html += '<div style="font-size:11.5px;color:var(--text-2);margin:-2px 0 12px 0;">Saída do dia = sobra do dia anterior + total abastecido − contagem final.</div>';
  html += '<div class="field"><label>Observações</label><textarea class="fgInp" id="fgNotes" data-ff="notes" rows="2"' + (editable ? '' : ' disabled') + '>' + esc(fridgeDay && fridgeDay.notes || "") + '</textarea></div>';
  if (fridgeDay && fridgeDay.updatedAt) html += '<div style="font-size:11.5px;color:var(--text-2);">Última alteração: ' + fmtDate(fridgeDay.updatedAt) + (fridgeDay.updatedByName ? ' por ' + esc(fridgeDay.updatedByName) : '') + '</div>';
  content.innerHTML = html;
  bindGeladeira();
}

function bindGeladeira() {
  var d = document.getElementById("fgDate");
  if (d) d.addEventListener("change", function(e){
    if (!e.target.value) return;
    if (!canManageFridge() && e.target.value > todayStr()) { e.target.value = fridgeDate; return; }
    fridgeDate = e.target.value; subscribeScoped("geladeira");
  });
  var el = document.getElementById("fgEditList");
  if (el) el.addEventListener("click", openFridgeListEditor);
  content.querySelectorAll(".fgInp[data-fid]").forEach(function(inp){
    inp.addEventListener("input", function(){
      var id = inp.getAttribute("data-fid"), f = inp.getAttribute("data-ff");
      if (!fridgeDraft[id]) fridgeDraft[id] = {};
      fridgeDraft[id][f] = inp.value;
      // ao digitar a quantidade de um turno, preenche a hora automaticamente se estiver vazia
      if ((f === "lunchQty" || f === "dinnerQty") && inp.value !== "") {
        var tf = f === "lunchQty" ? "lunchTime" : "dinnerTime";
        var tEl = content.querySelector('.fgInp[data-fid="' + id + '"][data-ff="' + tf + '"]');
        if (tEl && !tEl.value) { tEl.value = nowTimeStr(); fridgeDraft[id][tf] = tEl.value; }
      }
      updateFridgeRowCalc(id);
      scheduleFridgeSave(id);
    });
    inp.addEventListener("blur", function(){ flushFridgeSave(inp.getAttribute("data-fid")); setTimeout(function(){ if (fridgePendingRender && currentRoute === "geladeira") renderGeladeira(); }, 80); });
  });
  var n = document.getElementById("fgNotes");
  if (n) n.addEventListener("change", function(){ saveFridgeFields({notes: n.value.trim()}); });
  if (n) n.addEventListener("blur", function(){ setTimeout(function(){ if (fridgePendingRender && currentRoute === "geladeira") renderGeladeira(); }, 80); });
}
function updateFridgeRowCalc(id) {
  var r = fridgeRow(id);
  var ab = (numOrNull(r.lunchQty) || 0) + (numOrNull(r.dinnerQty) || 0);
  var fin = numOrNull(r.finalCount);
  var prevRow = fridgePrev && fridgePrev["r_" + id];
  var prevFin = prevRow ? numOrNull(prevRow.finalCount) : null;
  var t = content.querySelector('.fgTot[data-fid="' + id + '"]'); if (t) t.textContent = fmtQty(ab);
  var s = content.querySelector('.fgSaida[data-fid="' + id + '"]');
  if (s) {
    if (fin !== null && prevFin !== null) { var v = prevFin + ab - fin; s.textContent = fmtQty(v); s.style.color = v < 0 ? "var(--red)" : "var(--text)"; }
    else s.innerHTML = '<span style="font-size:12px;font-weight:500;color:var(--text-2);">' + (fin === null ? '—' : 'sem sobra de ontem') + '</span>';
  }
}
function setFridgeStatus(txt) { fridgeStatusText = txt; var s = document.getElementById("fgStatus"); if (s) s.textContent = txt; }
function scheduleFridgeSave(id) {
  clearTimeout(fridgeSaveTimers[id]);
  setFridgeStatus("Alterações não salvas…");
  fridgeSaveTimers[id] = setTimeout(function(){ flushFridgeSave(id); }, 900);
}
function flushFridgeSave(id) {
  if (!id || !fridgeDraft[id]) return;
  clearTimeout(fridgeSaveTimers[id]);
  var r = fridgeRow(id);
  var row = {
    lunchTime: r.lunchTime || "", lunchQty: numOrNull(r.lunchQty),
    dinnerTime: r.dinnerTime || "", dinnerQty: numOrNull(r.dinnerQty),
    finalCount: numOrNull(r.finalCount), by: currentEmployeeName || "", at: Date.now()
  };
  var it = fridgeItems().filter(function(x){ return x.id === id; })[0];
  row.name = it ? it.name : "";
  var patch = {}; patch["r_" + id] = row;
  delete fridgeDraft[id];
  if (!fridgeDay) fridgeDay = {};
  fridgeDay["r_" + id] = row;
  saveFridgeFields(patch);
}
var fridgeWriteChain = Promise.resolve();
function saveFridgeFields(patch) {
  if (!fridgeEditable()) return;
  var storeId = currentStoreId, date = fridgeDate;
  var ref = db.doc("fridge/" + fridgeDocId(storeId, date));
  patch.updatedAt = Date.now(); patch.updatedBy = currentEmployeeId; patch.updatedByName = currentEmployeeName || "";
  fridgeSaving++; setFridgeStatus("Salvando…");
  fridgeWriteChain = fridgeWriteChain.then(function(){
    var base = {storeId: storeId, storeName: stores[storeId] ? stores[storeId].name : "", date: date, createdAt: Date.now()};
    // primeira gravação do dia nesta loja: cria o registro; depois, só atualiza os campos alterados
    var p = fridgeDocExists ? ref.update(patch) : ref.get().then(function(s){
      return s.exists ? ref.update(patch) : ref.set(Object.assign(base, patch));
    });
    return p.then(function(){ if (storeId === currentStoreId && date === fridgeDate) fridgeDocExists = true; });
  }).then(function(){
    fridgeSaving--; if (!fridgeSaving) setFridgeStatus("✓ Salvo às " + nowTimeStr());
  }, function(err){
    fridgeSaving--; setFridgeStatus("⚠️ Não foi possível salvar: " + errMsg(err));
    showToast("Erro ao salvar contagem: " + errMsg(err));
  });
}

function openFridgeListEditor() {
  if (!canManageFridge()) return;
  var list = fridgeItems().map(function(x){ return {id: x.id, name: x.name}; });
  function draw() {
    var html = '<h2>Itens da contagem de geladeira</h2><div class="sub">Vale para todas as lojas. Contagens já feitas não são apagadas.</div>';
    list.forEach(function(it, i){
      html += '<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">' +

        .catch(function(err){ showToast("Erro: " + errMsg(err)); });
    });
  }
  draw();
}

// ATUALIZAR PREÇOS (subgrupo de Produtos)
// ============================================================
var PRICE_ROLES = ["Operador de Estoque","Gerência","Diretoria"];
var priceDraft = {};        // productId -> texto digitado
var priceCatFilter = "";
var priceSearch = "";
var pricePendingRender = false;
function canUpdatePrices() { return PRICE_ROLES.indexOf(currentRole()) !== -1; }
function priceChangedIds() {
  return Object.keys(priceDraft).filter(function(pid){
    var p = products[pid]; if (!p) return false;
    var v = priceDraft[pid];
    if (v === "" || v === undefined) return false;
    var n = parseFloat(String(v).replace(",", "."));
    return !isNaN(n) && n >= 0 && Math.abs(n - (p.cost||0)) > 1e-9;
  });
}
function renderPrecos() {
  var ae = document.activeElement;
  if (ae && ae.classList && ae.classList.contains("priceInp") && currentRoute==="precos") { pricePendingRender = true; return; }
  pricePendingRender = false;
  if (!canUpdatePrices()) {
    content.innerHTML = '<div class="empty-state"><div class="emoji">🔒</div>Atualização de preços é exclusiva para Operador de Estoque, Gerência e Diretoria.</div>' +
      '<button class="btn btn-primary" id="bPLogin">Trocar operador</button>' +
      '<button class="btn btn-secondary" id="bPBack">← Voltar para Produtos</button>';
    document.getElementById("bPLogin").addEventListener("click", openOperatorPicker);
    document.getElementById("bPBack").addEventListener("click", function(){ navigate("produtos"); });
    return;
  }
  var list = productOrder.map(function(id){ return products[id]; });
  if (priceSearch) { var t = priceSearch.toLowerCase(); list = list.filter(function(p){ return (p.name||"").toLowerCase().indexOf(t)!==-1; }); }
  if (priceCatFilter) list = list.filter(function(p){ return ((p.categoryId && categories[p.categoryId]) ? p.categoryId : "_none") === priceCatFilter; });
  var semCusto = productOrder.filter(function(pid){ return !products[pid].cost; }).length;

  var html = '<button class="link-btn" id="bPBack" style="margin-bottom:6px;">← Produtos</button>' +
    '<div class="section-head"><h2>Atualizar preços</h2></div>' +
    '<div class="sub" style="font-size:12.5px;color:var(--text-2);margin-bottom:10px;">Digite o novo custo de cada produto comprado e toque em <b>Salvar preços</b>. Deixe em branco o que não mudou.' +
    (semCusto ? ' <span style="color:var(--amber);font-weight:700;">' + semCusto + ' produto(s) ainda sem custo.</span>' : '') + '</div>' +
    '<div class="searchbar"><input id="pSearch" type="text" placeholder="Buscar produto..." value="' + esc(priceSearch) + '"></div>';
  var catIds = categoryOrder.filter(function(cid){ return productOrder.some(function(pid){ return products[pid].categoryId === cid; }); });
  html += '<div class="chip-scroll" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;">' +
    '<div class="chip' + (!priceCatFilter?" selected":"") + '" data-pcat="" style="white-space:nowrap;">Todos</div>' +
    catIds.map(function(cid){ return '<div class="chip' + (priceCatFilter===cid?" selected":"") + '" data-pcat="' + cid + '" style="white-space:nowrap;">' + esc(categories[cid].name) + '</div>'; }).join("") +
    '<div class="chip' + (priceCatFilter==="_none"?" selected":"") + '" data-pcat="_none" style="white-space:nowrap;">Sem gênero</div>' +
  '</div>';

  var groups = {}, order = [];
  list.forEach(function(p){
    var key = (p.categoryId && categories[p.categoryId]) ? p.categoryId : "_none";
    if (!groups[key]) { groups[key] = []; order.push(key); }
    groups[key].push(p);
  });
  order.sort(function(a,b){
    var na = a==="_none" ? "zzz" : categories[a].name, nb = b==="_none" ? "zzz" : categories[b].name;
    return na.localeCompare(nb, "pt-BR");
  });
  if (!order.length) html += '<div class="empty-state"><div class="emoji">🔎</div>Nenhum produto encontrado.</div>';
  order.forEach(function(key){
    html += '<div style="font-size:14px;font-weight:800;margin:16px 0 6px 0;">' + esc(key==="_none" ? "Sem gênero" : categories[key].name) +
      ' <span style="font-weight:500;color:var(--text-2);font-size:12.5px;">(' + groups[key].length + ')</span></div>';
    groups[key].forEach(function(p){
      var draft = priceDraft[p.id] !== undefined ? priceDraft[p.id] : "";
      var w = weightLabel(p);
      var info = [];
      if (p.previousCost !== undefined && p.previousCost !== null && p.costUpdatedAt) info.push("antes " + fmtMoney(p.previousCost));
      if (p.costUpdatedAt) info.push("atualizado " + fmtDate(p.costUpdatedAt) + (p.costUpdatedByName ? " por " + esc(p.costUpdatedByName.split(" ")[0]) : ""));
      html += '<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);">' +
        '<div style="flex:1;min-width:0;">' +
          '<div style="font-size:14px;font-weight:600;">' + esc(p.name) + (w ? ' <span style="font-weight:400;color:var(--text-2);font-size:12px;">' + w + '</span>' : '') + '</div>' +
          '<div style="font-size:12px;color:' + (p.cost ? 'var(--text-2)' : 'var(--amber)') + ';">Atual: <b>' + (p.cost ? fmtMoney(p.cost) : 'sem custo') + '</b> / ' + typeLabel(p.unit).toLowerCase() + '</div>' +
          (info.length ? '<div style="font-size:11px;color:var(--text-2);">' + info.join(" · ") + '</div>' : '') +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:4px;"><span style="font-size:13px;color:var(--text-2);">R$</span>' +
        '<input class="priceInp" type="number" inputmode="decimal" min="0" step="0.01" data-pid="' + p.id + '" value="' + esc(draft) + '" placeholder="' + (p.cost ? String(p.cost) : "0,00") + '" style="width:86px;padding:9px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:15px;text-align:right;"></div>' +
      '</div>';
    });
  });
  var changed = priceChangedIds().length;
  html += '<div style="position:sticky;bottom:0;background:var(--bg);padding:12px 0 4px 0;margin-top:10px;">' +
    '<button class="btn btn-primary" id="bSavePrices"' + (changed ? '' : ' disabled') + '>Salvar preços' + (changed ? ' (' + changed + ')' : '') + '</button>' +
    (changed ? '<button class="btn btn-secondary" id="bDiscardPrices">Descartar alterações</button>' : '') + '</div>';
  content.innerHTML = html;

  document.getElementById("bPBack").addEventListener("click", function(){ navigate("produtos"); });
  var ps = document.getElementById("pSearch");
  ps.addEventListener("input", function(e){
    priceSearch = e.target.value; renderPrecos();
    var el = document.getElementById("pSearch"); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  });
  content.querySelectorAll("[data-pcat]").forEach(function(c){
    c.addEventListener("click", function(){ priceCatFilter = c.getAttribute("data-pcat"); renderPrecos(); });
  });
  content.querySelectorAll(".priceInp").forEach(function(inp){
    inp.addEventListener("input", function(){
      var pid = inp.getAttribute("data-pid");
      priceDraft[pid] = inp.value;
      var p = products[pid];
      var n = parseFloat(inp.value);
      inp.style.borderColor = (inp.value !== "" && !isNaN(n) && Math.abs(n-(p.cost||0))>1e-9) ? "var(--accent)" : "var(--border)";
      var c2 = priceChangedIds().length;
      var b = document.getElementById("bSavePrices");
      b.disabled = !c2; b.textContent = "Salvar preços" + (c2 ? " (" + c2 + ")" : "");
    });
    inp.addEventListener("blur", function(){ setTimeout(function(){ if (pricePendingRender && currentRoute==="precos") renderPrecos(); }, 50); });
    var pid0 = inp.getAttribute("data-pid"), n0 = parseFloat(inp.value);
    if (inp.value !== "" && !isNaN(n0) && products[pid0] && Math.abs(n0-(products[pid0].cost||0))>1e-9) inp.style.borderColor = "var(--accent)";
  });
  document.getElementById("bSavePrices").addEventListener("click", savePrices);
  var bd = document.getElementById("bDiscardPrices");
  if (bd) bd.addEventListener("click", function(){ priceDraft = {}; renderPrecos(); });
}
function savePrices() {
  var ids = priceChangedIds();
  if (!ids.length) return;
  var btn = document.getElementById("bSavePrices"); btn.disabled = true;
  var done = 0, now = Date.now();
  var chain = Promise.resolve();
  ids.forEach(function(pid){
    chain = chain.then(function(){
      var p = products[pid];
      var n = Math.round(parseFloat(String(priceDraft[pid]).replace(",", ".")) * 100) / 100;
      return db.doc("products/"+pid).update({
        cost: n, previousCost: p.cost || 0, costUpdatedAt: now,
        costUpdatedBy: currentEmployeeId, costUpdatedByName: currentEmployeeName
      }).then(function(){
        delete priceDraft[pid]; done++;
        btn.textContent = "Salvando… " + done + "/" + ids.length;
      });
    });
  });
  chain.then(function(){
    networkCmvCache = {};
    showToast(done + " preço(s) atualizado(s)");
    renderPrecos();
  }).catch(function(err){
    showToast("Erro após " + done + " preço(s): " + errMsg(err));
    renderPrecos();
  });
}

function seedIfNeeded() {
  var seedRef = db.doc("meta/seed");
  return seedRef.acquire({holder:"seed_"+Date.now(), ttlMs:25000}).then(function(acq){
    if (!acq.acquired) return;
    return seedRef.get().then(function(snap){
      if (snap.exists && snap.data() && snap.data().done) return;
      var defaultStores = ["Catarina","Iguatemi","Tradição","Delivery","Eventos","Café"];
      var chain = Promise.resolve();
      defaultStores.forEach(function(name){
        chain = chain.then(function(){ return db.collection("stores").add({name:name, isCentral:false, createdAt:Date.now()}); });
      });
      chain = chain.then(function(){ return db.collection("stores").add({name:"Estoque Central", isCentral:true, createdAt:Date.now()}); });
      return chain.then(function(){ return seedRef.set({done:true, at:Date.now()}); });
    });
  });
}

      if (snap.exists && snap.data() && snap.data().done) return;
      var chain = Promise.resolve();
      DEFAULT_EMPLOYEES.forEach(function(name){
        chain = chain.then(function(){
          return db.collection("employees").add({name:name, role:"Operador de Loja", storeIds:[], active:true, createdAt:Date.now()});
        });
      });
      return chain.then(function(){ return ref.set({done:true, at:Date.now()}); });
    });
  });
}

function seedCatalogIfNeeded() {
  var ref = db.doc("meta/seedCatalog");
  return ref.acquire({holder:"seedcat_"+Date.now(), ttlMs:120000}).then(function(acq){
    if (!acq.acquired) return;
    return ref.get().then(function(snap){
      if (snap.exists && snap.data() && snap.data().done) return;
      return Promise.all([db.collection("categories").get(), db.collection("products").get()]).then(function(results){
        var catMap = {};
        results[0].docs.forEach(function(d){ catMap[(d.data().name||"").trim().toLowerCase()] = d.id; });
        var preexisting = {};
        results[1].docs.forEach(function(d){ preexisting[(d.data().name||"").trim().toLowerCase()] = true; });
        var seen = Object.assign({}, preexisting);
        var chain = Promise.resolve();
        CATALOG.forEach(function(cat){
          var catKey = cat.name.trim().toLowerCase();
          chain = chain.then(function(){
            if (catMap[catKey]) return;
            return db.collection("categories").add({name:cat.name, createdAt:Date.now()}).then(function(docRef){
              catMap[catKey] = docRef.id;
            });
          });
        });
        CATALOG.forEach(function(cat){
          var catKey = cat.name.trim().toLowerCase();
          cat.items.forEach(function(itemName){
            chain = chain.then(function(){
              var key = itemName.trim().toLowerCase();
              var blocked = cat.skipDuplicates ? seen[key] : preexisting[key];
              seen[key] = true;
              if (blocked) return;
              return db.collection("products").add({
                name: itemName, sku:"", categoryId: catMap[catKey]||null, unit:"un",
                minStock:0, cost:0, perishable: !!cat.perishable, createdAt: Date.now()
              });
            });
          });
        });
        return chain.then(function(){ return ref.set({done:true, at:Date.now()}); });
      });
    });
  });
}
var importRunning = false;
function importDefaults(manual) {
  if (importRunning) return Promise.resolve();
  importRunning = true;
  var added = {emp:0, cat:0, prod:0, store:0};
  if (manual) showToast("Importando cadastros…");
  return Promise.all([
    db.collection("stores").get(),
    db.collection("employees").get(),
    db.collection("categories").get(),
    db.collection("products").get()
  ]).then(function(r){
    var storeNames = {}, empNames = {}, catMap = {}, prodNames = {};
    r[0].docs.forEach(function(d){ storeNames[(d.data().name||"").trim().toLowerCase()] = true; });
    r[1].docs.forEach(function(d){ empNames[(d.data().name||"").trim().toLowerCase()] = true; });
    r[2].docs.forEach(function(d){ catMap[(d.data().name||"").trim().toLowerCase()] = d.id; });
    r[3].docs.forEach(function(d){ prodNames[(d.data().name||"").trim().toLowerCase()] = true; });
    var chain = Promise.resolve();
    var defaultStores = [["Catarina",false],["Iguatemi",false],["Tradição",false],["Delivery",false],["Eventos",false],["Café",false],["Estoque Central",true]];
    defaultStores.forEach(function(s){
      if (storeNames[s[0].toLowerCase()]) return;
      chain = chain.then(function(){ return db.collection("stores").add({name:s[0], isCentral:s[1], createdAt:Date.now()}).then(function(){added.store++;}); });
    });
    DEFAULT_EMPLOYEES.forEach(function(name){
      if (empNames[name.toLowerCase()]) return;
      chain = chain.then(function(){ return db.collection("employees").add({name:name, role:"Operador de Loja", storeIds:[], active:true, createdAt:Date.now()}).then(function(){added.emp++;}); });
    });
    CATALOG.forEach(function(cat){
      var k = cat.name.trim().toLowerCase();
      chain = chain.then(function(){
        if (catMap[k]) return;
        return db.collection("categories").add({name:cat.name, createdAt:Date.now()}).then(function(ref){ catMap[k]=ref.id; added.cat++; });
      });
    });
    CATALOG.forEach(function(cat){
      var k = cat.name.trim().toLowerCase();
      cat.items.forEach(function(item){
        chain = chain.then(function(){
          var ik = item.trim().toLowerCase();
          if (prodNames[ik]) return;
          prodNames[ik] = true;
          return db.collection("products").add({name:item, sku:"", categoryId:catMap[k]||null, unit:"un", minStock:0, cost:0, perishable:!!cat.perishable, createdAt:Date.now()}).then(function(){added.prod++;});
        });
      });
    });
    return chain;
  }).then(function(){
    importRunning = false;
    return db.doc("meta/importV2").set({done:true, at:Date.now()}).catch(function(){});
  }).then(function(){
    var total = added.emp + added.cat + added.prod + added.store;
    if (manual || total > 0) showToast(total ? ("Importado: " + added.emp + " funcionários, " + added.prod + " produtos, " + added.cat + " gêneros") : "Todos os cadastros já estavam no sistema");
  }).catch(function(err){
    importRunning = false;
    showToast("Falha na importação: " + errMsg(err));
    if (manual) alert("Não foi possível importar os cadastros.\n\nDetalhe técnico: " + errMsg(err));
  });
}

function errMsg(err) {
  if (!err) return "erro desconhecido";
  if (err.code) return err.code + (err.message ? (": "+err.message) : "");
  return err.message || String(err);
}

var loginScreen = document.getElementById("loginScreen");
function showLogin(msg) {
  document.body.classList.add("locked");
  loginScreen.classList.add("show");
  document.getElementById("lgErr").textContent = msg || "";
  setTimeout(function(){ var u = document.getElementById("lgUser"); if (u && !u.value) u.focus(); }, 50);
}
document.getElementById("loginForm").addEventListener("submit", function(ev){
  ev.preventDefault();
  var user = document.getElementById("lgUser").value, pass = document.getElementById("lgPass").value;
  var btn = document.getElementById("lgBtn");
  btn.disabled = true; btn.textContent = "Entrando…"; document.getElementById("lgErr").textContent = "";
  SB.auth.signIn(user, pass).then(startApp).catch(function(err){
    btn.disabled = false; btn.textContent = "Entrar";
    document.getElementById("lgErr").textContent = err && err.code === "auth_failed" ? "Usuário ou senha incorretos." : ("Não foi possível entrar: " + errMsg(err));
  });
});
SB.auth.onSignedOut(function(){ location.reload(); });

function startApp() {
  var u = SB.auth.user();
  if (!u) { showLogin(); return; }
  db = SB.db;
  db.collection("employees").where("authUserId", "==", u.id).get().then(function(snap){
    if (!snap.docs.length) {
      SB.auth.signOut().then(function(){ showLogin("Seu usuário não está vinculado a nenhum funcionário ativo. Fale com a Diretoria."); });
      return;
    }
    var d = snap.docs[0];
    employees[d.id] = Object.assign({id: d.id}, d.data());
    setOperator(d.id);
    loginScreen.classList.remove("show");
    document.body.classList.remove("locked");
    var btn = document.getElementById("lgBtn"); btn.disabled = false; btn.textContent = "Entrar";
    document.getElementById("lgPass").value = "";
    subscribeGlobal();
    navigate("painel");
  }).catch(function(err){
    showLogin("Erro ao carregar seus dados: " + errMsg(err));
  });
}

function init() {
  if (!SB.configured) {
    showLogin("Sistema não configurado: preencha o arquivo config.js com os dados do Supabase.");
    document.getElementById("lgBtn").disabled = true;
    return;
  }
  if (!SB.auth.hasSession()) { showLogin(); return; }
  SB.auth.restore().then(function(u){ if (u) startApp(); else showLogin(); })
    .catch(function(err){
      if (err && err.code === "unavailable") showLogin("Sem conexão com o servidor. Verifique a internet e tente de novo.");
      else showLogin();
    });
}

init();
})();
