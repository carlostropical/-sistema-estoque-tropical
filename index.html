    '<div class="sub">' + esc(stores[currentStoreId].name) + ' · Nº do pedido gerado automaticamente ao enviar</div>' +
    '<div class="row2"><div class="field"><label>Data do pedido</label><input type="text" value="' + fmtDateShort(todayStr()) + '" disabled></div>' +
    '<div class="field"><label>Horário do pedido</label><input type="text" id="odTimeNow" value="' + nowTimeStr() + '" disabled></div></div>' +
    '<div class="row2"><div class="field"><label>Data da entrega</label><input type="date" id="odDelDate" value="' + tomorrowStr() + '" min="' + todayStr() + '"></div>' +
    '<div class="field"><label>Horário da entrega</label><input type="time" id="odDelTime" value="09:00"></div></div>' +
    destHtml +
    '<div class="chart-title" style="margin-top:4px;">Selecione o gênero para carregar os produtos</div>' +
    '<div class="chip-group" id="odCats" style="margin-bottom:12px;"></div>' +
    '<div id="odSummary" style="font-size:12.5px;color:var(--text-2);margin-bottom:8px;"></div>' +
    '<div id="odItems"></div>' +
    '<div style="display:flex;gap:14px;flex-wrap:wrap;">' +
      '<button class="link-btn" id="bAddOdItem">+ Adicionar produto avulso</button>' +
      '<button class="link-btn link-danger" id="bClearEmpty">Remover itens sem quantidade</button>' +
    '</div>' +
    '<div class="field" style="margin-top:10px;"><label>Observação (opcional)</label><input type="text" id="odNote"></div>' +
    '<div style="position:sticky;bottom:0;background:var(--surface);padding-top:8px;">' +
    '<button class="btn btn-primary" id="bOrderConfirm">Enviar pedido</button>' +
    '<button class="btn btn-secondary" id="bCancel">Cancelar</button></div>';
  openSheet(html);
  orderDraftItems = [];
  renderOrderCatChips();
  renderOrderItemRows();
  document.getElementById("bCancel").addEventListener("click", closeSheet);
  document.getElementById("bAddOdItem").addEventListener("click", function(){ orderDraftItems.push({productId:"",qty:""}); renderOrderItemRows(); });
  document.getElementById("bClearEmpty").addEventListener("click", function(){
    orderDraftItems = orderDraftItems.filter(function(it){ return parseFloat(it.qty) > 0; });
    renderOrderCatChips(); renderOrderItemRows();
  });
  document.getElementById("bOrderConfirm").addEventListener("click", function(){ submitOrder(centralId); });
}
function catProducts(catId) {
  return productOrder.filter(function(pid){ return (products[pid].categoryId || "") === catId; });
}
function isCatLoaded(catId) {
  return orderDraftItems.some(function(it){ return it.catId === catId; });
}
function renderOrderCatChips() {
  var box = document.getElementById("odCats"); if (!box) return;
  box.innerHTML = categoryOrder.filter(function(cid){ return catProducts(cid).length > 0; }).map(function(cid){
    return '<div class="chip' + (isCatLoaded(cid) ? " selected" : "") + '" data-cat="' + cid + '">' + esc(categories[cid].name) + ' (' + catProducts(cid).length + ')</div>';
  }).join("");
  box.querySelectorAll("[data-cat]").forEach(function(ch){
    ch.addEventListener("click", function(){
      var cid = ch.getAttribute("data-cat");
      if (isCatLoaded(cid)) {
        var filled = orderDraftItems.filter(function(it){ return it.catId === cid && parseFloat(it.qty) > 0; }).length;
        if (filled && !window.confirm("Remover o gênero " + categories[cid].name + "? " + filled + " item(ns) já preenchido(s) serão retirados.")) return;
        orderDraftItems = orderDraftItems.filter(function(it){ return it.catId !== cid; });
      } else {
        var present = {};
        orderDraftItems.forEach(function(it){ if (it.productId) present[it.productId] = true; });
        catProducts(cid).forEach(function(pid){
          if (!present[pid]) orderDraftItems.push({productId:pid, qty:"", catId:cid});
        });
      }
      renderOrderCatChips(); renderOrderItemRows();
    });
  });
}
function renderOrderItemRows() {
  var box = document.getElementById("odItems");
  var html = "";
  var lastCat = null;
  orderDraftItems.forEach(function(it, idx){
    var p = it.productId ? products[it.productId] : null;
    var st = scopedStock[it.productId];
    var inStock = st ? st.quantity : 0;
    if (it.catId && p) {
      if (it.catId !== lastCat) {
        html += '<div class="chart-title" style="margin:12px 0 4px 0;">' + esc(categories[it.catId] ? categories[it.catId].name : "") + '</div>';
        lastCat = it.catId;
      }
      var filled = parseFloat(it.qty) > 0;
      html += '<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);">' +
        '<div style="flex:1;min-width:0;"><div style="font-size:14px;' + (filled ? 'font-weight:700;' : '') + '">' + esc(p.name) + (weightLabel(p) ? ' <span style="font-weight:400;color:var(--text-2);font-size:12px;">' + weightLabel(p) + '</span>' : '') + '</div>' +
        '<div style="font-size:11.5px;color:' + (typeof p.minStock==="number" && p.minStock>0 && inStock<=p.minStock ? 'var(--amber)' : 'var(--text-2)') + ';">Em estoque: ' + fmtQty(inStock) + ' ' + esc(p.unit||"un") + '</div></div>' +
        '<input type="number" inputmode="decimal" min="0" step="any" data-idx="' + idx + '" data-f="qty" value="' + esc(it.qty) + '" placeholder="Qtd" style="width:74px;padding:8px;border-radius:8px;border:1px solid ' + (filled ? 'var(--accent)' : 'var(--border)') + ';background:var(--surface-2);color:var(--text);font-size:15px;text-align:right;">' +
        '<button data-rm="' + idx + '" style="background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:0 2px;">✕</button>' +
      '</div>';
      return;
    }
    lastCat = null;
    html += '<div class="item-row" style="margin-top:10px;">' +
      '<div style="display:flex;gap:6px;align-items:center;">' +
        '<select class="pname" data-idx="' + idx + '" data-f="productId" style="flex:1;min-width:0;padding:9px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:14px;"><option value="">Selecione o produto</option>' +
        productOrder.map(function(pid){ return '<option value="'+pid+'"'+(it.productId===pid?" selected":"")+'>'+esc(products[pid].name)+'</option>'; }).join("") + '</select>' +
        '<button data-rm="' + idx + '" style="background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;">✕</button>' +
      '</div>' +
      '<div class="row2" style="margin-top:8px;">' +
        '<div class="field" style="margin-bottom:0;"><label>Em estoque</label><input type="text" value="' + (p ? fmtQty(inStock) + " " + esc(p.unit||"un") : "—") + '" disabled></div>' +
        '<div class="field" style="margin-bottom:0;"><label>Qtd. do pedido</label><input type="number" inputmode="decimal" min="0" step="any" data-idx="' + idx + '" data-f="qty" value="' + esc(it.qty) + '" placeholder="0"></div>' +
      '</div></div>';
  });
  if (!orderDraftItems.length) html = '<div class="empty-state" style="padding:16px;">Toque em um gênero acima para carregar os produtos.</div>';
  box.innerHTML = html;
  updateOrderSummary();
  box.querySelectorAll("select[data-f]").forEach(function(el){
    el.addEventListener("change", function(){
      orderDraftItems[parseInt(el.getAttribute("data-idx"),10)].productId = el.value;
      renderOrderItemRows();
    });
  });
  box.querySelectorAll("input[data-f='qty']").forEach(function(el){
    el.addEventListener("input", function(){
      orderDraftItems[parseInt(el.getAttribute("data-idx"),10)].qty = el.value;
      el.style.borderColor = parseFloat(el.value) > 0 ? "var(--accent)" : "var(--border)";
      updateOrderSummary();
    });
  });
  box.querySelectorAll("[data-rm]").forEach(function(b){
    b.addEventListener("click", function(){
      orderDraftItems.splice(parseInt(b.getAttribute("data-rm"),10),1);
      renderOrderCatChips(); renderOrderItemRows();
    });
  });
}
function updateOrderSummary() {
  var el = document.getElementById("odSummary"); if (!el) return;
  var filled = orderDraftItems.filter(function(it){ return it.productId && parseFloat(it.qty) > 0; }).length;
  el.innerHTML = orderDraftItems.length ? ('<b>' + filled + '</b> item(ns) com quantidade · ' + orderDraftItems.length + ' na lista. Itens sem quantidade não entram no pedido.') : '';
}
function submitOrder(centralId) {
  var valid = orderDraftItems.filter(function(it){ return it.productId && parseFloat(it.qty)>0; });
  if (valid.length===0) { showToast("Adicione ao menos um produto com quantidade"); return; }
  var deliveryDate = document.getElementById("odDelDate").value;
  var deliveryTime = document.getElementById("odDelTime").value;
  if (!deliveryDate) { showToast("Informe a data da entrega"); return; }
  if (!deliveryTime) { showToast("Informe o horário da entrega"); return; }
  var targetSel = document.getElementById("odTarget");
  var target = targetSel ? targetSel.value : "central";
  var supplierId = target.indexOf("sup:")===0 ? target.slice(4) : null;
  var targetStoreId = supplierId ? null : centralId;
  var targetName = supplierId ? suppliers[supplierId].name : stores[centralId].name;
  var items = valid.map(function(it){
    var st = scopedStock[it.productId];
    return {productId:it.productId, productName:products[it.productId].name, unit:products[it.productId].unit||"un",
      stockAtOrder: st ? st.quantity : 0, qty: parseFloat(it.qty)};
  });
  var btn = document.getElementById("bOrderConfirm"); btn.disabled=true; btn.textContent="Gerando nº do pedido…";
  var orderDate = todayStr();
  var orderTime = nowTimeStr();
  nextOrderNumber(orderDate.replace(/-/g,"")).then(function(num){
    return db.collection("orders").add({
      number: num, orderDate: orderDate, orderTime: orderTime,
      deliveryDate: deliveryDate, deliveryTime: deliveryTime,
      storeId: currentStoreId, storeName: stores[currentStoreId].name,
      targetStoreId: targetStoreId, supplierId: supplierId, targetName: targetName,
      items: items, notes: document.getElementById("odNote").value.trim(),
      status: "pendente", createdBy: currentEmployeeId, createdByName: currentEmployeeName, createdAt: Date.now()
    }).then(function(){ return num; });
  }).then(function(num){
    closeSheet(); showToast("Pedido nº " + pad3(num) + " enviado para " + targetName);
  }).catch(function(err){
    showToast("Erro ao enviar pedido: " + errMsg(err)); btn.disabled=false; btn.textContent="Enviar pedido";
  });
}

function findOrder(id) {
  return scopedOrdersMine.concat(scopedOrdersToMe).filter(function(o){ return o.id===id; })[0];
}
function openOrderDetail(id) {
  var o = findOrder(id); if (!o) return;
  var role = currentRole();
  var html = '<h2>' + orderLabel(o) + '</h2>' +
    '<div class="sub">' + esc(o.storeName) + ' → ' + esc(o.targetName) + ' · ' + orderStatusBadge(o) + '</div>' +
    '<div class="item-row">Pedido: <b>' + fmtDateShort(o.orderDate) + ' às ' + esc(o.orderTime) + '</b>' + (o.createdByName?' por '+esc(o.createdByName):'') + '<br>' +
    'Entrega agendada: <b>' + fmtDateShort(o.deliveryDate) + ' às ' + esc(o.deliveryTime) + '</b></div>';
  var fmap = {};
  (o.fulfillment||[]).forEach(function(f){ fmap[f.productId] = f; });
  o.items.forEach(function(it){
    var f = fmap[it.productId];
    var right = 'Pedido: <b>' + fmtQty(it.qty) + ' ' + esc(it.unit) + '</b>';
    if (f) {
      if (f.status === "recusado") right += '<br><span style="color:var(--red);font-weight:700;">Recusado</span><br><span style="font-size:12px;color:var(--text-2)">' + esc(f.reason||"") + '</span>';
      else right += '<br>Enviado: <b style="color:' + (f.qtySent < it.qty ? 'var(--amber)' : 'var(--green)') + ';">' + fmtQty(f.qtySent) + '</b>' + (f.qtySent < it.qty ? ' <span style="font-size:12px;color:var(--amber)">(parcial)</span>' : '');
    } else {
      right += '<br><span style="font-size:12px;color:var(--text-2)">Estoque na hora: ' + fmtQty(it.stockAtOrder) + '</span>';
    }
    html += '<div class="item-row" style="display:flex;justify-content:space-between;gap:8px;"><div>' + esc(it.productName) + '</div>' +
      '<div style="text-align:right;white-space:nowrap;">' + right + '</div></div>';
  });
  if (o.notes) html += '<div class="sub">Obs.: ' + esc(o.notes) + '</div>';
  if (o.fulfilledAt) html += '<div class="sub">Atendido ' + fmtDate(o.fulfilledAt) + (o.fulfilledByName ? ' por ' + esc(o.fulfilledByName) : '') + (o.fulfillNote ? ' — "' + esc(o.fulfillNote) + '"' : '') + '</div>';

  var canFulfill = o.status==="pendente" && o.targetStoreId===currentStoreId && ["Operador de Estoque","Diretoria"].indexOf(role)!==-1;
  var canReceiveSup = o.status==="pendente" && o.supplierId && o.storeId===currentStoreId && canSeeSuppliers();
  var canCancel = o.status==="pendente" && (canEditDelete() || o.createdBy===currentEmployeeId);
  if (canFulfill) html += '<button class="btn btn-primary" id="bFulfill">🚚 Atender pedido</button>';
  if (canReceiveSup) html += '<button class="btn btn-entrada" id="bRecvSup">📥 Receber do fornecedor</button>';
  if (canCancel) html += '<button class="btn btn-secondary" id="bCancelOrder">Cancelar pedido</button>';
  html += '<button class="btn btn-secondary" id="bClose">Fechar</button>';
  openSheet(html);
  document.getElementById("bClose").addEventListener("click", closeSheet);
  var bf = document.getElementById("bFulfill");
  if (bf) bf.addEventListener("click", function(){ openFulfillOrderForm(o); });
  var br = document.getElementById("bRecvSup");
  if (br) br.addEventListener("click", function(){ openReceiveSupplierOrder(o); });
  var bc = document.getElementById("bCancelOrder");
  if (bc) bc.addEventListener("click", function(){
    if (!window.confirm("Cancelar o " + orderLabel(o) + "?")) return;
    db.doc("orders/"+o.id).update({status:"cancelado", cancelledBy: currentEmployeeName, cancelledAt: Date.now()})
      .then(function(){ closeSheet(); showToast("Pedido cancelado"); })
      .catch(function(err){ showToast("Erro: " + errMsg(err)); });
  });
}

// ---------- ATENDER PEDIDO (estoque central) ----------
var fulfillDraft = [];
function openFulfillOrderForm(o) {
  if (!requireRole(["Operador de Estoque","Diretoria"])) return;
  fulfillDraft = o.items.map(function(it){
    var avail = scopedStock[it.productId] ? scopedStock[it.productId].quantity : 0;
    if (avail <= 0) return {qty:"0", status:"recusado", reason:REFUSE_REASONS[0]};
    return {qty:String(Math.min(it.qty, avail)), status:"atendido", reason:""};
  });
  var html = '<h2>Atender ' + orderLabel(o) + '</h2>' +
    '<div class="sub">' + esc(o.storeName) + ' · entrega ' + fmtDateShort(o.deliveryDate) + ' às ' + esc(o.deliveryTime) + '</div>' +
    '<div style="display:flex;font-size:11.5px;font-weight:700;color:var(--text-2);text-transform:uppercase;padding:4px 0;border-bottom:1px solid var(--border);">' +
      '<div style="flex:1;">Produto</div><div style="width:58px;text-align:center;">Pedido</div><div style="width:74px;text-align:center;">Enviado</div></div>' +
    '<div id="ffRows"></div>' +
    '<div id="ffSummary" style="font-size:12.5px;color:var(--text-2);margin:10px 0;"></div>' +
    '<div class="field"><label>Observação para a loja (opcional)</label><input type="text" id="ffNote"></div>' +
    '<div style="position:sticky;bottom:0;background:var(--surface);padding-top:8px;">' +
    '<button class="btn btn-primary" id="bFfOk">Confirmar e enviar</button>' +
    '<button class="btn btn-secondary" id="bFfBack">Voltar</button></div>';
  openSheet(html);
  renderFulfillRows(o);
  document.getElementById("bFfBack").addEventListener("click", function(){ openOrderDetail(o.id); });
  document.getElementById("bFfOk").addEventListener("click", function(){ submitFulfill(o); });
}
function renderFulfillRows(o) {
  var box = document.getElementById("ffRows");
  var html = "";
  o.items.forEach(function(it, i){
    var d = fulfillDraft[i];
    var avail = scopedStock[it.productId] ? scopedStock[it.productId].quantity : 0;
    var p = products[it.productId];
    var refused = d.status === "recusado";
    var q = parseFloat(d.qty) || 0;
    var over = !refused && q > avail;
    var partial = !refused && q < it.qty;
    html += '<div style="padding:10px 0;border-bottom:1px solid var(--border);' + (refused ? 'opacity:.75;' : '') + '">' +
      '<div style="display:flex;align-items:center;">' +
        '<div style="flex:1;min-width:0;"><div style="font-size:14px;font-weight:600;' + (refused ? 'text-decoration:line-through;' : '') + '">' + esc(it.productName) + (p && weightLabel(p) ? ' <span style="font-weight:400;color:var(--text-2);font-size:12px;">' + weightLabel(p) + '</span>' : '') + '</div>' +
          '<div style="font-size:11.5px;color:' + (over || avail < it.qty ? 'var(--red)' : 'var(--text-2)') + ';">Disponível no central: ' + fmtQty(avail) + ' ' + esc(it.unit) + '</div></div>' +
        '<div style="width:58px;text-align:center;font-weight:700;">' + fmtQty(it.qty) + '</div>' +
        '<div style="width:74px;"><input type="number" inputmode="decimal" min="0" step="any" class="ffQty" data-i="' + i + '" value="' + (refused ? "0" : esc(d.qty)) + '"' + (refused ? ' disabled' : '') +
          ' style="width:100%;padding:8px;border-radius:8px;border:1px solid ' + (over ? 'var(--red)' : (partial ? 'var(--amber)' : 'var(--border)')) + ';background:var(--surface-2);color:var(--text);font-size:15px;text-align:right;"></div>' +
      '</div>' +
      '<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">' +
        '<button data-st="atendido" data-i="' + i + '" style="flex:1;padding:8px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;border:1px solid ' + (!refused ? 'var(--green)' : 'var(--border)') + ';background:' + (!refused ? 'var(--green-bg)' : 'var(--surface-2)') + ';color:' + (!refused ? 'var(--green)' : 'var(--text-2)') + ';">✓ Atendido' + (!refused && partial ? ' (parcial)' : '') + '</button>' +
        '<button data-st="recusado" data-i="' + i + '" style="flex:1;padding:8px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;border:1px solid ' + (refused ? 'var(--red)' : 'var(--border)') + ';background:' + (refused ? 'var(--red-bg)' : 'var(--surface-2)') + ';color:' + (refused ? 'var(--red)' : 'var(--text-2)') + ';">✕ Recusado</button>' +
      '</div>' +
      (refused ? '<div class="chip-group" style="margin-top:6px;">' + REFUSE_REASONS.map(function(r){
        return '<div class="chip' + (d.reason===r ? ' selected' : '') + '" data-reason="' + esc(r) + '" data-i="' + i + '" style="font-size:12px;padding:6px 10px;">' + esc(r) + '</div>';
      }).join("") + '</div>' : '') +
    '</div>';
  });
  box.innerHTML = html;
  updateFulfillSummary(o);
  box.querySelectorAll(".ffQty").forEach(function(inp){
    inp.addEventListener("input", function(){
      var i = parseInt(inp.getAttribute("data-i"),10);
      fulfillDraft[i].qty = inp.value;
      var it = o.items[i];
      var avail = scopedStock[it.productId] ? scopedStock[it.productId].quantity : 0;
      var q = parseFloat(inp.value) || 0;
      inp.style.borderColor = q > avail ? "var(--red)" : (q < it.qty ? "var(--amber)" : "var(--border)");
      var ab = box.querySelector('[data-st="atendido"][data-i="' + i + '"]');
      if (ab) ab.textContent = "✓ Atendido" + (q < it.qty ? " (parcial)" : "");
      updateFulfillSummary(o);
    });
  });
  box.querySelectorAll("[data-st]").forEach(function(b){
    b.addEventListener("click", function(){
      var i = parseInt(b.getAttribute("data-i"),10);
      var st = b.getAttribute("data-st");
      var d = fulfillDraft[i], it = o.items[i];
      if (st === "recusado") { d.status = "recusado"; if (!d.reason) d.reason = REFUSE_REASONS[0]; }
      else {
        d.status = "atendido"; d.reason = "";
        if (!(parseFloat(d.qty) > 0)) {
          var avail = scopedStock[it.productId] ? scopedStock[it.productId].quantity : 0;
          d.qty = String(Math.max(0, Math.min(it.qty, avail)));
        }
      }
      renderFulfillRows(o);
    });
  });
  box.querySelectorAll("[data-reason]").forEach(function(c){
    c.addEventListener("click", function(){
      fulfillDraft[parseInt(c.getAttribute("data-i"),10)].reason = c.getAttribute("data-reason");
      renderFulfillRows(o);
    });
  });
}
function updateFulfillSummary(o) {
  var el = document.getElementById("ffSummary"); if (!el) return;
  var at = 0, rec = 0, par = 0;
  o.items.forEach(function(it, i){
    var d = fulfillDraft[i];
    if (d.status === "recusado") rec++;
    else { at++; if ((parseFloat(d.qty)||0) < it.qty) par++; }
  });
  el.innerHTML = '<b style="color:var(--green)">' + at + ' atendido(s)</b>' + (par ? ' (' + par + ' parcial)' : '') + ' · <b style="color:var(--red)">' + rec + ' recusado(s)</b>';
}
function submitFulfill(o) {
  var results = [], toSend = [];
  for (var i=0;i<o.items.length;i++) {
    var it = o.items[i], d = fulfillDraft[i];
    var avail = scopedStock[it.productId] ? scopedStock[it.productId].quantity : 0;
    if (d.status === "recusado") {
      results.push({productId:it.productId, productName:it.productName, unit:it.unit, qtyOrdered:it.qty, qtySent:0, status:"recusado", reason:d.reason||""});
      continue;
    }
    var q = parseFloat(d.qty);
    if (!(q > 0)) { showToast('"' + it.productName + '": informe a quantidade enviada ou marque Recusado'); return; }
    if (q > avail) { showToast('"' + it.productName + '": só há ' + fmtQty(avail) + ' no estoque central'); return; }
    results.push({productId:it.productId, productName:it.productName, unit:it.unit, qtyOrdered:it.qty, qtySent:q, status:"atendido", reason:""});
    toSend.push({productId:it.productId, productName:it.productName, unit:it.unit, qtySent:q, qtyOrdered:it.qty, qtyReceived:null,
      costAtSend: products[it.productId] ? (products[it.productId].cost||0) : 0});
  }
  if (!toSend.length && !window.confirm("Todos os itens estão recusados. Confirmar a recusa do pedido inteiro?")) return;
  var btn = document.getElementById("bFfOk"); btn.disabled = true; btn.textContent = "Enviando…";
  var note = document.getElementById("ffNote").value.trim();
  var originName = stores[currentStoreId].name;
  var partial = results.some(function(r){ return r.status==="recusado" || r.qtySent < r.qtyOrdered; });
  var chain = Promise.resolve();
  toSend.forEach(function(it){
    chain = chain.then(function(){
      var current = scopedStock[it.productId] ? scopedStock[it.productId].quantity : 0;
      return db.doc("stock/"+currentStoreId+"_"+it.productId).set({storeId:currentStoreId, productId:it.productId, quantity:current - it.qtySent, updatedAt:Date.now()})
        .then(function(){
          return db.collection("movements").add({storeId:currentStoreId, storeName:originName, productId:it.productId, productName:it.productName,
            type:"saida", quantity:it.qtySent, employeeId:currentEmployeeId, employeeName:currentEmployeeName,
            note:"Atendimento " + orderLabel(o) + " → " + o.storeName, timestamp:Date.now()});
        });
    });
  });
  var shipmentId = null;
  chain.then(function(){
    if (!toSend.length) return;
    return db.collection("shipments").add({
      originStoreId: currentStoreId, originStoreName: originName,
      destStoreId: o.storeId, destStoreName: o.storeName,
      items: toSend, status: "enviado", notes: note,
      orderId: o.id, orderLabel: orderLabel(o),
      sentBy: currentEmployeeId, sentByName: currentEmployeeName, sentAt: Date.now(),
      receivedBy: null, receivedByName: "", receivedAt: null, receiveNotes: ""
    }).then(function(ref){ shipmentId = ref.id; });
  }).then(function(){
    return db.doc("orders/"+o.id).update({
      status: toSend.length ? "atendido" : "recusado", partial: partial, fulfillment: results,
      shipmentId: shipmentId, fulfillNote: note, fulfilledAt: Date.now(),
      fulfilledBy: currentEmployeeId, fulfilledByName: currentEmployeeName
    });
  }).then(function(){
    closeSheet();
    showToast(toSend.length ? (orderLabel(o) + " enviado" + (partial ? " (parcial)" : "")) : (orderLabel(o) + " recusado"));
  }).catch(function(err){
    showToast("Erro ao atender: " + errMsg(err)); btn.disabled = false; btn.textContent = "Confirmar e enviar";
  });
}

// Recebimento de pedido feito a fornecedor: dá entrada no estoque e registra o valor (custo do cadastro) para o CMV.
function openReceiveSupplierOrder(o) {
  var html = '<h2>Receber do fornecedor</h2><div class="sub">' + orderLabel(o) + ' · ' + esc(o.targetName) + '</div>';
  o.items.forEach(function(it, idx){
    html += '<div class="field"><label>' + esc(it.productName) + ' (pedido: ' + fmtQty(it.qty) + ' ' + esc(it.unit) + ')</label>' +
      '<input type="number" inputmode="decimal" class="supRecv" data-idx="' + idx + '" value="' + it.qty + '" min="0" step="any"></div>';
  });
  html += '<button class="btn btn-primary" id="bSupOk">Confirmar recebimento</button><button class="btn btn-secondary" id="bCancel">Cancelar</button>';
  openSheet(html);
  document.getElementById("bCancel").addEventListener("click", function(){ openOrderDetail(o.id); });
  document.getElementById("bSupOk").addEventListener("click", function(){
    var btn = this; btn.disabled = true; btn.textContent = "Salvando…";
    var inputs = sheet.querySelectorAll(".supRecv");
    var rec = o.items.map(function(it, idx){
      var q = parseFloat(inputs[idx].value) || 0;
      var cost = products[it.productId] ? (products[it.productId].cost||0) : 0;
      return {productId:it.productId, productName:it.productName, qty:q, qtyOrdered:it.qty, unitCost:cost, total:q*cost};
    });
    var storeName = stores[currentStoreId].name;
    var chain = Promise.resolve();
    rec.forEach(function(it){
      if (it.qty <= 0) return;
      chain = chain.then(function(){
        var current = scopedStock[it.productId] ? scopedStock[it.productId].quantity : 0;
        return db.doc("stock/"+currentStoreId+"_"+it.productId).set({storeId:currentStoreId, productId:it.productId, quantity:current+it.qty, updatedAt:Date.now()})
          .then(function(){
            return db.collection("movements").add({storeId:currentStoreId, storeName:storeName, productId:it.productId, productName:it.productName,
              type:"entrada", quantity:it.qty, employeeId:currentEmployeeId, employeeName:currentEmployeeName,
              note:"Recebido do fornecedor - " + orderLabel(o), timestamp:Date.now()});
          });
      });
    });
    chain.then(function(){
      return db.collection("purchases").add({storeId:currentStoreId, storeName:storeName, supplierId:o.supplierId, supplierName:o.targetName,
        items:rec, totalCost: rec.reduce(function(s,i){return s+i.total;},0), date: todayStr(), orderId:o.id, orderLabel: orderLabel(o),
        employeeId:currentEmployeeId, employeeName:currentEmployeeName, createdAt:Date.now()});
    }).then(function(){
      return db.doc("orders/"+o.id).update({status:"recebido", receivedAt:Date.now(), receivedByName:currentEmployeeName});
    }).then(function(){ closeSheet(); showToast("Mercadoria recebida"); })
      .catch(function(err){ showToast("Erro: " + errMsg(err)); btn.disabled=false; btn.textContent="Confirmar recebimento"; });
  });
}

function shipmentStatusBadge(s) {

function shipmentRowHtml(s) {

// ---- Enviar pedido (estoque central -> loja) ----
var shipmentDraftItems = [];
var shipmentFromOrder = null;
function openSendShipmentForm(order) {
  if (!requireRole(["Operador de Estoque","Diretoria"])) return;
  var destOptions = storeOrder.filter(function(id){ return id!==currentStoreId && !stores[id].isCentral; });
  if (destOptions.length===0) { showToast("Cadastre uma loja de destino primeiro"); return; }
  shipmentFromOrder = order || null;
  shipmentDraftItems = order ? order.items.map(function(it){ return {productId:it.productId, qty:String(it.qty)}; }) : [{productId:"", qty:""}];
  var html = '<h2>' + (order ? 'Atender ' + orderLabel(order) : 'Enviar pedido para loja') + '</h2>' +
    (order ? '<div class="sub">Entrega agendada: ' + fmtDateShort(order.deliveryDate) + ' às ' + esc(order.deliveryTime) + '. Ajuste as quantidades se não houver saldo suficiente.</div>' : '') +
    '<div class="field"><label>Loja de destino</label><select id="shDest"' + (order?' disabled':'') + '>' +
    destOptions.map(function(id){return '<option value="'+id+'"'+(order&&order.storeId===id?' selected':'')+'>'+esc(stores[id].name)+'</option>';}).join("") + '</select></div>' +
    '<div id="shItems"></div>' +
    '<button class="link-btn" id="bAddShItem">+ Adicionar item</button>' +
    '<div class="field" style="margin-top:10px;"><label>Observação (opcional)</label><input type="text" id="shNote"></div>' +
    '<button class="btn btn-primary" id="bSendConfirm">Enviar pedido</button>' +
    '<button class="btn btn-secondary" id="bCancel">Cancelar</button>';
  openSheet(html);
  renderShipmentItemRows();
  document.getElementById("bCancel").addEventListener("click", closeSheet);
  document.getElementById("bAddShItem").addEventListener("click", function(){ shipmentDraftItems.push({productId:"",qty:""}); renderShipmentItemRows(); });
  document.getElementById("bSendConfirm").addEventListener("click", submitShipment);
}
function renderShipmentItemRows() {
  var box = document.getElementById("shItems");
  var html = "";
  shipmentDraftItems.forEach(function(it, idx){
    var st = scopedStock[it.productId];
    var avail = st ? st.quantity : (it.productId ? 0 : null);
    html += '<div class="purchase-item-row">' +
      '<select class="pname" data-idx="' + idx + '" data-f="productId"><option value="">Produto</option>' +
      productOrder.map(function(pid){return '<option value="'+pid+'"'+(it.productId===pid?" selected":"")+'>'+esc(products[pid].name)+'</option>';}).join("") + '</select>' +
      '<input class="pqty" type="number" placeholder="Qtd" data-idx="' + idx + '" data-f="qty" value="' + esc(it.qty) + '">' +
      '<button class="rm" data-rm="' + idx + '">✕</button></div>' +
      (avail!==null ? '<div style="font-size:11.5px;color:var(--text-2);margin:-4px 0 6px 2px;">Disponível no estoque central: ' + fmtQty(avail) + '</div>' : '');
  });
  box.innerHTML = html;
  box.querySelectorAll("select,input").forEach(function(el){
    el.addEventListener(el.tagName==="SELECT" ? "change" : "input", function(){
      var idx = parseInt(el.getAttribute("data-idx"),10);
      shipmentDraftItems[idx][el.getAttribute("data-f")] = el.value;
      if (el.tagName==="SELECT") renderShipmentItemRows();
    });
  });
  box.querySelectorAll("[data-rm]").forEach(function(b){
    b.addEventListener("click", function(){
      shipmentDraftItems.splice(parseInt(b.getAttribute("data-rm"),10),1);
      if (shipmentDraftItems.length===0) shipmentDraftItems.push({productId:"",qty:""});
      renderShipmentItemRows();
    });
  });
}
function submitShipment() {
  var destId = document.getElementById("shDest").value;
  var valid = shipmentDraftItems.filter(function(it){ return it.productId && parseFloat(it.qty)>0; });
  if (valid.length===0) { showToast("Adicione ao menos um item válido"); return; }
  for (var i=0;i<valid.length;i++) {
    var st = scopedStock[valid[i].productId];
    var avail = st ? st.quantity : 0;
    if (parseFloat(valid[i].qty) > avail) { showToast('Quantidade de "' + products[valid[i].productId].name + '" maior que o disponível'); return; }
  }
  var btn = document.getElementById("bSendConfirm"); btn.disabled=true; btn.textContent="Enviando…";
  var originName = stores[currentStoreId].name;
  var destName = stores[destId].name;
  var note = document.getElementById("shNote").value.trim();
  var items = valid.map(function(it){
    return {productId:it.productId, productName:products[it.productId].name, unit:products[it.productId].unit||"un",
      qtySent: parseFloat(it.qty), qtyReceived: null, costAtSend: products[it.productId].cost||0};
  });
  var chain = Promise.resolve();
  items.forEach(function(it){
    chain = chain.then(function(){
      var current = scopedStock[it.productId] ? scopedStock[it.productId].quantity : 0;
      var newQty = current - it.qtySent;
      var stockDocId = currentStoreId + "_" + it.productId;
      return db.doc("stock/"+stockDocId).set({storeId:currentStoreId, productId:it.productId, quantity:newQty, updatedAt:Date.now()})
        .then(function(){
          return db.collection("movements").add({
            storeId:currentStoreId, storeName:originName, productId:it.productId, productName:it.productName,
            type:"saida", quantity:it.qtySent, employeeId:currentEmployeeId, employeeName:currentEmployeeName,
            note:"Pedido enviado para "+destName, timestamp:Date.now()
          });
        });
    });
  });
  chain.then(function(){
    return db.collection("shipments").add({
      originStoreId: currentStoreId, originStoreName: originName,
      destStoreId: destId, destStoreName: destName,
      items: items, status: "enviado", notes: note,
      orderId: shipmentFromOrder ? shipmentFromOrder.id : null,
      orderLabel: shipmentFromOrder ? orderLabel(shipmentFromOrder) : "",
      sentBy: currentEmployeeId, sentByName: currentEmployeeName, sentAt: Date.now(),
      receivedBy: null, receivedByName: "", receivedAt: null, receiveNotes: ""
    });
  }).then(function(ref){
    if (shipmentFromOrder) {
      return db.doc("orders/"+shipmentFromOrder.id).update({status:"atendido", shipmentId: ref.id, fulfilledAt: Date.now(), fulfilledByName: currentEmployeeName});
    }
  }).then(function(){ shipmentFromOrder = null; closeSheet(); showToast("Pedido enviado para " + destName); })
    .catch(function(err){ showToast("Erro ao enviar pedido: " + errMsg(err)); btn.disabled=false; btn.textContent="Enviar pedido"; });
}

function openReceiveShipmentForm(shipmentId) {

function submitReceiveShipment(s) {
  var btn = document.getElementById("bConfirmRecv"); btn.disabled=true; btn.textContent="Salvando…";
  var qtyInputs = sheet.querySelectorAll(".recvQty");
  var receivedItems = s.items.map(function(it, idx){
    var q = parseFloat(qtyInputs[idx].value) || 0;
    return Object.assign({}, it, {qtyReceived:q});
  });
  var note = document.getElementById("recvNote").value.trim();
  var hasDivergence = receivedItems.some(function(it){ return it.qtyReceived !== it.qtySent; });
  var destName = stores[currentStoreId].name;
  var kindNote = s.kind==="devolucao" ? "Devolução recebida de "+s.originStoreName : "Recebimento de "+s.originStoreName;
  var chain = Promise.resolve();
  receivedItems.forEach(function(it){
    if (it.qtyReceived>0) {
      chain = chain.then(function(){
        var current = scopedStock[it.productId] ? scopedStock[it.productId].quantity : 0;
        var newQty = current + it.qtyReceived;
        var stockDocId = currentStoreId + "_" + it.productId;
        return db.doc("stock/"+stockDocId).set({storeId:currentStoreId, productId:it.productId, quantity:newQty, updatedAt:Date.now()})
          .then(function(){
            return db.collection("movements").add({
              storeId:currentStoreId, storeName:destName, productId:it.productId, productName:it.productName,
              type:"entrada", quantity:it.qtyReceived, employeeId:currentEmployeeId, employeeName:currentEmployeeName,
              note:kindNote, timestamp:Date.now()
            });
          });
      });
    }
  });
  chain.then(function(){
    return db.doc("shipments/"+s.id).update({
      items: receivedItems, status: hasDivergence ? "recebido_com_divergencia" : "recebido",
      receivedBy: currentEmployeeId, receivedByName: currentEmployeeName, receivedAt: Date.now(), receiveNotes: note
    });
  }).then(function(){
    if (s.orderId) return db.doc("orders/"+s.orderId).update({status:"recebido", receivedAt: Date.now(), receivedByName: currentEmployeeName}).catch(function(){});
  }).then(function(){ closeSheet(); showToast(hasDivergence ? "Recebido com divergência registrada" : "Mercadoria recebida"); })
    .catch(function(){ showToast("Erro ao confirmar recebimento"); btn.disabled=false; btn.textContent="Confirmar recebimento"; });
}

// ---- Informar devolução (loja -> estoque central) ----
var returnDraftItems = [];
function openReturnForm() {

var CMV_ROLES = ["Gerência","Diretoria"];
function canSeeCmv() { return CMV_ROLES.indexOf(currentRole()) !== -1; }
function monthOfTs(ts) { var d = new Date(ts); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }
function shipmentValue(s) {
  return (s.items||[]).reduce(function(sum, it){
    var q = (it.qtyReceived !== null && it.qtyReceived !== undefined) ? it.qtyReceived : it.qtySent;
    return sum + (q||0) * (it.costAtSend||0);
  }, 0);
}
function monthEnd(month) {
  var p = month.split("-"); var d = new Date(parseInt(p[0],10), parseInt(p[1],10), 0);
  return month + "-" + String(d.getDate()).padStart(2,"0");
}
// CMV da loja = (mercadorias enviadas pelo estoque central − devoluções ao central) ÷ vendas da loja
function storeCmv(month) {
  var inShip = scopedShipmentsDest.filter(function(s){ return s.kind!=="devolucao" && s.sentAt && monthOfTs(s.sentAt)===month; });
  var outRet = scopedShipmentsOrigin.filter(function(s){ return s.kind==="devolucao" && s.sentAt && monthOfTs(s.sentAt)===month; });
  var enviado = inShip.reduce(function(a,s){ return a + shipmentValue(s); }, 0);
  var devolvido = outRet.reduce(function(a,s){ return a + shipmentValue(s); }, 0);
  var sales = scopedSales.filter(function(s){ return (s.date||"").indexOf(month)===0; }).reduce(function(a,s){ return a+(s.amount||0); }, 0);
  var mao = scopedCosts.filter(function(c){ return c.month===month && c.pillar==="mao_de_obra"; }).reduce(function(a,c){ return a+(c.amount||0); }, 0);
  var cmv = enviado - devolvido;
  return { enviado:enviado, devolvido:devolvido, cmv:cmv, sales:sales, mao:mao,
    cmvPct: sales>0 ? cmv/sales*100 : 0, cmoPct: sales>0 ? mao/sales*100 : 0,
    shipments: inShip.length, returns: outRet.length };
}

// CMV geral da rede = (Estoque inicial do central + Compras − Estoque final do central) ÷ vendas de todas as lojas
var networkCmvCache = {};
var networkCmvLoading = {};
function fetchNetworkCmv(month) {
  var start = month + "-01", end = monthEnd(month);
  var centralIds = storeOrder.filter(function(id){ return stores[id].isCentral; });
  return Promise.all([
    db.collection("sales").where("date", ">=", start).where("date", "<=", end).get(),
    db.collection("purchases").where("date", ">=", start).where("date", "<=", end).get(),
    db.collection("counts").get(),
    db.collection("costs").where("month", "==", month).get()
  ]).then(function(r){
    var sales = 0, salesByStore = {};
    r[0].docs.forEach(function(d){ var s = d.data(); sales += s.amount||0; salesByStore[s.storeId] = (salesByStore[s.storeId]||0) + (s.amount||0); });
    var compras = 0;
    r[1].docs.forEach(function(d){ compras += d.data().totalCost||0; });
    var counts = r[2].docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
      .filter(function(c){ return centralIds.indexOf(c.storeId) !== -1; })
      .sort(function(a,b){ return (a.date||"").localeCompare(b.date||"") || (a.createdAt||0)-(b.createdAt||0); });
    var ei = null, ef = null;
    counts.forEach(function(c){
      if (c.date < start) ei = c;
      if (c.date >= start && c.date <= end) ef = c;
    });
    var mao = 0;
    r[3].docs.forEach(function(d){ var c = d.data(); if (c.pillar==="mao_de_obra") mao += c.amount||0; });
    var res = { month:month, sales:sales, salesByStore:salesByStore, compras:compras, ei:ei, ef:ef, mao:mao, loadedAt:Date.now() };
    if (ei && ef) {
      res.cmv = (ei.totalValue||0) + compras - (ef.totalValue||0);
      res.cmvPct = sales>0 ? res.cmv/sales*100 : 0;
    }
    res.cmoPct = sales>0 ? mao/sales*100 : 0;
    networkCmvCache[month] = res;
    return res;
  });
}

    html += '<div class="stat-grid">' +

      '<div class="stat-box"><div class="num">' + sc.cmoPct.toFixed(1) + '%</div><div class="label">CMO %</div></div>' +
    '</div>' +
    '<div class="sub" style="font-size:12px;color:var(--text-2);margin-bottom:14px;">Fórmula: (mercadorias enviadas pelo estoque central − devoluções) ÷ vendas lançadas. Valores pelo custo do produto no momento do envio.</div>';

    var last6 = [];
    for (var i=5;i>=0;i--) {
      var d = new Date(); d.setMonth(d.getMonth()-i, 1);
      var ms = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
      var sum = scopedSales.filter(function(s){return (s.date||"").indexOf(ms)===0;}).reduce(function(a,s){return a+(s.amount||0);},0);

    html += '<div class="chart-wrap"><div class="chart-title">Vendas — últimos 6 meses</div>' + barChart(last6) + '</div>';

    var monthSales = scopedSales.filter(function(s){return (s.date||"").indexOf(month)===0;});
    if (monthSales.length===0) {
      html += '<div class="empty-state"><div class="emoji">📈</div>Nenhuma venda lançada neste mês.</div>';
    } else {
      monthSales.slice().sort(function(a,b){return (b.date||"").localeCompare(a.date||"");}).forEach(function(s){
        html += '<div class="move-item"><div class="move-icon entrada">💵</div><div class="move-body">' +

          '<div class="move-qty entrada">' + fmtMoney(s.amount) + '</div></div>';

      bindVendas(isCentralStore);

        .catch(function(err){ networkCmvLoading[month] = false; showToast("Erro ao calcular: " + errMsg(err)); });

    }
    var hasCounts = nc.ei && nc.ef;
    html += '<div class="stat-grid">' +
      '<div class="stat-box"><div class="num">' + fmtMoney(nc.sales) + '</div><div class="label">vendas de todas as lojas</div></div>' +

      '<div class="stat-box"><div class="num">' + (nc.ei ? fmtMoney(nc.ei.totalValue) : '—') + '</div><div class="label">estoque inicial (contagem ' + (nc.ei ? fmtDateShort(nc.ei.date) : 'pendente') + ')</div></div>' +
      '<div class="stat-box"><div class="num">+ ' + fmtMoney(nc.compras) + '</div><div class="label">compras no mês</div></div>' +
      '<div class="stat-box"><div class="num">' + (nc.ef ? '− ' + fmtMoney(nc.ef.totalValue) : '—') + '</div><div class="label">estoque final (contagem ' + (nc.ef ? fmtDateShort(nc.ef.date) : 'pendente') + ')</div></div>' +
      '<div class="stat-box"><div class="num">' + (hasCounts ? fmtMoney(nc.cmv) : '—') + '</div><div class="label">CMV geral R$</div></div>' +
      '<div class="stat-box wide"><div class="num">' + nc.cmoPct.toFixed(1) + '%</div><div class="label">CMO geral % (mão de obra de todas as lojas ÷ vendas)</div></div>' +
    '</div>' +
    '<div class="sub" style="font-size:12px;color:var(--text-2);margin-bottom:10px;">Fórmula: (estoque inicial + compras − estoque final) ÷ vendas da rede. Estoque inicial = última contagem do estoque central antes do mês; estoque final = última contagem dentro do mês.</div>';
    if (!hasCounts) {
      html += '<div class="item-row" style="border-color:var(--amber);">⚠️ Para calcular o CMV geral são necessárias duas contagens do estoque central: uma ' +
        (nc.ei ? '' : '<b>antes de ' + fmtDateShort(month+"-01") + '</b> (estoque inicial)') + (!nc.ei && !nc.ef ? ' e outra ' : '') +
        (nc.ef ? '' : '<b>dentro deste mês</b> (estoque final)') + '. Faça em Estoque → Estoque Central → "Contagem de estoque".</div>';
    }
    html += '<div class="chart-title" style="margin-top:10px;">Vendas por loja no mês</div>';

      html += '<div class="move-item"><div class="move-icon entrada">🏬</div><div class="move-body"><div class="move-title">' + esc(stores[id].name) + '</div></div>' +

    html += '<button class="link-btn" id="bRecalc">🔄 Recalcular</button>';

function toggleTaskItem(taskId, itemId, done) {
  var t = scopedTasks[taskId]; if (!t) return;
  var items = (t.items||[]).map(function(it){ return it.id===itemId ? Object.assign({},it,{done:done}) : it; });
  var allDone = items.length>0 && items.every(function(it){return it.done;});
  db.doc("tasks/"+taskId).update({ items: items, status: allDone ? "concluida" : "pendente" }).then(function(){
    showToast(done ? "Item concluído" : "Item reaberto");
  }).catch(function(){ showToast("Erro ao atualizar"); });
}
function compressImage(file, maxDim, quality) {
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function sha256Hex(str) {
  var enc = new TextEncoder().encode(str);
  return crypto.subtle.digest("SHA-256", enc).then(function(buf){
    return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
  });
}

    document.getElementById("bDirLogin").addEventListener("click", openOperatorPicker);
    return;
  }

  content.innerHTML = html;

    sha256Hex(pass).then(function(hash){
      db.doc("meta/diretoria").get().then(function(snap){
        var stored = snap.exists ? snap.data().passwordHash : null;
        if (stored && stored===hash) { diretoriaUnlocked=true; renderDiretoria(); }
        else showToast("Senha incorreta");
      });

function fetchDiretoriaData() {
  return Promise.all([
    db.collection("shipments").orderBy("sentAt","desc").limit(300).get(),
    db.collection("stock").get()
  ]).then(function(results){
    var shipments = results[0].docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    var stockByStore = {};
    results[1].docs.forEach(function(d){
      var data = d.data();
      var sId = data.storeId;
      if (!stockByStore[sId]) stockByStore[sId] = {itemCount:0, value:0};
      var prod = products[data.productId];
      var cost = prod ? (prod.cost||0) : 0;
      stockByStore[sId].itemCount += 1;
      stockByStore[sId].value += (data.quantity||0) * cost;
    });
    diretoriaData = {shipments:shipments, stockByStore:stockByStore};
    return diretoriaData;
  });
}

];
var GROUPS = [{v:"produto",l:"Produto"},{v:"dia",l:"Dia"},{v:"semana",l:"Semana"},{v:"mes",l:"Mês"},{v:"loja",l:"Loja"}];
var repState = { type:"entregues", period:"mes", day:"", month:"", from:"", to:"", store:"", cat:"", group:"produto", onlyDiv:false, topBy:"qty" };
var repData = null, repLoading = false, repOpen = {};

function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function dateFromStr(s) { var p = String(s).split("-"); return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2]||"1",10)); }
function weekStart(d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); var wd = (x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
function fmtDM(d) { return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0"); }
function monthLabel(m) { var d = dateFromStr(m + "-01"); return d.toLocaleDateString("pt-BR", {month:"long", year:"numeric"}); }

function repRange() {
  var s = repState, a, b, label;
  if (s.period === "dia") {
    a = dateFromStr(s.day); b = new Date(a); b.setDate(b.getDate()+1);
    label = a.toLocaleDateString("pt-BR", {weekday:"long", day:"2-digit", month:"2-digit", year:"numeric"});
  } else if (s.period === "semana") {
    a = weekStart(dateFromStr(s.day)); b = new Date(a); b.setDate(b.getDate()+7);
    var last = new Date(b); last.setDate(last.getDate()-1);
    label = "Semana de " + fmtDM(a) + " a " + fmtDM(last) + "/" + last.getFullYear();
  } else if (s.period === "mes") {
    a = dateFromStr(s.month + "-01"); b = new Date(a.getFullYear(), a.getMonth()+1, 1);
    label = monthLabel(s.month);
  } else {
    var f = s.from || todayStr(), t = s.to || f;
    if (t < f) { var tmp = f; f = t; t = tmp; }
    a = dateFromStr(f); b = dateFromStr(t); b.setDate(b.getDate()+1);
    label = fmtDateShort(f) + " a " + fmtDateShort(t);
  }
  var lastDay = new Date(b); lastDay.setDate(lastDay.getDate()-1);
  return { start: a.getTime(), end: b.getTime(), startStr: ymd(a), endStr: ymd(lastDay), label: label };
}
function inRange(ts, r) { return typeof ts === "number" && ts >= r.start && ts < r.end; }
function inRangeStr(ds, r) { return !!ds && ds >= r.startStr && ds <= r.endStr; }
function storeOk(id) { return !repState.store || id === repState.store; }
function prodCat(pid) { var p = products[pid]; return p && p.categoryId && categories[p.categoryId] ? p.categoryId : "_none"; }
function catOk(pid) { return !repState.cat || prodCat(pid) === repState.cat; }
function catName(cid) { return cid === "_none" ? "Sem gênero" : (categories[cid] ? categories[cid].name : "—"); }
function storeName(id) { return stores[id] ? stores[id].name : "—"; }
function unitOf(pid, fallback) { return fallback || (products[pid] && products[pid].unit) || "un"; }
function costOf(pid) { return products[pid] ? (products[pid].cost || 0) : 0; }

function loadReportData() {
  if (repLoading) return;
  repLoading = true;
  Promise.all([
    db.collection("shipments").orderBy("sentAt", "desc").limit(1000).get(),
    db.collection("orders").orderBy("createdAt", "desc").limit(1000).get(),
    db.collection("movements").where("type", "==", "perda").orderBy("timestamp", "desc").limit(1000).get(),
    db.collection("purchases").orderBy("date", "desc").limit(1000).get()
  ]).then(function(r){
    function rows(snap) { return snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); }
    repData = { shipments: rows(r[0]), orders: rows(r[1]), losses: rows(r[2]), purchases: rows(r[3]), loadedAt: Date.now() };
    repLoading = false;
    if (currentRoute === "relatorios") renderRelatorios();
  }).catch(function(err){
    repLoading = false;
    content.innerHTML = '<div class="empty-state"><div class="emoji">⚠️</div>Não foi possível carregar os relatórios.<br>' + esc(errMsg(err)) + '</div>';
  });
}

// ---- linhas de cada relatório: {ts, storeId, productId, name, unit, qty, value, note, sent, received} ----
function repRows(type, r) {
  var out = [];
  var D = repData;
  if (type === "entregues" || type === "top10" || type === "genero") {
    D.shipments.forEach(function(s){
      if (s.kind === "devolucao" || !inRange(s.sentAt, r) || !storeOk(s.destStoreId)) return;
      (s.items||[]).forEach(function(it){
        if (!catOk(it.productId)) return;
        var q = it.qtySent || 0;
        out.push({ts:s.sentAt, storeId:s.destStoreId, productId:it.productId, name:it.productName, unit:unitOf(it.productId, it.unit),
          qty:q, value:q*(it.costAtSend||0), note:(s.orderLabel||"Envio avulso") + " · de " + (s.originStoreName||""),
          received: (it.qtyReceived===null||it.qtyReceived===undefined) ? null : it.qtyReceived, cost: it.costAtSend||0});
      });
    });
  } else if (type === "recebidas") {
    D.shipments.forEach(function(s){
      if (!s.receivedAt || !inRange(s.receivedAt, r) || !storeOk(s.destStoreId)) return;
      (s.items||[]).forEach(function(it){
        if (!catOk(it.productId)) return;
        var q = it.qtyReceived || 0;
        out.push({ts:s.receivedAt, storeId:s.destStoreId, productId:it.productId, name:it.productName, unit:unitOf(it.productId, it.unit),
          qty:q, value:q*(it.costAtSend||0), note:(s.kind==="devolucao" ? "Devolução de " : "Enviado por ") + (s.originStoreName||"") + (s.receivedByName ? " · conferido por " + s.receivedByName : "")});
      });
    });
    var showSup = canSeeSuppliers();
    D.purchases.forEach(function(pu){
      if (!inRangeStr(pu.date, r) || !storeOk(pu.storeId)) return;
      (pu.items||[]).forEach(function(it){
        if (!catOk(it.productId) || !(it.qty > 0)) return;
        out.push({ts:dateFromStr(pu.date).getTime() + 12*3600e3, storeId:pu.storeId, productId:it.productId, name:it.productName, unit:unitOf(it.productId),
          qty:it.qty, value:it.total || it.qty*(it.unitCost||0), note: showSup ? "Fornecedor: " + (pu.supplierName||"—") : "Compra de fornecedor"});
      });
    });
  } else if (type === "xrecebido") {
    D.shipments.forEach(function(s){
      if (s.kind === "devolucao" || !s.receivedAt || !inRange(s.sentAt, r) || !storeOk(s.destStoreId)) return;
      (s.items||[]).forEach(function(it){
        if (!catOk(it.productId)) return;
        var sent = it.qtySent || 0, rec = it.qtyReceived || 0;
        if (repState.onlyDiv && Math.abs(rec - sent) < 1e-9) return;
        out.push({ts:s.sentAt, storeId:s.destStoreId, productId:it.productId, name:it.productName, unit:unitOf(it.productId, it.unit),
          qty:sent, sent:sent, received:rec, value:(rec-sent)*(it.costAtSend||0),
          note:(s.orderLabel||"Envio") + (s.receiveNotes ? " · obs.: " + s.receiveNotes : "")});
      });
    });
  } else if (type === "devolvidos") {
    D.shipments.forEach(function(s){
      if (s.kind !== "devolucao" || !inRange(s.sentAt, r) || !storeOk(s.originStoreId)) return;
      (s.items||[]).forEach(function(it){
        if (!catOk(it.productId)) return;
        var q = it.qtySent || 0;
        out.push({ts:s.sentAt, storeId:s.originStoreId, productId:it.productId, name:it.productName, unit:unitOf(it.productId, it.unit),
          qty:q, value:q*(it.costAtSend||0), note:"Motivo: " + (s.notes || "não informado") + (s.receivedAt ? " · recebido no central" : " · aguardando conferência")});
      });
    });
  } else if (type === "faltas") {
    D.orders.forEach(function(o){
      if (!o.fulfillment || !inRange(o.createdAt, r) || !storeOk(o.storeId)) return;
      o.fulfillment.forEach(function(f){
        if (!catOk(f.productId)) return;
        var miss = f.status === "recusado" ? (f.qtyOrdered||0) : Math.max(0, (f.qtyOrdered||0) - (f.qtySent||0));
        if (!(miss > 0)) return;
        out.push({ts:o.createdAt, storeId:o.storeId, productId:f.productId, name:f.productName, unit:unitOf(f.productId, f.unit),
          qty:miss, value:miss*costOf(f.productId),
          note:(f.status === "recusado" ? "Recusado — " + (f.reason || "sem motivo") : "Envio parcial (pedido " + fmtQty(f.qtyOrdered) + ", enviado " + fmtQty(f.qtySent) + ")") + " · " + orderLabel(o)});
      });
    });
  } else if (type === "descartes") {
    D.losses.forEach(function(m){
      if (!inRange(m.timestamp, r) || !storeOk(m.storeId) || !catOk(m.productId)) return;
      out.push({ts:m.timestamp, storeId:m.storeId, productId:m.productId, name:m.productName, unit:unitOf(m.productId),
        qty:m.quantity||0, value:(m.quantity||0)*costOf(m.productId), note:(m.note ? "Motivo: " + m.note : "Sem observação") + (m.employeeName ? " · " + m.employeeName : "")});
    });
  }
  return out;
}

function groupKey(row, g) {
  var d = new Date(row.ts);
  if (g === "dia") return {k: ymd(d), l: d.toLocaleDateString("pt-BR", {weekday:"short", day:"2-digit", month:"2-digit"})};
  if (g === "semana") { var w = weekStart(d), e = new Date(w); e.setDate(e.getDate()+6); return {k: ymd(w), l: "Semana " + fmtDM(w) + " a " + fmtDM(e)}; }
  if (g === "mes") { var m = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); return {k: m, l: monthLabel(m)}; }
  if (g === "loja") return {k: row.storeId || "_", l: storeName(row.storeId)};
  return {k: row.productId, l: row.name};
}
function sumByProduct(rows) {
  var m = {}, order = [];
  rows.forEach(function(r){
    if (!m[r.productId]) { m[r.productId] = {productId:r.productId, name:r.name, unit:r.unit, qty:0, value:0, sent:0, received:0, n:0, rows:[]}; order.push(r.productId); }
    var a = m[r.productId]; a.qty += r.qty; a.value += r.value; a.n++; a.rows.push(r);
    if (r.sent !== undefined) { a.sent += r.sent; a.received += r.received; }
  });
  return order.map(function(k){ return m[k]; });
}

function renderRelatorios() {
  if (!canSeeReports()) {
    content.innerHTML = '<div class="empty-state"><div class="emoji">🔒</div>Relatórios são exclusivos para Operador de Estoque, Gerência e Diretoria.' +
      (currentEmployeeId ? '' : '<br>Escolha quem está usando o sistema (Gerência e Diretoria entram com o PIN).') + '</div>' +
      '<button class="btn btn-primary" id="rpWho">' + (currentEmployeeId ? 'Trocar usuário' : 'Escolher usuário') + '</button>';
    document.getElementById("rpWho").addEventListener("click", openOperatorPicker);
    return;
  }
  if (!repState.day) repState.day = todayStr();
  if (!repState.month) repState.month = currentMonthStr();
  if (!repState.from) { var d0 = new Date(); d0.setDate(d0.getDate()-6); repState.from = ymd(d0); repState.to = todayStr(); }
  if (!repData) { content.innerHTML = '<div class="loading-msg">Carregando relatórios…</div>'; loadReportData(); return; }

  var s = repState, r = repRange(), money = canSeeCmv();
  var html = '<div class="section-head"><h2>Relatórios</h2><button class="link-btn" id="rpReload">🔄 Atualizar</button></div>';

  // tipo de relatório
  html += '<div class="chip-scroll" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;">' +
    REPORT_TYPES.map(function(t){ return '<div class="chip' + (s.type===t.v?" selected":"") + '" data-rtype="' + t.v + '" style="white-space:nowrap;">' + t.l + '</div>'; }).join("") + '</div>';

  // período
  html += '<div class="item-row" style="margin-bottom:12px;">' +
    '<div class="chip-group" style="margin-bottom:10px;">' +
      [["dia","Dia"],["semana","Semana"],["mes","Mês"],["periodo","Período"]].map(function(p){
        return '<div class="chip' + (s.period===p[0]?" selected":"") + '" data-rperiod="' + p[0] + '">' + p[1] + '</div>'; }).join("") +
    '</div>';
  if (s.period === "dia" || s.period === "semana") html += '<div class="field" style="margin-bottom:8px;"><label>' + (s.period==="dia" ? "Dia" : "Qualquer dia da semana") + '</label><input type="date" id="rpDay" value="' + s.day + '"></div>';
  else if (s.period === "mes") html += '<div class="field" style="margin-bottom:8px;"><label>Mês</label><input type="month" id="rpMonth" value="' + s.month + '"></div>';
  else html += '<div class="row2"><div class="field" style="margin-bottom:8px;"><label>De</label><input type="date" id="rpFrom" value="' + s.from + '"></div><div class="field" style="margin-bottom:8px;"><label>Até</label><input type="date" id="rpTo" value="' + s.to + '"></div></div>';
  html += '<div class="row2">' +
    '<div class="field" style="margin-bottom:0;"><label>Loja</label><select id="rpStore"><option value="">Todas</option>' +
      storeOrder.map(function(id){ return '<option value="' + id + '"' + (s.store===id?" selected":"") + '>' + esc(stores[id].name) + '</option>'; }).join("") + '</select></div>' +
    '<div class="field" style="margin-bottom:0;"><label>Gênero</label><select id="rpCat"><option value="">Todos</option>' +
      categoryOrder.map(function(id){ return '<option value="' + id + '"' + (s.cat===id?" selected":"") + '>' + esc(categories[id].name) + '</option>'; }).join("") +
      '<option value="_none"' + (s.cat==="_none"?" selected":"") + '>Sem gênero</option></select></div>' +
  '</div></div>';

  html += '<div style="font-size:13px;color:var(--text-2);margin-bottom:10px;">📅 <b style="color:var(--text);">' + esc(r.label) + '</b>' +
    (s.store ? ' · ' + esc(storeName(s.store)) : ' · todas as lojas') + (s.cat ? ' · ' + esc(catName(s.cat)) : '') + '</div>';

  if (s.type === "top10") html += renderTop10(r, money);
  else if (s.type === "genero") html += renderPorGenero(r, money);
  else html += renderListReport(s.type, r, money);

  html += '<div style="font-size:11.5px;color:var(--text-2);margin-top:14px;">Dados carregados às ' + new Date(repData.loadedAt).toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"}) + '. Toque em Atualizar para ver lançamentos mais recentes.</div>';
  content.innerHTML = html;
  bindRelatorios();
}

var REPORT_HELP = {
  entregues: "Mercadorias enviadas pelo estoque central para as lojas.",
  recebidas: "Tudo que foi conferido e recebido: envios do central, devoluções recebidas e compras de fornecedores.",
  xrecebido: "Compara, item a item, o que o central enviou com o que a loja conferiu ao receber.",
  devolvidos: "Mercadorias devolvidas pelas lojas ao estoque central.",
  faltas: "Itens pedidos pelas lojas que o central recusou ou enviou a menos.",
  descartes: "Perdas registradas no estoque (produto vencido, estragado, quebrado etc.)."
};

function renderListReport(type, r, money) {
  var s = repState, rows = repRows(type, r);
  var xr = type === "xrecebido";
  var h = '<div style="font-size:12.5px;color:var(--text-2);margin-bottom:10px;">' + REPORT_HELP[type] + '</div>';
  if (xr) h += '<div class="checkbox-row"><input type="checkbox" id="rpOnlyDiv"' + (s.onlyDiv?" checked":"") + '><label for="rpOnlyDiv">Mostrar só divergências</label></div>';

  var totalVal = rows.reduce(function(a,x){ return a + x.value; }, 0);
  var prods = sumByProduct(rows);
  h += '<div class="stat-grid">' +
    '<div class="stat-box"><div class="num">' + rows.length + '</div><div class="label">lançamentos</div></div>' +
    '<div class="stat-box"><div class="num">' + prods.length + '</div><div class="label">produtos diferentes</div></div>';
  if (xr) {
    var div = rows.filter(function(x){ return Math.abs(x.received - x.sent) > 1e-9; });
    h += '<div class="stat-box"><div class="num" style="color:' + (div.length ? 'var(--red)' : 'var(--green)') + ';">' + div.length + '</div><div class="label">itens com divergência</div></div>';
    if (money) h += '<div class="stat-box"><div class="num" style="color:' + (totalVal < 0 ? 'var(--red)' : 'var(--text)') + ';">' + fmtMoney(totalVal) + '</div><div class="label">diferença em valor</div></div>';
  } else if (money) {
    h += '<div class="stat-box wide"><div class="num">' + fmtMoney(totalVal) + '</div><div class="label">valor total (custo)</div></div>';
  }
  h += '</div>';

  if (!rows.length) return h + '<div class="empty-state"><div class="emoji">📭</div>Nada encontrado neste período.</div>';

  h += '<div style="display:flex;align-items:center;gap:8px;margin:4px 0 8px 0;flex-wrap:wrap;"><span style="font-size:12.5px;font-weight:700;color:var(--text-2);">Agrupar por:</span>' +
    GROUPS.map(function(g){ return '<div class="chip' + (s.group===g.v?" selected":"") + '" data-rgroup="' + g.v + '" style="padding:6px 11px;font-size:12.5px;">' + g.l + '</div>'; }).join("") + '</div>';

  if (s.group === "produto") {
    prods.sort(function(a,b){ return a.name.localeCompare(b.name, "pt-BR"); });
    prods.forEach(function(p){ h += productBlock(p, xr, money, "p:" + p.productId, true); });
  } else {
    var groups = {}, order = [];
    rows.forEach(function(x){
      var g = groupKey(x, s.group);
      if (!groups[g.k]) { groups[g.k] = {label:g.l, rows:[]}; order.push(g.k); }
      groups[g.k].rows.push(x);
    });
    order.sort(); if (s.group !== "loja") order.reverse();
    if (s.group === "loja") order.sort(function(a,b){ return groups[a].label.localeCompare(groups[b].label, "pt-BR"); });
    order.forEach(function(k){
      var g = groups[k], gp = sumByProduct(g.rows), gv = g.rows.reduce(function(a,x){ return a + x.value; }, 0);
      var open = repOpen["g:" + s.group + k] !== false;
      h += '<div data-rtoggle="g:' + s.group + k + '" style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px 0;cursor:pointer;">' +
        '<div style="font-size:14px;font-weight:800;">' + (open ? "▾ " : "▸ ") + esc(g.label) + ' <span style="font-weight:500;color:var(--text-2);font-size:12.5px;">(' + gp.length + ' produto' + (gp.length===1?'':'s') + ')</span></div>' +
        (money ? '<div style="font-weight:700;font-size:13.5px;">' + fmtMoney(gv) + '</div>' : '') + '</div>';
      if (!open) return;
      gp.sort(function(a,b){ return a.name.localeCompare(b.name, "pt-BR"); });
      gp.forEach(function(p){ h += productBlock(p, xr, money, "g:" + s.group + k + ":" + p.productId, false); });
    });
  }
  return h;
}

function productBlock(p, xr, money, key, expandable) {
  var open = !!repOpen[key];
  var right;
  if (xr) {
    var diff = p.received - p.sent, bad = Math.abs(diff) > 1e-9;
    right = '<div style="text-align:right;white-space:nowrap;font-size:13px;">Env.: <b>' + fmtQty(p.sent) + '</b> · Rec.: <b style="color:' + (bad ? 'var(--red)' : 'var(--green)') + ';">' + fmtQty(p.received) + '</b>' +
      (bad ? '<br><span style="color:var(--red);font-weight:700;">' + (diff > 0 ? "+" : "") + fmtQty(diff) + ' ' + esc(p.unit) + (money ? ' · ' + fmtMoney(p.value) : '') + '</span>' : '') + '</div>';
  } else {
    right = '<div style="text-align:right;white-space:nowrap;"><div style="font-weight:700;">' + fmtQty(p.qty) + ' <span style="font-size:12px;color:var(--text-2);font-weight:500;">' + esc(p.unit) + '</span></div>' +
      (money ? '<div style="font-size:12px;color:var(--text-2);">' + fmtMoney(p.value) + '</div>' : '') + '</div>';
  }
  var h = '<div' + (expandable ? ' data-rtoggle="' + key + '"' : '') + ' style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);' + (expandable ? 'cursor:pointer;' : '') + '">' +
    '<div style="min-width:0;"><div style="font-size:14px;font-weight:600;">' + (expandable ? (open ? "▾ " : "▸ ") : "") + esc(p.name) + '</div>' +
    '<div style="font-size:11.5px;color:var(--text-2);">' + p.n + ' lançamento' + (p.n===1?'':'s') + '</div></div>' + right + '</div>';
  if (expandable && open) {
    p.rows.slice().sort(function(a,b){ return b.ts - a.ts; }).forEach(function(x){
      h += '<div style="padding:6px 0 6px 18px;border-bottom:1px dashed var(--border);font-size:12.5px;">' +
        '<div style="display:flex;justify-content:space-between;gap:8px;"><span><b>' + fmtDate(x.ts) + '</b> · ' + esc(storeName(x.storeId)) + '</span>' +
        '<span style="white-space:nowrap;">' + (xr ? fmtQty(x.sent) + ' → ' + fmtQty(x.received) : fmtQty(x.qty) + ' ' + esc(x.unit)) + '</span></div>' +
        '<div style="color:var(--text-2);">' + esc(x.note || "") + '</div></div>';
    });
  }
  return h;
}

function renderTop10(r, money) {
  var s = repState;
  var rows = repRows("top10", r);
  var ret = {}, retVal = {};
  repData.shipments.forEach(function(sh){
    if (sh.kind !== "devolucao" || !inRange(sh.sentAt, r) || !storeOk(sh.originStoreId)) return;
    (sh.items||[]).forEach(function(it){
      if (!catOk(it.productId)) return;
      ret[it.productId] = (ret[it.productId]||0) + (it.qtySent||0);
      retVal[it.productId] = (retVal[it.productId]||0) + (it.qtySent||0) * (it.costAtSend||0);
    });
  });
  var prods = sumByProduct(rows.map(function(x){
    var q = x.received !== null ? x.received : x.qty;
    return Object.assign({}, x, {qty:q, value:q*(x.cost||0)});
  }));
  prods.forEach(function(p){ p.qty -= (ret[p.productId] || 0); p.value = Math.max(0, p.value - (retVal[p.productId] || 0)); });
  prods = prods.filter(function(p){ return p.qty > 0; });
  prods.sort(function(a,b){ return s.topBy === "valor" ? b.value - a.value : b.qty - a.qty; });
  var top = prods.slice(0, 10);

  var h = '<div style="font-size:12.5px;color:var(--text-2);margin-bottom:10px;">Produtos mais consumidos pelas lojas: recebido do estoque central, descontadas as devoluções. ' +
    'As vendas são lançadas como valor total do dia, então este ranking usa o consumo como referência dos mais vendidos.</div>';
  h += '<div class="chip-group" style="margin-bottom:12px;">' +
    '<div class="chip' + (s.topBy!=="valor"?" selected":"") + '" data-rtop="qty">Por quantidade</div>' +
    (money ? '<div class="chip' + (s.topBy==="valor"?" selected":"") + '" data-rtop="valor">Por valor</div>' : '') + '</div>';
  if (!top.length) return h + '<div class="empty-state"><div class="emoji">📭</div>Nenhum consumo registrado neste período.</div>';
  var max = s.topBy === "valor" ? top[0].value : top[0].qty;
  top.forEach(function(p, i){
    var v = s.topBy === "valor" ? p.value : p.qty;
    var pct = max > 0 ? Math.max(4, v / max * 100) : 0;
    h += '<div style="padding:9px 0;border-bottom:1px solid var(--border);">' +
      '<div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline;">' +
        '<div style="font-size:14px;font-weight:600;min-width:0;"><span style="display:inline-block;width:26px;color:var(--text-2);font-weight:800;">' + (i+1) + 'º</span>' + esc(p.name) + '</div>' +
        '<div style="white-space:nowrap;font-weight:700;">' + fmtQty(p.qty) + ' <span style="font-size:12px;color:var(--text-2);font-weight:500;">' + esc(p.unit) + '</span>' +
          (money ? '<span style="font-size:12px;color:var(--text-2);font-weight:500;"> · ' + fmtMoney(p.value) + '</span>' : '') + '</div></div>' +
      '<div style="height:6px;background:var(--surface-2);border-radius:4px;margin:6px 0 0 26px;"><div style="height:6px;width:' + pct.toFixed(1) + '%;background:var(--accent);border-radius:4px;"></div></div>' +
    '</div>';
  });
  return h;
}

function renderPorGenero(r, money) {
  var agg = {};
  function add(type, field, isQty) {
    repRows(type, r).forEach(function(x){
      var c = prodCat(x.productId);
      if (!agg[c]) agg[c] = {ent:0, entQ:0, dev:0, devQ:0, desc:0, descQ:0, falta:0, faltaN:0, prods:{}};
      agg[c][field] += x.value; agg[c][field + "Q"] = (agg[c][field + "Q"]||0) + 1;
      if (field === "ent") agg[c].prods[x.productId] = true;
    });
  }
  add("entregues", "ent"); add("devolvidos", "dev"); add("descartes", "desc"); add("faltas", "falta");
  var keys = Object.keys(agg).sort(function(a,b){ return catName(a).localeCompare(catName(b), "pt-BR"); });
  var h = '<div style="font-size:12.5px;color:var(--text-2);margin-bottom:10px;">Resumo por gênero no período. Toque em um gênero para ver os itens entregues dele.</div>';
  if (!keys.length) return h + '<div class="empty-state"><div class="emoji">📭</div>Nenhuma movimentação neste período.</div>';
  var tot = {ent:0, dev:0, desc:0, falta:0};
  keys.forEach(function(k){
    var a = agg[k];
    tot.ent += a.ent; tot.dev += a.dev; tot.desc += a.desc; tot.falta += a.falta;
    function cell(label, val, n, color) {
      return '<div style="flex:1;min-width:70px;"><div style="font-size:11px;color:var(--text-2);">' + label + '</div>' +
        '<div style="font-weight:700;font-size:13.5px;color:' + (color||'var(--text)') + ';">' + (money ? fmtMoney(val) : (n||0) + ' lanç.') + '</div></div>';
    }
    h += '<div class="card" data-rcat="' + k + '" style="flex-direction:column;align-items:stretch;gap:8px;">' +
      '<div style="display:flex;justify-content:space-between;"><div class="name">' + esc(catName(k)) + '</div>' +
      '<div style="font-size:12px;color:var(--text-2);">' + Object.keys(a.prods).length + ' produto(s) entregue(s)</div></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
        cell("Entregue", a.ent, a.entQ) + cell("Devolvido", a.dev, a.devQ, a.devQ ? 'var(--amber)' : null) +
        cell("Descartado", a.desc, a.descQ, a.descQ ? 'var(--red)' : null) + cell("Faltas", a.falta, a.faltaQ, a.faltaQ ? 'var(--red)' : null) +
      '</div></div>';
  });
  if (money) h += '<div class="item-row" style="font-size:13px;"><b>Total:</b> entregue ' + fmtMoney(tot.ent) + ' · devolvido ' + fmtMoney(tot.dev) + ' · descartado ' + fmtMoney(tot.desc) + ' · faltas ' + fmtMoney(tot.falta) + '</div>';
  return h;
}
