<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Gestão Operacional</title>
<meta name="theme-color" content="#2f6fed">
<script src="config.js"></script>
<script src="sbdb.js"></script>
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f1f4;
    --text: #17181c; --text-2: #6b7078; --border: #e4e5e9;
    --accent: #2f6fed; --accent-2: #e8f0ff;
    --green: #1a9c5f; --green-bg: #e6f7ee;
    --red: #d64545; --red-bg: #fdeaea;
    --amber: #b8860b; --amber-bg: #fff6e0;
    --purple: #7c4fd6; --purple-bg: #f1eaff;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(20,20,30,0.08), 0 1px 2px rgba(20,20,30,0.04);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131417; --surface: #1c1d21; --surface-2: #232428;
      --text: #f0f0f2; --text-2: #9a9ca3; --border: #2d2e33;
      --accent: #6f9bf5; --accent-2: #1c2740;
      --green: #4fd18e; --green-bg: #123626;
      --red: #ef7070; --red-bg: #3a1e1e;
      --amber: #e0b13a; --amber-bg: #3a2f10;
      --purple: #a685f0; --purple-bg: #291f3d;
      --shadow: 0 1px 3px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #131417; --surface: #1c1d21; --surface-2: #232428;
    --text: #f0f0f2; --text-2: #9a9ca3; --border: #2d2e33;
    --accent: #6f9bf5; --accent-2: #1c2740;
    --green: #4fd18e; --green-bg: #123626;
    --red: #ef7070; --red-bg: #3a1e1e;
    --amber: #e0b13a; --amber-bg: #3a2f10;
    --purple: #a685f0; --purple-bg: #291f3d;
    --shadow: 0 1px 3px rgba(0,0,0,0.4);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; }
  #app { display:flex; flex-direction:column; height:100%; max-width:680px; margin:0 auto; }

  header.topbar { position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
  .topbar-row { display:flex; align-items:center; gap:10px; }
  .menu-btn { background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    width:38px; height:38px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:18px; cursor:pointer; color:var(--text); }
  .topbar h1 { margin:0; font-size:17px; font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .store-select { border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    border-radius:10px; padding:8px 10px; font-size:13.5px; font-weight:600; max-width:150px; }
  .op-bar { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-2); }
  .op-bar b { color:var(--accent); cursor:pointer; }

  main { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 14px 40px 14px; }

  /* Drawer */
  .drawer-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:none; z-index:80; }
  .drawer-overlay.open { display:block; }
  .drawer { position:fixed; top:0; left:0; bottom:0; width:78%; max-width:300px; background:var(--surface);
    z-index:81; transform:translateX(-100%); transition:transform .2s ease; overflow-y:auto;
    padding: calc(16px + env(safe-area-inset-top,0px)) 0 16px 0; }
  .drawer.open { transform:translateX(0); }
  .drawer h3 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-2);
    margin:18px 18px 8px 18px; }
  .drawer .item { padding:12px 18px; font-size:15px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:10px; }
  .drawer .item.active { color:var(--accent); background:var(--accent-2); }
  .drawer .item-logout { color:var(--red); margin-top:14px; border-top:1px solid var(--border); padding-top:16px; }
  .drawer .brand { font-size:17px; font-weight:800; padding:0 18px 12px 18px; border-bottom:1px solid var(--border); margin-bottom:6px; }

  .searchbar { display:flex; align-items:center; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:10px 12px; margin-bottom:12px; gap:8px; }
  .searchbar input { border:none; outline:none; background:transparent; color:var(--text); font-size:15px; width:100%; }

  .section-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:8px;}
  .section-head h2 { font-size:18px; margin:0; }

  .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
  .stat-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px; }
  .stat-box .num { font-size:21px; font-weight:800; }
  .stat-box .label { font-size:11.5px; color:var(--text-2); margin-top:2px; }
  .stat-box.wide { grid-column:1/-1; }

  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; margin-bottom:10px; box-shadow:var(--shadow); cursor:pointer;
    display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .card .info { min-width:0; flex:1; }
  .card .name { font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .meta { font-size:12.5px; color:var(--text-2); margin-top:2px; }
  .card .qty-block { text-align:right; flex-shrink:0; }
  .card .qty { font-size:16.5px; font-weight:700; }
  .card .unit { font-size:11.5px; color:var(--text-2); }
  .badge-low { display:inline-block; margin-top:4px; font-size:11px; font-weight:700; color:var(--amber);
    background:var(--amber-bg); padding:2px 7px; border-radius:20px; }
  .badge-exp { display:inline-block; margin-top:4px; margin-right:4px; font-size:11px; font-weight:700; color:var(--red);
    background:var(--red-bg); padding:2px 7px; border-radius:20px; }
  .pill { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; }
  .pill-fixo { background:var(--purple-bg); color:var(--purple); }
  .pill-variavel { background:var(--amber-bg); color:var(--amber); }
  .pill-aluguel { background:var(--accent-2); color:var(--accent); }
  .pill-mao_de_obra { background:var(--red-bg); color:var(--red); }
  .pill-mercadoria { background:var(--green-bg); color:var(--green); }
  .pill-outro { background:var(--surface-2); color:var(--text-2); }

  .empty-state { text-align:center; color:var(--text-2); padding:50px 20px; font-size:14px; }
  .empty-state .emoji { font-size:34px; margin-bottom:10px; }

  .move-item { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:8px; display:flex; align-items:flex-start; gap:10px; }
  .move-icon { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:15px; flex-shrink:0; }
  .move-icon.entrada { background:var(--green-bg); color:var(--green); }
  .move-icon.saida { background:var(--red-bg); color:var(--red); }
  .move-icon.perda { background:var(--amber-bg); color:var(--amber); }
  .move-body { min-width:0; flex:1; }
  .move-title { font-weight:600; font-size:14px; }
  .move-sub { font-size:12px; color:var(--text-2); margin-top:2px; }
  .move-qty { font-weight:700; font-size:14px; flex-shrink:0; text-align:right; }
  .move-qty.entrada { color:var(--green); }
  .move-qty.saida, .move-qty.perda { color:var(--red); }

  .btn { width:100%; padding:13px; border-radius:12px; border:none; font-size:15px; font-weight:700;
    cursor:pointer; margin-bottom:8px; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-entrada { background:var(--green); color:#fff; }
  .btn-saida { background:var(--red); color:#fff; }
  .btn-perda { background:var(--amber); color:#1a1a1a; }
  .btn-secondary { background:var(--surface-2); color:var(--text); }
  .btn:disabled { opacity:.5; }
  .btn-sm { width:auto; padding:9px 14px; font-size:13.5px; margin-bottom:0; border-radius:10px; }
  .actions-2 { display:flex; gap:8px; margin-bottom:10px; }
  .actions-2 .btn { margin-bottom:0; }
  .actions-3 { display:flex; gap:6px; margin-bottom:10px; }
  .actions-3 .btn { margin-bottom:0; font-size:13px; padding:11px 4px; }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:none; align-items:flex-end;
    justify-content:center; z-index:50; }
  .overlay.open { display:flex; }
  .sheet { background:var(--surface); width:100%; max-width:680px; border-radius:20px 20px 0 0;
    padding:8px 20px calc(20px + env(safe-area-inset-bottom,0px)) 20px; max-height:88vh; overflow-y:auto;
    animation:slideUp .2s ease-out; }
  @keyframes slideUp { from{transform:translateY(30px);opacity:0;} to{transform:translateY(0);opacity:1;} }
  .sheet-handle { width:36px; height:4px; background:var(--border); border-radius:4px; margin:8px auto 14px auto; }
  .sheet h2 { font-size:17px; margin:0 0 4px 0; }
  .sheet .sub { color:var(--text-2); font-size:13px; margin-bottom:16px; }

  .field { margin-bottom:14px; }
  .field label { display:block; font-size:12.5px; font-weight:600; color:var(--text-2); margin-bottom:6px; }
  .field input, .field select, .field textarea { width:100%; padding:11px 12px; border:1px solid var(--border);
    border-radius:10px; background:var(--surface-2); color:var(--text); font-size:15px; outline:none; font-family:inherit; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color:var(--accent); }
  .row2 { display:flex; gap:10px; }
  .row2 .field { flex:1; }
  .checkbox-row { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .checkbox-row input { width:18px; height:18px; }
  .checkbox-row label { font-size:14px; font-weight:600; }

  .chip-group { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { padding:8px 13px; border-radius:20px; border:1px solid var(--border); background:var(--surface-2);
    font-size:13px; font-weight:600; cursor:pointer; }
  .chip.selected { background:var(--accent); color:#fff; border-color:var(--accent); }

  .link-btn { background:none; border:none; color:var(--accent); font-size:13.5px; font-weight:600; padding:6px 0; cursor:pointer; }
  .link-danger { color:var(--red); }

  .toast { position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
    background:var(--text); color:var(--bg); padding:10px 18px; border-radius:30px; font-size:13.5px; font-weight:600;
    z-index:90; opacity:0; pointer-events:none; transition:opacity .25s ease; white-space:nowrap; max-width:90%;
    overflow:hidden; text-overflow:ellipsis; }
  .toast.show { opacity:1; }

  .loading-msg { text-align:center; color:var(--text-2); padding:40px 20px; font-size:14px; }

  .item-row { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 12px;
    margin-bottom:8px; }
  .purchase-item-row { display:flex; gap:6px; margin-bottom:8px; align-items:center; }
  .purchase-item-row select, .purchase-item-row input { padding:9px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:13.5px; }
  .purchase-item-row .pname { flex:2; min-width:0; }
  .purchase-item-row .pqty { width:60px; }
  .purchase-item-row .pcost { width:70px; }
  .purchase-item-row .rm { background:none; border:none; color:var(--red); font-size:18px; cursor:pointer; flex-shrink:0; padding:0 4px; }
  .total-line { display:flex; justify-content:space-between; font-weight:700; font-size:15px; padding:10px 0;
    border-top:1px solid var(--border); margin-bottom:10px; }

  .chart-wrap { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px; margin-bottom:14px; }
  .chart-title { font-size:13px; font-weight:700; margin-bottom:8px; color:var(--text-2); }

  .checklist-row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
  .checklist-row:last-child { border-bottom:none; }
  .checklist-row input[type=checkbox] { width:20px; height:20px; flex-shrink:0; }
  .checklist-row .txt { flex:1; font-size:14.5px; }
  .checklist-row .txt.done { text-decoration:line-through; color:var(--text-2); }
  .photo-btn { background:var(--surface-2); border:1px solid var(--border); border-radius:8px; width:34px; height:34px;
    display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; flex-shrink:0; }
  .photo-thumb { width:34px; height:34px; border-radius:8px; object-fit:cover; flex-shrink:0; cursor:pointer; }
  .status-pendente { color:var(--amber); background:var(--amber-bg); }
  .status-concluida { color:var(--green); background:var(--green-bg); }

  #loginScreen { position:fixed; inset:0; background:var(--bg); z-index:100; display:none; align-items:center; justify-content:center; padding:16px; }
  #loginScreen.show { display:flex; }
  .login-card { width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:28px 22px; box-shadow:var(--shadow); }
  .login-card h1 { font-size:21px; margin:0 0 4px 0; }
  .login-card .sub { color:var(--text-2); font-size:13.5px; margin-bottom:20px; }
  .login-err { color:var(--red); font-size:13px; min-height:18px; margin-bottom:8px; }
  body.locked #app { visibility:hidden; }

  /* ---------- Responsivo ---------- */
  @media (min-width: 700px) {
    #app { max-width:none; }
    header.topbar { padding:12px 24px; }
    main { padding:18px 24px 48px 24px; }
    .store-select { max-width:240px; }
    .stat-grid { grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); }
    .cards-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); column-gap:10px; align-items:start; align-content:start; }
    .chart-wrap svg { max-height:300px; }
    .cards-grid > :not(.card):not(.move-item) { grid-column:1 / -1; }
    .chip-scroll { flex-wrap:wrap; overflow-x:visible !important; }
    .overlay { align-items:center; padding:24px; }
    .sheet { max-width:640px; border-radius:20px; max-height:90vh; padding-top:22px; animation:popIn .18s ease-out; }
    .sheet-handle { display:none; }
  }
  @media (min-width: 1024px) {
    .drawer { transform:none; width:250px; max-width:250px; border-right:1px solid var(--border); z-index:30; }
    .drawer-overlay, .drawer-overlay.open { display:none !important; }
    .menu-btn { display:none; }
    #app { margin-left:250px; }
    header.topbar, main { padding-left:max(28px, calc((100% - 1200px) / 2)); padding-right:max(28px, calc((100% - 1200px) / 2)); }
    .sheet { max-width:700px; }
    .toast { left:calc(50% + 125px); }
  }
  @keyframes popIn { from{transform:scale(.97);opacity:0;} to{transform:scale(1);opacity:1;} }
</style>
</head>
<body class="locked">
<div id="loginScreen">
  <form class="login-card" id="loginForm" autocomplete="on">
    <h1>📋 Gestão Operacional</h1>
    <div class="sub">Entre com seu usuário e senha.</div>
    <div class="field"><label for="lgUser">Usuário</label><input id="lgUser" name="username" type="text" autocapitalize="none" autocorrect="off" autocomplete="username" placeholder="ex.: renato" required></div>
    <div class="field"><label for="lgPass">Senha</label><input id="lgPass" name="password" type="password" autocomplete="current-password" required></div>
    <div class="login-err" id="lgErr"></div>
    <button class="btn btn-primary" id="lgBtn" type="submit">Entrar</button>
    <div class="sub" style="margin:10px 0 0 0;font-size:12px;">Esqueceu a senha? Peça para a Diretoria redefinir.</div>
  </form>
</div>
<div id="app">
  <header class="topbar">
    <div class="topbar-row">
      <button class="menu-btn" id="menuBtn">☰</button>
      <h1 id="pageTitle">Painel</h1>
      <select class="store-select" id="storeSelect" style="display:none;"></select>
    </div>
    <div class="op-bar" id="opBar"></div>
  </header>
  <main id="content"><div class="loading-msg">Carregando…</div></main>
</div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer"></div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
(function () {
"use strict";

var db = null;
var content = document.getElementById("content");
var overlay = document.getElementById("overlay");
var sheet = document.getElementById("sheet");
var toastEl = document.getElementById("toast");
var drawer = document.getElementById("drawer");
var drawerOverlay = document.getElementById("drawerOverlay");
var pageTitle = document.getElementById("pageTitle");
var storeSelect = document.getElementById("storeSelect");
var opBar = document.getElementById("opBar");

// ---------- global caches ----------
var stores = {}, storeOrder = [];
var categories = {}, categoryOrder = [];
var suppliers = {}, supplierOrder = [];
var employees = {}, employeeOrder = [];
var products = {}, productOrder = [];

// scoped (per store) caches
var scopedStock = {};      // productId -> qty doc
var scopedLots = [];
var scopedMovements = [];
var scopedPurchases = [];
var scopedCosts = [];
var scopedSales = [];
var scopedTasks = {};      // id -> task
var scopedShipmentsOrigin = [];   // shipments sent FROM currentStoreId (central)
var scopedShipmentsDest = [];     // shipments sent TO currentStoreId (loja)

var diretoriaConfigExists = undefined; // undefined = loading, false = needs setup, true = configured
var diretoriaUnlocked = false;
var diretoriaData = null; // {shipments, stockByStore} cached after fetch

var scopedUnsubs = [];
var globalUnsubs = [];

var currentRoute = "painel";
var currentStoreId = null;
var currentEmployeeId = null;
var currentEmployeeName = "";
var searchTerm = "";

var PILLARS = [
  {v:"fixo", l:"Custo fixo"},
  {v:"variavel", l:"Custo variável"},
  {v:"aluguel", l:"Aluguel"},
  {v:"mao_de_obra", l:"Mão de obra"},
  {v:"mercadoria", l:"Mercadoria"},
  {v:"outro", l:"Outro"}
];
var UNITS = ["un","kg","g","L","ml","cx","pct"];
var ROLES = ["Operador de Loja","Operador de Estoque","Gerência","Diretoria","Contagem de Geladeira"];

var PRIVILEGED_ROLES = ["Gerência","Diretoria"];
var pinVerifiedFor = null; // id do funcionário privilegiado já validado nesta sessão (só em memória)

function isPrivileged(role) { return PRIVILEGED_ROLES.indexOf(role) !== -1; }
function hasAnyDiretoria() {
  return employeeOrder.some(function(id){ return employees[id] && employees[id].role === "Diretoria"; });
}
function currentRole() {
  if (!currentEmployeeId || !employees[currentEmployeeId]) return null;
  var r = employees[currentEmployeeId].role;
  if (isPrivileged(r) && pinVerifiedFor !== currentEmployeeId) return null;
  return r;
}
// Enquanto ninguém tiver a função Diretoria, a edição fica liberada para permitir a configuração inicial.
function canEditDelete() { return currentRole() === "Diretoria" || !hasAnyDiretoria(); }
function requireRole(allowed) {
  if (!requireOperator()) return false;
  var r = currentRole();
  if (allowed.indexOf(r) === -1) {
    showToast('Função "' + (r || "sem função definida") + '" não tem permissão para esta ação');
    return false;
  }
  return true;
}

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function esc(s) {
  var d = document.createElement("div");
  d.textContent = (s === null || s === undefined) ? "" : String(s);
  return d.innerHTML;
}
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
}
function openSheet(html) {
  sheet.innerHTML = '<div class="sheet-handle"></div>' + html;
  overlay.classList.add("open");
}
function closeSheet() { overlay.classList.remove("open"); sheet.innerHTML = ""; }
overlay.addEventListener("click", function (e) { if (e.target === overlay) closeSheet(); });

function fmtQty(n) {
  if (n === null || n === undefined || isNaN(n)) return "0";
  var r = Math.round(n * 100) / 100;
  return r.toString().replace(".", ",");
}
function fmtMoney(n) {
  n = n || 0;
  return "R$ " + n.toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(ts) {
  if (!ts) return "";
  var d = new Date(ts);
  var now = new Date();
  var sameDay = d.toDateString() === now.toDateString();
  var time = d.toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
  if (sameDay) return "Hoje, " + time;
  var yest = new Date(now); yest.setDate(now.getDate() - 1);
  if (d.toDateString() === yest.toDateString()) return "Ontem, " + time;
  return d.toLocaleDateString("pt-BR", {day:"2-digit", month:"2-digit"}) + ", " + time;
}
function fmtDateShort(dateStr) {
  if (!dateStr) return "";
  var parts = dateStr.split("-");
  if (parts.length === 3) return parts[2] + "/" + parts[1] + "/" + parts[0];
  return dateStr;
}
function todayStr() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function currentMonthStr() {
  var d = new Date();

}
function pillarLabel(v) {

function buildDrawer() {
  var html = '<div class="brand">📋 Gestão Operacional</div>';
  html += '<h3>Operacional</h3>';
  if (isFridgeOnly()) {
    html += '<div class="item' + (currentRoute==="geladeira"?" active":"") + '" data-route="geladeira">🧊 Contagem de geladeira</div>';
    html += '<div class="item item-logout" data-logout="1">🚪 Sair do sistema</div>';
    drawer.innerHTML = html;
    drawer.querySelectorAll("[data-route]").forEach(function(el){ el.addEventListener("click", function(){ navigate(el.getAttribute("data-route")); closeDrawer(); }); });
    bindDrawerLogout();
    return;
  }
  ["painel","estoque","compras","geladeira","custos","vendas","tarefas","relatorios"].forEach(function(r){
    html += '<div class="item' + (currentRoute===r?" active":"") + '" data-route="' + r + '">' + ROUTE_ICONS[r] + ' ' + ROUTES[r].title + '</div>';

    html += '<div class="item' + (currentRoute===r?" active":"") + '" data-route="' + r + '"' + (sub?' style="padding-left:38px;font-size:14px;"':'') + '>' + (sub?'↳ ':'') + ROUTE_ICONS[r] + ' ' + ROUTES[r].title + '</div>';

    el.addEventListener("click", function(){ navigate(el.getAttribute("data-route")); closeDrawer(); });
  });

function bindDrawerLogout() {
  var el = drawer.querySelector("[data-logout]");
  if (el) el.addEventListener("click", function(){
    if (!window.confirm("Deseja sair do sistema?")) return;
    closeDrawer();

  });

function openDrawer() { buildDrawer(); drawer.classList.add("open"); drawerOverlay.classList.add("open"); }
function closeDrawer() { drawer.classList.remove("open"); drawerOverlay.classList.remove("open"); }

(function(){ var mq = window.matchMedia && window.matchMedia("(min-width: 1024px)");

// Listas em colunas em telas largas: marca os blocos que têm vários cartões
(function(){ var pend = false;
  new MutationObserver(function(){
    if (pend) return; pend = true;
    requestAnimationFrame(function(){ pend = false;
      content.querySelectorAll(".card, .move-item").forEach(function(el){
        var p = el.parentNode;
        if (!p || p.classList.contains("cards-grid") || p.classList.contains("sheet")) return;
        var n = 0; for (var i = 0; i < p.children.length; i++) { var k = p.children[i].classList; if (k.contains("card") || k.contains("move-item")) n++; }
        if (n >= 2) p.classList.add("cards-grid");
      });
    });
  }).observe(content, {childList:true, subtree:true});
})();

function navigate(route) {
  estoqueAllMode = false;
  currentRoute = route;
  syncDrawer();
  var r = ROUTES[route];
  pageTitle.textContent = r.title;
  storeSelect.style.display = r.storeScoped ? "" : "none";
  content.innerHTML = '<div class="loading-msg">Carregando…</div>';
  clearScoped();
  if (r.storeScoped) {
    subscribeScoped(route);
  } else {
    renderRoute();
  }
}

function renderRoute() {
  if (isFridgeOnly() && currentRoute !== "geladeira") { navigate("geladeira"); return; }
  switch (currentRoute) {
    case "painel": return renderPainel();
    case "estoque": return renderEstoque();
    case "compras": return renderCompras();
    case "custos": return renderCustos();
    case "vendas": return renderVendas();
    case "relatorios": return renderRelatorios();
    case "geladeira": return renderGeladeira();
    case "tarefas": return renderTarefas();
    case "produtos": return renderProdutos();
    case "precos": return renderPrecos();
    case "fornecedores": return renderFornecedores();
    case "lojas": return renderLojas();
    case "funcionarios": return renderFuncionarios();

function pinHash(empId, pin) { return sha256Hex("pin:" + empId + ":" + pin); }
function isValidPin(p) { return /^\d{4}$/.test(p); }
function pinInput(id, label) {
  return '<div class="field"><label>' + label + '</label><input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" id="' + id + '" placeholder="••••" style="font-size:22px;letter-spacing:10px;text-align:center;"></div>';
}
function openPinPrompt(empId) {
  var e = employees[empId];
  if (!e) return;
  var creating = !e.pinHash;
  var html = '<h2>🔒 ' + esc(e.name) + '</h2><div class="sub">' + esc(e.role) + ' — ' +
    (creating ? 'primeiro acesso: crie seu PIN de 4 números.' : 'digite seu PIN de 4 números.') + '</div>' +
    pinInput("pin1", creating ? "Novo PIN" : "PIN") +
    (creating ? pinInput("pin2", "Confirmar PIN") : '') +
    '<button class="btn btn-primary" id="bPinOk">' + (creating ? "Criar PIN e entrar" : "Entrar") + '</button>' +
    '<button class="btn btn-secondary" id="bPinCancel">Voltar</button>';
  openSheet(html);
  var p1 = document.getElementById("pin1");
  setTimeout(function(){ p1.focus(); }, 60);
  document.getElementById("bPinCancel").addEventListener("click", openOperatorPicker);
  var submit = function(){
    var pin = p1.value.trim();
    if (!isValidPin(pin)) { showToast("O PIN deve ter exatamente 4 números"); return; }
    var btn = document.getElementById("bPinOk"); btn.disabled = true;
    if (creating) {
      var pin2 = document.getElementById("pin2").value.trim();
      if (pin !== pin2) { showToast("Os PINs não coincidem"); btn.disabled = false; return; }
      pinHash(empId, pin).then(function(h){
        return db.doc("employees/" + empId).update({pinHash: h, pinSetAt: Date.now()});
      }).then(function(){
        pinVerifiedFor = empId; setOperator(empId); closeSheet(); showToast("PIN criado");
      }).catch(function(err){ showToast("Erro ao salvar PIN: " + errMsg(err)); btn.disabled = false; });
    } else {
      pinHash(empId, pin).then(function(h){
        if (h === employees[empId].pinHash) {
          pinVerifiedFor = empId; setOperator(empId); closeSheet();
        } else {
          showToast("PIN incorreto"); p1.value = ""; p1.focus(); btn.disabled = false;
        }
      });
    }
  };
  document.getElementById("bPinOk").addEventListener("click", submit);
  p1.addEventListener("keydown", function(ev){ if (ev.key === "Enter" && !creating) submit(); });
}

function renderPainel() {
  var storeId = currentStoreId;
  if (!storeId) { content.innerHTML = '<div class="empty-state">Selecione uma loja.</div>'; return; }
  var storeName = stores[storeId] ? stores[storeId].name : "";

  var lowStockCount = 0, totalItems = productOrder.length;
  productOrder.forEach(function(pid){
    var p = products[pid];
    var st = scopedStock[pid];
    var qty = st ? st.quantity : 0;
    if (typeof p.minStock === "number" && p.minStock > 0 && qty <= p.minStock) lowStockCount++;
  });

  var now = Date.now();
  var soon = now + 7*24*60*60*1000;
  var expiringLots = scopedLots.filter(function(l){
    if (!l.expiryDate) return false;
    var t = new Date(l.expiryDate + "T00:00:00").getTime();
    return t <= soon;
  }).sort(function(a,b){ return new Date(a.expiryDate) - new Date(b.expiryDate); });

  var month = currentMonthStr();
  var sc = storeCmv(month);
  var monthSales = sc.sales;
  var isCentralStore = stores[storeId] && stores[storeId].isCentral;
  var showCmv = canSeeCmv();

  var pendingTasks = Object.keys(scopedTasks).filter(function(id){ return scopedTasks[id].status !== "concluida"; }).length;

  var html = '<div class="stat-grid">' +
    '<div class="stat-box"><div class="num">' + totalItems + '</div><div class="label">produtos cadastrados</div></div>' +
    '<div class="stat-box"><div class="num" style="color:var(--amber)">' + lowStockCount + '</div><div class="label">estoque baixo</div></div>' +
    (showCmv ? '<div class="stat-box"><div class="num">' + fmtMoney(monthSales) + '</div><div class="label">vendas no mês</div></div>' +
      (isCentralStore
        ? '<div class="stat-box"><div class="num">—</div><div class="label">CMV geral: ver Vendas & CMV</div></div>'
        : '<div class="stat-box"><div class="num" style="color:' + (sc.cmvPct>35?"var(--red)":"var(--green)") + '">' + sc.cmvPct.toFixed(1) + '%</div><div class="label">CMV da loja no mês</div></div>') +
      '<div class="stat-box"><div class="num">' + sc.cmoPct.toFixed(1) + '%</div><div class="label">CMO do mês</div></div>' : '') +
    '<div class="stat-box"><div class="num" style="color:var(--amber)">' + pendingTasks + '</div><div class="label">tarefas pendentes</div></div>' +
  '</div>';

  var last7 = [];
  for (var i=6;i>=0;i--) {
    var d = new Date(); d.setDate(d.getDate()-i);
    var ds = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    var sum = scopedSales.filter(function(s){return s.date===ds;}).reduce(function(a,s){return a+(s.amount||0);},0);
    last7.push({label: d.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".",""), value: sum});
  }
  html += '<div class="chart-wrap"><div class="chart-title">Vendas — últimos 7 dias · ' + esc(storeName) + '</div>' + barChart(last7) + '</div>';

  if (expiringLots.length) {
    html += '<div class="chart-title" style="margin-bottom:6px;">⏰ Validades próximas</div>';
    expiringLots.slice(0,6).forEach(function(l){
      var expired = new Date(l.expiryDate+"T00:00:00").getTime() < now;
      html += '<div class="move-item"><div class="move-icon perda">⏰</div><div class="move-body">' +
        '<div class="move-title">' + esc(l.productName) + (l.lotNumber?" · lote "+esc(l.lotNumber):"") + '</div>' +
        '<div class="move-sub">' + (expired?'<span style="color:var(--red);font-weight:700">Vencido</span> · ':'') + 'Validade: ' + fmtDateShort(l.expiryDate) + ' · Qtd: ' + fmtQty(l.quantity) + '</div>' +
        '</div></div>';
    });
  }
  content.innerHTML = html;
}

function barChart(items) {
  var max = Math.max.apply(null, items.map(function(i){return i.value;}).concat([1]));
  var w = 300, h = 110, barW = w/items.length - 8;
  var svg = '<svg viewBox="0 0 ' + w + ' ' + (h+22) + '" width="100%" style="max-width:100%">';
  items.forEach(function(it, idx){
    var bh = max>0 ? (it.value/max)*h : 0;
    var x = idx*(w/items.length) + 4;
    var y = h - bh;
    svg += '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + Math.max(bh,2) + '" rx="3" fill="var(--accent)"></rect>';
    svg += '<text x="' + (x+barW/2) + '" y="' + (h+16) + '" font-size="9" fill="var(--text-2)" text-anchor="middle">' + esc(it.label) + '</text>';
  });
  svg += '</svg>';
  return svg;
}

var estoqueCatFilter = "";          // "" = todos
var estoqueCollapsed = {};           // gênero -> recolhido
var ALL_STOCK_ROLES = ["Operador de Estoque","Gerência","Diretoria"];
var estoqueAllMode = false, allStock = null, allStockLoading = false, allStockOnlyWith = true;
function renderEstoque() {
  if (estoqueAllMode) { renderAllStoresStock(); return; }
  if (!currentStoreId) { content.innerHTML = '<div class="empty-state">Selecione uma loja.</div>'; return; }
  var list = productOrder.map(function(id){ return products[id]; });
  if (searchTerm) {
    var t = searchTerm.toLowerCase();
    list = list.filter(function(p){ return (p.name||"").toLowerCase().indexOf(t)!==-1 || (p.sku||"").toLowerCase().indexOf(t)!==-1; });
  }
  if (estoqueCatFilter) list = list.filter(function(p){ return (p.categoryId || "_none") === estoqueCatFilter; });

  var html = '';
  var isCentralStore = stores[currentStoreId] && stores[currentStoreId].isCentral;
  if (isCentralStore) {
    var last = scopedCounts[0];
    html += '<div class="item-row" style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;">' +
      '<div style="font-size:13px;">📋 Última contagem: ' + (last ? '<b>' + fmtDateShort(last.date) + '</b> · ' + fmtMoney(last.totalValue) : '<b>nenhuma</b>') + '</div>' +
      '<button class="btn btn-primary btn-sm" id="bCount">Contagem de estoque</button></div>';
  }
  if (ALL_STOCK_ROLES.indexOf(currentRole()) !== -1) {
    html += '<button class="btn btn-secondary" id="bAllStores" style="margin-bottom:12px;">🏬 Ver estoque de todas as lojas</button>';
  }
  html += '<div class="searchbar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>' +
    '<input id="searchInput" type="text" placeholder="Buscar produto ou código..." value="' + esc(searchTerm) + '"></div>';

  // filtro por gênero
  var catIds = categoryOrder.filter(function(cid){ return productOrder.some(function(pid){ return products[pid].categoryId === cid; }); });
  var hasNone = productOrder.some(function(pid){ return !products[pid].categoryId || !categories[products[pid].categoryId]; });
  html += '<div class="chip-scroll" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;-webkit-overflow-scrolling:touch;">' +
    '<div class="chip' + (!estoqueCatFilter ? " selected" : "") + '" data-ecat="" style="white-space:nowrap;">Todos</div>' +
    catIds.map(function(cid){ return '<div class="chip' + (estoqueCatFilter===cid ? " selected" : "") + '" data-ecat="' + cid + '" style="white-space:nowrap;">' + esc(categories[cid].name) + '</div>'; }).join("") +
    (hasNone ? '<div class="chip' + (estoqueCatFilter==="_none" ? " selected" : "") + '" data-ecat="_none" style="white-space:nowrap;">Sem gênero</div>' : '') +
  '</div>';

  if (list.length === 0) {
    html += productOrder.length === 0
      ? '<div class="empty-state"><div class="emoji">📦</div>Nenhum produto cadastrado.<br>Cadastre em "Produtos".</div>'
      : '<div class="empty-state"><div class="emoji">🔎</div>Nenhum produto encontrado.</div>';
  } else {
    var groups = {}, order = [];
    list.forEach(function(p){
      var key = (p.categoryId && categories[p.categoryId]) ? p.categoryId : "_none";
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(p);
    });
    order.sort(function(a,b){
      var na = a==="_none" ? "zzz" : categories[a].name, nb = b==="_none" ? "zzz" : categories[b].name;
      return na.localeCompare(nb, "pt-BR");
    });
    order.forEach(function(key){
      var items = groups[key];
      var name = key==="_none" ? "Sem gênero" : categories[key].name;
      var lowCount = items.filter(function(p){
        var q = scopedStock[p.id] ? scopedStock[p.id].quantity : 0;
        return typeof p.minStock === "number" && p.minStock>0 && q<=p.minStock;
      }).length;
      var collapsed = !!estoqueCollapsed[key] && !searchTerm;
      var withStock = items.filter(function(p){ return scopedStock[p.id] && scopedStock[p.id].quantity > 0; }).length;
      html += '<div data-ecollapse="' + key + '" style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px 0;cursor:pointer;user-select:none;">' +
        '<div style="font-size:14px;font-weight:800;">' + (collapsed ? "▸ " : "▾ ") + esc(name) + ' <span style="font-weight:500;color:var(--text-2);font-size:12.5px;">· ' + items.length + ' produto' + (items.length===1?'':'s') + ' · ' +
          (withStock ? '<b style="color:var(--green);">' + withStock + ' com estoque</b>' : 'nenhum com estoque') + '</span></div>' +
        (lowCount ? '<span class="badge-low" style="margin-top:0;">' + lowCount + ' baixo</span>' : '') +
      '</div>';
      if (collapsed) return;
      items.forEach(function(p){
        var st = scopedStock[p.id];
        var qty = st ? st.quantity : 0;
        var low = typeof p.minStock === "number" && p.minStock>0 && qty<=p.minStock;
        var w = weightLabel(p);
        html += '<div class="card" data-open="' + esc(p.id) + '"><div class="info">' +
          '<div class="name">' + esc(p.name) + '</div>' +
          '<div class="meta">' + (w ? w + " · " : "") + typeLabel(p.unit) + (st && st.updatedAt ? ' · atualizado ' + fmtDate(st.updatedAt) : '') + '</div>' +
          (low?'<span class="badge-low">Estoque baixo</span>':'') +
          '</div><div class="qty-block"><div class="qty"' + (qty > 0 ? '' : ' style="color:var(--text-2);font-weight:500;"') + '>' + fmtQty(qty) + '</div><div class="unit">' + esc(p.unit||"un") + '</div></div></div>';
      });
    });
  }
  content.innerHTML = html;
  var si = document.getElementById("searchInput");
  if (si) si.addEventListener("input", function(e){
    searchTerm = e.target.value; renderEstoque();

// ---------- ESTOQUE DE TODAS AS LOJAS (Operador de Estoque, Gerência, Diretoria) ----------
function loadAllStock() {
  if (allStockLoading) return;
  allStockLoading = true;
  var ids = storeOrder.slice();
  Promise.all(ids.map(function(sid){ return db.collection("stock").where("storeId","==",sid).get(); }))
    .then(function(results){
      var m = {};
      results.forEach(function(qs, i){
        var sid = ids[i];
        qs.docs.forEach(function(d){ var x = d.data(); (m[x.productId] = m[x.productId] || {})[sid] = x; });
      });
      allStock = m; allStockLoading = false;
      if (estoqueAllMode && currentRoute === "estoque") renderAllStoresStock();
    })
    .catch(function(err){ allStockLoading = false; showToast("Erro ao carregar: " + errMsg(err)); });
}
function exitAllStores() {
  estoqueAllMode = false;
  storeSelect.style.display = "";
  renderEstoque();
}
function renderAllStoresStock() {
  storeSelect.style.display = "none";
  var sids = storeOrder.filter(function(sid){ return stores[sid]; });

    '<button class="link-btn" id="bAllReload">🔄 Atualizar</button></div>' +
    '<h2 style="font-size:18px;margin:0 0 4px 0;">🏬 Estoque de todas as lojas</h2>' +
    '<div style="font-size:12.5px;color:var(--text-2);margin-bottom:12px;">Saldo informado por cada loja (lançamentos, contagens e recebimentos).</div>';

    content.innerHTML = html + '<div class="loading-msg">Carregando estoque das lojas…</div>';
    bindAllStores(); return;
  }
  html += '<div class="searchbar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>' +
    '<input id="allSearch" type="text" placeholder="Buscar produto..." value="' + esc(searchTerm) + '"></div>';

    '<div class="chip' + (!estoqueCatFilter ? " selected" : "") + '" data-acat="" style="white-space:nowrap;">Todos</div>' +
    catIds.map(function(cid){ return '<div class="chip' + (estoqueCatFilter===cid ? " selected" : "") + '" data-acat="' + cid + '" style="white-space:nowrap;">' + esc(categories[cid].name) + '</div>'; }).join("") +
    '</div>';
  html += '<label class="checkbox-row" style="margin-bottom:10px;"><input type="checkbox" id="allOnlyWith"' + (allStockOnlyWith ? ' checked' : '') + '> <span style="font-size:13.5px;font-weight:600;">Mostrar só produtos com estoque informado</span></label>';

  var t = (searchTerm || "").toLowerCase();
  var list = productOrder.map(function(id){ return products[id]; }).filter(function(p){
    if (t && (p.name||"").toLowerCase().indexOf(t) === -1) return false;

    if (allStockOnlyWith) { var r = allStock[p.id] || {}; return sids.some(function(s){ return r[s] && r[s].quantity; }); }
    return true;
  });
  // última atualização por loja
  var lastBy = {};
  Object.keys(allStock).forEach(function(pid){ Object.keys(allStock[pid]).forEach(function(s){ var u = allStock[pid][s].updatedAt || 0; if (u > (lastBy[s]||0)) lastBy[s] = u; }); });

  if (!list.length) {
    html += '<div class="empty-state"><div class="emoji">📦</div>' + (allStockOnlyWith ? 'Nenhuma loja informou estoque para estes filtros.' : 'Nenhum produto encontrado.') + '</div>';
  } else {
    var groups = {}, order = [];
    list.forEach(function(p){ var k = (p.categoryId && categories[p.categoryId]) ? p.categoryId : "_none"; if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(p); });
    order.sort(function(a,b){ var na = a==="_none" ? "zzz" : categories[a].name, nb = b==="_none" ? "zzz" : categories[b].name; return na.localeCompare(nb, "pt-BR"); });
    var th = 'position:sticky;top:0;background:var(--surface-2);padding:8px 10px;font-size:12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border);';
    html += '<div style="overflow:auto;max-height:70vh;border:1px solid var(--border);border-radius:12px;background:var(--surface);">' +
      '<table style="border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px;">' +
      '<thead><tr><th style="' + th + 'text-align:left;left:0;z-index:3;min-width:150px;">Produto</th>' +
      sids.map(function(s){ return '<th style="' + th + 'z-index:2;">' + esc(stores[s].name) + '<div style="font-weight:500;color:var(--text-2);font-size:10.5px;">' + (lastBy[s] ? fmtDate(lastBy[s]) : 'sem dados') + '</div></th>'; }).join("") +
      '<th style="' + th + 'z-index:2;">Total</th></tr></thead><tbody>';
    var td = 'padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;';
    order.forEach(function(k){
      html += '<tr><td colspan="' + (sids.length + 2) + '" style="padding:10px 10px 6px;font-weight:800;font-size:13px;background:var(--bg);position:sticky;left:0;">' + esc(k==="_none" ? "Sem gênero" : categories[k].name) + '</td></tr>';
      groups[k].forEach(function(p){
        var r = allStock[p.id] || {}, total = 0;
        var cells = sids.map(function(s){
          var q = r[s] ? (r[s].quantity || 0) : null;
          if (q) total += q;
          return '<td style="' + td + (q ? 'font-weight:700;' : 'color:var(--text-2);') + '"' + (r[s] && r[s].updatedAt ? ' title="Atualizado ' + esc(fmtDate(r[s].updatedAt)) + '"' : '') + '>' + (q === null ? '–' : fmtQty(q)) + '</td>';
        }).join("");
        html += '<tr><td style="' + td + 'text-align:left;white-space:normal;position:sticky;left:0;background:var(--surface);font-weight:600;">' + esc(p.name) +
          ' <span style="color:var(--text-2);font-weight:500;font-size:11.5px;">' + esc(p.unit || "un") + '</span></td>' + cells +
          '<td style="' + td + 'font-weight:800;">' + fmtQty(total) + '</td></tr>';
      });
    });
    html += '</tbody></table></div>' +
      '<div style="font-size:12px;color:var(--text-2);margin-top:8px;">"–" = a loja ainda não informou este produto. Embaixo do nome da loja: última atualização.</div>';
  }
  content.innerHTML = html;

function bindAllStores() {

    '<div class="field"><label>Data da contagem</label><input type="date" id="cntDate" value="' + todayStr() + '"></div>' +
    '<div class="searchbar"><input id="cntSearch" type="text" placeholder="Filtrar produto..."></div>';
  var byCat = {};
  productOrder.forEach(function(pid){
    var c = products[pid].categoryId && categories[products[pid].categoryId] ? categories[products[pid].categoryId].name : "Sem gênero";
    (byCat[c] = byCat[c] || []).push(pid);
  });
  Object.keys(byCat).sort(function(a,b){ return a.localeCompare(b,"pt-BR"); }).forEach(function(cat){
    html += '<div class="chart-title cnt-cat" style="margin-top:12px;">' + esc(cat) + '</div>';
    byCat[cat].forEach(function(pid){
      var p = products[pid];
      var sys = scopedStock[pid] ? scopedStock[pid].quantity : 0;
      html += '<div class="cnt-row" data-name="' + esc((p.name||"").toLowerCase()) + '" style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);">' +
        '<div style="flex:1;min-width:0;font-size:14px;">' + esc(p.name) + '<div style="font-size:11.5px;color:var(--text-2);">Sistema: ' + fmtQty(sys) + ' ' + esc(p.unit||"un") + (p.cost ? ' · ' + fmtMoney(p.cost) + '/' + esc(p.unit||"un") : ' · <span style="color:var(--amber)">sem custo</span>') + '</div></div>' +
        '<input type="number" inputmode="decimal" min="0" step="any" class="cntQty" data-pid="' + pid + '" value="' + sys + '" style="width:80px;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:15px;text-align:right;">' +
      '</div>';
    });
  });
  html += '<div style="position:sticky;bottom:0;background:var(--surface);padding-top:12px;">' +
    '<button class="btn btn-primary" id="bCntSave">Salvar contagem</button>' +
    '<button class="btn btn-secondary" id="bCancel">Cancelar</button></div>';
  openSheet(html);
  document.getElementById("bCancel").addEventListener("click", closeSheet);
  document.getElementById("cntSearch").addEventListener("input", function(e){
    var t = e.target.value.toLowerCase();
    sheet.querySelectorAll(".cnt-row").forEach(function(r){ r.style.display = r.getAttribute("data-name").indexOf(t)!==-1 ? "flex" : "none"; });
    sheet.querySelectorAll(".cnt-cat").forEach(function(h){ h.style.display = t ? "none" : ""; });
  });
  document.getElementById("bCntSave").addEventListener("click", submitCount);
}
function submitCount() {
  var date = document.getElementById("cntDate").value;
  if (!date) { showToast("Informe a data da contagem"); return; }
  var btn = document.getElementById("bCntSave"); btn.disabled = true; btn.textContent = "Salvando…";
  var items = [], diffs = [], total = 0, noCost = 0;
  sheet.querySelectorAll(".cntQty").forEach(function(inp){
    var pid = inp.getAttribute("data-pid");
    var p = products[pid]; if (!p) return;
    var q = parseFloat(inp.value); if (isNaN(q) || q < 0) q = 0;
    var sys = scopedStock[pid] ? scopedStock[pid].quantity : 0;
    var cost = p.cost || 0;
    if (q > 0 && !cost) noCost++;
    total += q * cost;
    if (q > 0) items.push({productId:pid, productName:p.name, qty:q, unitCost:cost, value:q*cost});
    if (Math.abs(q - sys) > 1e-9) diffs.push({pid:pid, name:p.name, sys:sys, q:q});
  });
  var storeName = stores[currentStoreId].name;
  var chain = db.collection("counts").add({
    storeId: currentStoreId, storeName: storeName, date: date, items: items, totalValue: total,
    adjustments: diffs.length, employeeId: currentEmployeeId, employeeName: currentEmployeeName, createdAt: Date.now()
  });
  diffs.forEach(function(d){
    chain = chain.then(function(){
      return db.doc("stock/"+currentStoreId+"_"+d.pid).set({storeId:currentStoreId, productId:d.pid, quantity:d.q, updatedAt:Date.now()})
        .then(function(){
          return db.collection("movements").add({storeId:currentStoreId, storeName:storeName, productId:d.pid, productName:d.name,
            type: d.q > d.sys ? "entrada" : "saida", quantity: Math.abs(d.q - d.sys),
            employeeId:currentEmployeeId, employeeName:currentEmployeeName, note:"Ajuste de contagem " + fmtDateShort(date), timestamp:Date.now()});
        });
    });
  });
  chain.then(function(){
    networkCmvCache = {};
    closeSheet();
    showToast("Contagem salva: " + fmtMoney(total) + (diffs.length ? " · " + diffs.length + " ajuste(s)" : ""));
    if (noCost) setTimeout(function(){ showToast(noCost + " produto(s) contado(s) sem custo cadastrado — valor não entra no CMV"); }, 2500);
  }).catch(function(err){
    showToast("Erro ao salvar contagem: " + errMsg(err)); btn.disabled = false; btn.textContent = "Salvar contagem";
  });
}

    '<div style="color:var(--text-2);font-size:13px;">em estoque' + (low?' · <span style="color:var(--amber);font-weight:700">abaixo do mínimo ('+fmtQty(p.minStock)+')</span>':'') + '</div></div>' +

function openMovementForm(p, type) {
  if (!requireOperator()) return;
  var st = scopedStock[p.id]; var qty = st ? st.quantity : 0;
  var titles = {entrada:"↓ Registrar entrada", saida:"↑ Registrar saída", perda:"⚠ Registrar perda"};
  var btnClass = {entrada:"btn-entrada", saida:"btn-saida", perda:"btn-perda"};
  var html = '<h2>' + titles[type] + '</h2><div class="sub">' + esc(p.name) + ' — estoque atual: ' + fmtQty(qty) + ' ' + esc(p.unit||"un") + '</div>' +
    '<div class="field"><label>Quantidade</label><input type="number" inputmode="decimal" id="movQty" min="0" step="any" placeholder="0"></div>';
  if (type === "entrada" && p.perishable) {
    html += '<div class="row2"><div class="field"><label>Lote (opcional)</label><input type="text" id="movLot" placeholder="Nº do lote"></div>' +
      '<div class="field"><label>Validade (opcional)</label><input type="date" id="movExp"></div></div>';
  }
  html += '<div class="field"><label>Observação (opcional)</label><input type="text" id="movNote" placeholder="Ex: contagem, ajuste..."></div>' +
    '<button class="btn ' + btnClass[type] + '" id="bConfirm">Confirmar</button><button class="btn btn-secondary" id="bCancel">Cancelar</button>';
  openSheet(html);
  document.getElementById("bCancel").addEventListener("click", closeSheet);
  document.getElementById("bConfirm").addEventListener("click", function () {
    var q = parseFloat(document.getElementById("movQty").value);
    if (!q || q <= 0) { showToast("Informe uma quantidade válida"); return; }
    var note = document.getElementById("movNote").value.trim();
    var lotEl = document.getElementById("movLot");
    var expEl = document.getElementById("movExp");
    submitMovement(p, type, q, note, lotEl?lotEl.value.trim():"", expEl?expEl.value:"");
  });
}

function requireOperator() {
  if (!currentEmployeeId) { openOperatorPicker(); showToast("Selecione o operador primeiro"); return false; }
  return true;
}

function submitMovement(p, type, qty, note, lotNumber, expiryDate) {
  var st = scopedStock[p.id]; var current = st ? st.quantity : 0;
  var newQty = type === "entrada" ? current + qty : current - qty;
  if (newQty < 0) { showToast("Estoque insuficiente"); return; }
  var btn = document.getElementById("bConfirm");
  if (btn) { btn.disabled = true; btn.textContent = "Salvando…"; }
  var stockDocId = currentStoreId + "_" + p.id;
  var storeName = stores[currentStoreId] ? stores[currentStoreId].name : "";

  db.doc("stock/" + stockDocId).set({ storeId: currentStoreId, productId: p.id, quantity: newQty, updatedAt: Date.now() })
    .then(function () {
      return db.collection("movements").add({
        storeId: currentStoreId, storeName: storeName, productId: p.id, productName: p.name,
        type: type, quantity: qty, employeeId: currentEmployeeId, employeeName: currentEmployeeName,
        note: note || "", timestamp: Date.now()
      });
    })
    .then(function () {
      if (type === "entrada" && lotNumber || (type==="entrada" && expiryDate)) {
        return db.collection("lots").add({
          storeId: currentStoreId, productId: p.id, productName: p.name,
          lotNumber: lotNumber || "", expiryDate: expiryDate || "", quantity: qty, createdAt: Date.now()
        });
      }
    })
    .then(function () { closeSheet(); showToast("Registrado com sucesso"); })
    .catch(function () {
      showToast("Erro ao salvar. Tente novamente.");
      if (btn) { btn.disabled = false; btn.textContent = "Confirmar"; }
    });
}

var PRODUCT_TYPES = [{v:"un", l:"Unidade"}, {v:"kg", l:"Kg"}, {v:"L", l:"Litro"}];
var WEIGHT_UNITS = ["g","kg","ml","L"];
function typeLabel(u) {
  for (var i=0;i<PRODUCT_TYPES.length;i++) if (PRODUCT_TYPES[i].v===u) return PRODUCT_TYPES[i].l;
  return u || "Unidade";
}
function weightLabel(p) {
  if (!p || !p.weight) return "";
  return fmtQty(p.weight) + " " + (p.weightUnit || "g");
}
function openProductForm(id) {
  var p = id ? products[id] : null;
  var readOnly = !!p && !canEditDelete();
  var dis = readOnly ? "disabled" : "";
  var curType = p ? (p.unit || "un") : "un";
  var typeOpts = PRODUCT_TYPES.map(function(t){ return '<option value="'+t.v+'"'+(curType===t.v?" selected":"")+'>'+t.l+'</option>'; }).join("");

// ---------- Acesso ao sistema (login e senha de cada funcionário) ----------
function suggestLogin(name) {
  var parts = String(name||"").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z ]/g, "").split(/\s+/).filter(Boolean);
  if (!parts.length) return "";
  return parts.length > 1 ? parts[0] + "." + parts[parts.length-1] : parts[0];
}
function employeeAccessHtml(e) {
  var h = '<div class="item-row" style="margin-bottom:14px;"><div style="font-weight:700;font-size:14px;margin-bottom:8px;">🔑 Acesso ao sistema</div>';
  if (e.authUserId) {
    h += '<div style="font-size:13.5px;margin-bottom:10px;">Usuário: <b>' + esc(e.login || "—") + '</b></div>' +
      '<div class="row2"><div class="field" style="margin-bottom:8px;"><label>Nova senha</label><input type="text" id="accNewPw" placeholder="mínimo 6 caracteres" autocomplete="off"></div></div>' +
      '<div style="display:flex;gap:14px;flex-wrap:wrap;"><button class="link-btn" id="bAccReset" type="button">Redefinir senha</button>' +
      '<button class="link-btn link-danger" id="bAccRevoke" type="button">Bloquear acesso</button></div>';
  } else {
    h += '<div style="font-size:12.5px;color:var(--text-2);margin-bottom:8px;">Este funcionário ainda não tem login. Crie um usuário e uma senha inicial e passe para ele.</div>' +
      '<div class="row2"><div class="field" style="margin-bottom:8px;"><label>Usuário</label><input type="text" id="accLogin" autocapitalize="none" autocomplete="off" value="' + esc(e.login || suggestLogin(e.name)) + '"></div>' +
      '<div class="field" style="margin-bottom:8px;"><label>Senha inicial</label><input type="text" id="accPw" autocomplete="off" placeholder="mín. 6 caracteres"></div></div>' +
      '<button class="btn btn-secondary" id="bAccCreate" type="button" style="margin-bottom:0;">Criar acesso</button>';
  }
  return h + '</div>';
}
function bindEmployeeAccess(e) {
  var bc = document.getElementById("bAccCreate");
  if (bc) bc.addEventListener("click", function(){
    var login = document.getElementById("accLogin").value.trim().toLowerCase();
    var pw = document.getElementById("accPw").value;
    if (!/^[a-z0-9._-]{3,30}$/.test(login)) { showToast("Usuário: 3 a 30 letras minúsculas, números, ponto ou hífen (sem espaço)"); return; }
    if (pw.length < 6) { showToast("A senha precisa ter pelo menos 6 caracteres"); return; }
    bc.disabled = true; bc.textContent = "Criando…";
    db.rpc("admin_create_login", {p_employee_id: e.id, p_login: login, p_password: pw, p_domain: SB.domain})
      .then(function(){ closeSheet(); showToast("Acesso criado: usuário " + login); })
      .catch(function(err){ bc.disabled = false; bc.textContent = "Criar acesso"; showToast("Erro: " + errMsg(err)); });
  });
  var br = document.getElementById("bAccReset");
  if (br) br.addEventListener("click", function(){
    var pw = document.getElementById("accNewPw").value;
    if (pw.length < 6) { showToast("Digite a nova senha (mínimo 6 caracteres)"); return; }
    db.rpc("admin_set_password", {p_employee_id: e.id, p_password: pw})
      .then(function(){ closeSheet(); showToast("Senha de " + e.name.split(" ")[0] + " redefinida"); })
      .catch(function(err){ showToast("Erro: " + errMsg(err)); });
  });
  var bv = document.getElementById("bAccRevoke");
  if (bv) bv.addEventListener("click", function(){
    if (e.id === currentEmployeeId) { showToast("Você não pode bloquear o seu próprio acesso"); return; }
    if (!window.confirm("Bloquear o acesso de " + e.name + "? A pessoa não conseguirá mais entrar no sistema.")) return;
    db.doc("employees/"+e.id).update({authUserId: null, login: null})
      .then(function(){ closeSheet(); showToast("Acesso bloqueado"); })
      .catch(function(err){ showToast("Erro: " + errMsg(err)); });
  });
}

    html += '<button class="btn btn-secondary" id="bSendShipment" style="margin-bottom:6px;">🚚 Enviar pedido para loja</button>';
    html += '<button class="btn btn-secondary" id="bReceiveShipment" style="margin-bottom:6px;">📥 Receber mercadoria' + (pendingForMe.length?' ('+pendingForMe.length+')':'') + '</button>';
  } else {
    html += '<button class="btn btn-secondary" id="bReceiveShipment" style="margin-bottom:6px;">📥 Receber mercadoria' + (pendingForMe.length?' ('+pendingForMe.length+')':'') + '</button>';
    html += '<button class="btn btn-secondary" id="bReturnShipment" style="margin-bottom:6px;">↩️ Informar devolução</button>';
  }
  html += '</div>';

  var showSup = canSeeSuppliers();
  var orders = scopedOrdersMine.concat(scopedOrdersToMe.filter(function(o){ return o.storeId !== currentStoreId; }))
    .filter(function(o){ return showSup || !o.supplierId; })
    .sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
  if (isCentral) {
    var pendOrders = scopedOrdersToMe.filter(function(o){ return o.status==="pendente"; }).length;
    if (pendOrders) html += '<div class="badge-low status-pendente" style="margin-bottom:10px;">' + pendOrders + ' pedido(s) de loja aguardando atendimento</div>';
  }
  html += '<div class="chart-title">Pedidos</div>';
  if (orders.length === 0) {
    html += '<div class="empty-state" style="padding:24px 10px;"><div class="emoji">🧾</div>Nenhum pedido ainda.</div>';
  } else {
    orders.forEach(function(o){ html += orderRowHtml(o); });
  }

  var relatedShipments = scopedShipmentsOrigin.concat(scopedShipmentsDest).sort(function(a,b){ return (b.sentAt||0)-(a.sentAt||0); });
  if (relatedShipments.length) {
    html += '<div class="chart-title" style="margin-top:16px;">Envios e devoluções entre lojas</div>';
    relatedShipments.forEach(function(s){ html += shipmentRowHtml(s); });
  }

  if (showSup && scopedPurchases.length) {
    html += '<div class="chart-title" style="margin-top:16px;">Recebimentos de fornecedores</div>';
    scopedPurchases.forEach(function(pu){
      html += '<div class="move-item"><div class="move-icon entrada">🧾</div><div class="move-body">' +
        '<div class="move-title">' + esc(pu.supplierName||"Sem fornecedor") + (pu.orderLabel?" · "+esc(pu.orderLabel):"") + '</div>' +
        '<div class="move-sub">' + fmtDateShort(pu.date) + ' · ' + (pu.items?pu.items.length:0) + ' item(ns)</div></div>' +
        '<div class="move-qty entrada">' + fmtMoney(pu.totalCost) + '</div></div>';
    });
  }
  content.innerHTML = html;
  document.getElementById("bAdd").addEventListener("click", openOrderForm);
  var sendBtn = document.getElementById("bSendShipment");
  if (sendBtn) sendBtn.addEventListener("click", function(){ openSendShipmentForm(null); });
  var recvBtn = document.getElementById("bReceiveShipment");
  if (recvBtn) recvBtn.addEventListener("click", function(){ openReceiveShipmentPicker(pendingForMe, isCentral); });
  var retBtn = document.getElementById("bReturnShipment");
  if (retBtn) retBtn.addEventListener("click", openReturnForm);
  content.querySelectorAll("[data-shipment]").forEach(function(row){
    row.addEventListener("click", function(){ openShipmentDetail(row.getAttribute("data-shipment")); });
  });
  content.querySelectorAll("[data-order]").forEach(function(row){
    row.addEventListener("click", function(){ openOrderDetail(row.getAttribute("data-order")); });
  });
}

// ---------- PEDIDOS (numeração automática por dia) ----------
function pad3(n) { return String(n).padStart(3, "0"); }
function nowTimeStr() { var d = new Date(); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }
function tomorrowStr() {
  var d = new Date(); d.setDate(d.getDate()+1);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function orderLabel(o) { return "Pedido nº " + pad3(o.number) + " · " + fmtDateShort(o.orderDate).slice(0,5); }
function orderStatusBadge(o) {
  if (o.status==="atendido" && o.partial) return '<span class="badge-low" style="color:var(--amber);background:var(--amber-bg);">Enviado parcial</span>';
  if (o.status==="atendido") return '<span class="badge-low" style="color:var(--accent);background:var(--accent-2);">Enviado</span>';
  if (o.status==="recebido") return '<span class="badge-low status-concluida">Recebido</span>';
  if (o.status==="recusado") return '<span class="badge-low" style="color:var(--red);background:var(--red-bg);">Recusado</span>';
  if (o.status==="cancelado") return '<span class="badge-low" style="color:var(--text-2);background:var(--surface-2);">Cancelado</span>';
  return '<span class="badge-low status-pendente">Pendente</span>';
}
var REFUSE_REASONS = ["Falta de mercadoria", "Sem necessidade de envio"];
function orderRowHtml(o) {
  return '<div class="card" data-order="' + o.id + '"><div class="info">' +
    '<div class="name">' + orderLabel(o) + '</div>' +
    '<div class="meta">' + esc(o.storeName) + ' → ' + esc(o.targetName) + '</div>' +
    '<div class="meta">Pedido ' + fmtDateShort(o.orderDate) + ' às ' + esc(o.orderTime) +
      ' · Entrega ' + (o.deliveryDate ? fmtDateShort(o.deliveryDate) : "—") + (o.deliveryTime ? ' às ' + esc(o.deliveryTime) : '') + '</div>' +
    orderStatusBadge(o) + '</div></div>';
}

// Número sequencial do dia, compartilhado por toda a rede (001, 002, ...), protegido contra duplicidade.
function nextOrderNumber(dateKey) {
  return db.rpc("next_counter", {p_key: "order_" + dateKey});
}

var orderDraftItems = [];
function openOrderForm() {
  if (!requireOperator()) return;
  var isCentral = stores[currentStoreId] && stores[currentStoreId].isCentral;
  var showSup = canSeeSuppliers();
  var centralId = storeOrder.filter(function(id){ return stores[id].isCentral; })[0];
  if (isCentral && !showSup) { showToast("No estoque central, pedidos são feitos a fornecedores (Operador de Estoque, Gerência ou Diretoria)"); return; }
  if (!isCentral && !centralId) { showToast("Nenhum estoque central cadastrado"); return; }

  orderDraftItems = [{productId:"", qty:""}];
  var destHtml;
  if (showSup) {
    var opts = (!isCentral ? '<option value="central">' + esc(stores[centralId].name) + '</option>' : '') +
      supplierOrder.map(function(id){ return '<option value="sup:' + id + '">Fornecedor: ' + esc(suppliers[id].name) + '</option>'; }).join("");
    if (!opts) { showToast("Cadastre um fornecedor primeiro"); return; }
    destHtml = '<div class="field"><label>Pedir para</label><select id="odTarget">' + opts + '</select></div>';
  } else {
    destHtml = '<div class="field"><label>Pedir para</label><input type="text" value="' + esc(stores[centralId].name) + '" disabled></div>';
