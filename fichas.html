<script>
(function(){
"use strict";
/* ============ estado ============ */
const DEF_PERFIL={culinarias:['MARMITA','BRASILEIRA','CASEIRA','PRATO FEITO'],raioKm:5,faixas:[1,2],notaMin:4.3,ticketMin:20,ticketMax:45,scoreMin:60};
const S={cats:new Map(),prods:new Map(),insumos:new Map(),fichas:new Map(),vinculos:new Map(),notas:[],concorrentes:new Map(),
  config:{cmvPadrao:0.3,cmvDelivery:0.3,diasAlerta:45,alertaVar:0.15,comissaoIfood:0.26,regraPreco:'ultimo',perfil:{...DEF_PERFIL}},
  loaded:{insumos:false,fichas:false},canWrite:true,db:null,user:null,uid:null,sample:null,sampleImg:false};
const UI={gCat:'todas',gramas:false,tab:'painel',qIns:'',fIns:'todos',qFic:'',fCat:'todas',nota:null,impacto:null,fila:[],concSo:true,qConc:''};
try{const t=localStorage.getItem('ft.tab');if(t)UI.tab=t;}catch(e){}
if(location.hash&&/^#(painel|insumos|fichas|notas|conc|pend)$/.test(location.hash))UI.tab=location.hash.slice(1);

/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>v==null||!isFinite(v)?'—':v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const n2=(v,d=2)=>v==null||!isFinite(v)?'—':v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const n3=v=>v==null||!isFinite(v)?'—':v.toLocaleString('pt-BR',{maximumFractionDigits:3});
const nIn=v=>v==null||v===''||!isFinite(v)?'':Number(v).toLocaleString('pt-BR',{maximumFractionDigits:4,useGrouping:false});
const pct=(v,d=1)=>v==null||!isFinite(v)?'—':(v*100).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const parseNum=s=>{if(typeof s==='number')return s;s=String(s??'').trim().replace(/[R$\s%]/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return Number(s);};
const fold=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const slug=s=>fold(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'x';
const today=()=>new Date().toISOString().slice(0,10);
const toDate=s=>new Date(String(s).length<=10?s+'T12:00:00':s);
const fmtDate=s=>{if(!s)return '—';const d=toDate(s);return isNaN(d)?s:d.toLocaleDateString('pt-BR');};
const daysSince=s=>s?Math.floor((Date.now()-toDate(s))/864e5):null;
const rid=()=>Math.random().toString(36).slice(2,8);
const r4=v=>Math.round(v*10000)/10000;
const median=a=>{if(!a.length)return null;const b=[...a].sort((x,y)=>x-y);const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2;};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3400);}
function fcOf(i){return i&&i.pesoBruto>0?(i.pesoLiquido||0)/i.pesoBruto:0;}
const isMassa=i=>!!i&&(i.un==='KG'||i.un==='LT');
const qUI=(i,q)=>UI.gramas&&isMassa(i)&&isFinite(q)?Number((q*1000).toPrecision(12)):q;
const pctTxt=v=>v==null||!isFinite(v)?'—':(v*100).toLocaleString('pt-BR',{maximumFractionDigits:2})+'%';
const n3l=v=>v==null||!isFinite(v)?'—':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:3,maximumFractionDigits:3});
const nQ=(ie,q)=>q==null||q===''||!isFinite(q)?'':(!UI.gramas&&isMassa(ie)?Number(q).toLocaleString('pt-BR',{minimumFractionDigits:3,maximumFractionDigits:4,useGrouping:false}):nIn(q));
const n4=v=>Number(v||0).toLocaleString('pt-BR',{maximumFractionDigits:4});
const unUI=(i,un)=>UI.gramas&&isMassa(i)?(i.un==='KG'?'g':'ml'):un;
const perfil=()=>({...DEF_PERFIL,...(S.config.perfil||{})});

/* ============ motor de custo ============ */
let memo=new Map();
function precoBase(i){if(S.config.regraPreco==='medio'&&Number(i.precoMedio)>0)return Number(i.precoMedio);return Number(i.preco)||0;}
function precoInsumo(i,ov,stack){
  if(!i)return 0;
  if(i.fichaId&&S.fichas.has(i.fichaId)){
    const f=S.fichas.get(i.fichaId);
    if(stack&&stack.includes(f.id))return 0;
    const c=custoFicha(f,ov,[...(stack||[]),f.id]);
    return f.rendimento>0?c.total/f.rendimento:0;
  }
  if(ov&&ov.has(i.id))return ov.get(i.id);
  return precoBase(i);
}
function custoFicha(f,ov,stack){
  const key=!ov&&!f.__draft?f.id:null;
  if(key&&memo.has(key))return memo.get(key);
  stack=stack||[f.id];
  let total=0,falt=0;const linhas=[];
  for(const it of f.itens||[]){
    const q=Number(it.qtd)||0;
    if(it.fichaId){ // combo: ficha dentro de ficha, quantidade em porções/kg da ficha
      const f2=S.fichas.get(it.fichaId);let un=0;
      if(f2&&!stack.includes(f2.id)){const c2=custoFicha(f2,ov,[...stack,f2.id]);un=c2.un||0;}
      if(!f2)falt++;const c=f2?q*un:0;total+=c;linhas.push({it,f2,fc:null,bruto:null,preco:f2?un:null,custo:c});continue;
    }
    const i=S.insumos.get(it.insumoId);
    const fc=fcOf(i);const bruto=fc>0?q/fc:null;
    const p=i?precoInsumo(i,ov,stack):null;
    const c=i&&fc>0?bruto*p:0;
    if(!i||fc<=0)falt++;
    total+=c;linhas.push({it,i,fc,bruto,preco:p,custo:c});
  }
  const r={total,un:f.rendimento>0?total/f.rendimento:null,linhas,falt};
  if(key)memo.set(key,r);
  return r;
}
function precos(f,c){
  const cmv=Number(f.cmvMeta)||S.config.cmvPadrao;const com=Number(S.config.comissaoIfood)||0;
  const cmvD=Number(f.cmvDelivery)||Number(S.config.cmvDelivery)||cmv;
  const sug=c.un!=null&&cmv>0?c.un/cmv:null;const sugD=c.un!=null&&cmvD>0?c.un/cmvD:null;const sugI=sugD!=null&&com<1?sugD/(1-com):null;
  const pv=Number(f.precoVenda)||null;const real=pv&&c.un!=null?c.un/pv:null;
  const pvD=Number(f.precoDelivery)||null;const realD=pvD&&c.un!=null?c.un/pvD:null;
  const pvI=Number(f.precoIfood)||null;const realI=pvI&&c.un!=null?c.un/(pvI*(1-com)):null;
  const cc=concIdx.get(f.id)||null;
  const baseI=pvI||sugI;const comI=baseI!=null?baseI*com:null;const liqI=baseI!=null?baseI*(1-com):null;const lucroI=liqI!=null&&c.un!=null?liqI-c.un:null;const margI=lucroI!=null&&baseI?lucroI/baseI:null;
  return{cmv,sug,sugI,pv,real,pvI,realI,com,conc:cc,cmvD,sugD,pvD,realD,baseI,comI,liqI,lucroI,margI};
}
function usoDireto(insId){const out=[];for(const f of S.fichas.values())if((f.itens||[]).some(x=>x.insumoId===insId))out.push(f);return out;}
function impacto(ov){
  const res=[];for(const f of S.fichas.values()){const a=custoFicha(f);const b=custoFicha(f,ov);
    if(Math.abs(b.total-a.total)>0.0049)res.push({f,a,b});}
  return res.sort((x,y)=>(y.b.total-y.a.total)/(y.a.total||1)-(x.b.total-x.a.total)/(x.a.total||1));
}

/* ============ concorrência ============ */
function ticketConc(c){const ps=(c.precos||[]).map(p=>Number(p.preco)).filter(v=>v>0);return median(ps);}
function simil(c){
  const p=perfil();const parts={};
  const tags=new Set((c.culinarias||[]).map(fold));const pt=(p.culinarias||[]).map(fold).filter(Boolean);
  const inter=pt.filter(t=>tags.has(t)).length;
  parts.culinaria=!tags.size?15:pt.length?Math.round(40*Math.min(1,inter/Math.min(2,pt.length))):40;
  const d=c.distanciaKm===''||c.distanciaKm==null?NaN:Number(c.distanciaKm);
  parts.distancia=isFinite(d)?(d<=p.raioKm?20:Math.round(Math.max(0,20*(1-(d-p.raioKm)/(p.raioKm||1))))):10;
  parts.faixa=c.faixa?((p.faixas||[]).includes(Number(c.faixa))?15:0):7;
  const nota=Number(c.nota);parts.nota=nota>0?(nota>=p.notaMin?10:Math.round(Math.max(0,10-(p.notaMin-nota)*20))):5;
  const t=ticketConc(c);const span=(p.ticketMax-p.ticketMin)||10;
  parts.ticket=t!=null?(t>=p.ticketMin&&t<=p.ticketMax?15:Math.round(Math.max(0,15-15*Math.min(Math.abs(t-p.ticketMin),Math.abs(t-p.ticketMax))/span))):7;
  const score=parts.culinaria+parts.distancia+parts.faixa+parts.nota+parts.ticket;
  return{score,parts,semelhante:score>=p.scoreMin,ticket:t};
}
let concIdx=new Map();
function buildConcIdx(){concIdx=new Map();const tmp=new Map();
  for(const c of S.concorrentes.values()){const sm=simil(c);if(UI.concSo&&!sm.semelhante)continue;
    for(const p of c.precos||[]){if(!p.fichaId||!(Number(p.preco)>0))continue;const a=tmp.get(p.fichaId)||[];a.push({preco:Number(p.preco),c,p,score:sm.score});tmp.set(p.fichaId,a);}}
  for(const [fid,a] of tmp){const v=a.map(x=>x.preco);concIdx.set(fid,{n:a.length,rest:new Set(a.map(x=>x.c.id)).size,media:mean(v),mediana:median(v),min:Math.min(...v),max:Math.max(...v),itens:a});}
}

function pendencias(){

  const faltas=[];for(const f of S.fichas.values())(f.itens||[]).forEach((it,ix)=>{if(it.fichaId?!S.fichas.has(it.fichaId):!S.insumos.has(it.insumoId))faltas.push({f,it,ix});});

  const fcRuim=[...S.insumos.values()].filter(i=>!i.fichaId&&(fcOf(i)>1.0001||fcOf(i)<=0));
  if(fcRuim.length)P.push({sev:'warn',k:'fcruim',titulo:`${fcRuim.length} insumo(s) com fator de correção fora da faixa (0 a 1)`,txt:'Peso líquido maior que o bruto geralmente é erro de digitação (ex.: 95 no lugar de 0,95).',lista:fcRuim});
  const semPreco=[...S.insumos.values()].filter(i=>!i.fichaId&&!(Number(i.preco)>0));
  if(semPreco.length)P.push({sev:'warn',k:'sempreco',titulo:`${semPreco.length} insumo(s) sem preço`,txt:'Fichas que usam esses itens ficam subavaliadas.',lista:semPreco});
  const semRend=[...S.fichas.values()].filter(f=>!(f.rendimento>0));
  if(semRend.length)P.push({sev:'warn',k:'semrend',titulo:`${semRend.length} ficha(s) sem rendimento`,txt:'Sem rendimento não há custo por porção/kg nem preço sugerido.',lista:semRend});
  const vazias=[...S.fichas.values()].filter(f=>!(f.itens||[]).length);
  if(vazias.length)P.push({sev:'warn',k:'vazias',titulo:`${vazias.length} ficha(s) sem ingredientes`,txt:'Fichas criadas para montar (combos e pratos novos). Abra e adicione os itens.',lista:vazias});
  const lim=S.config.diasAlerta||45;
  const velhos=[...S.insumos.values()].filter(i=>!i.fichaId&&Number(i.preco)>0&&(!i.dataPreco||daysSince(i.dataPreco)>lim));
  const aConv=[...S.insumos.values()].filter(semConv);
  if(aConv.length)P.push({sev:'warn',k:'semconv',titulo:`${aConv.length} insumo(s) ligado(s) ao estoque aguardando conversão de unidade`,txt:'O estoque conta em uma unidade e a ficha usa outra (ex.: alface por unidade × kg). Abra o insumo e informe quanto 1 unidade do estoque vale na unidade da ficha para o preço sincronizar.',lista:aConv});
  const semLig=[...S.insumos.values()].filter(i=>!i.fichaId&&!(i.produtoIds||[]).length);
  if(semLig.length)P.push({sev:'info',k:'semlig',titulo:`${semLig.length} insumo(s) comprado(s) sem ligação com produto do estoque`,txt:'Sem ligação o preço não é unificado. Abra o insumo e escolha o produto do estoque (há sugestões pelo nome).',lista:semLig});
  if(velhos.length)P.push({sev:'info',k:'velhos',titulo:`${velhos.length} preço(s) sem data ou com mais de ${lim} dias`,txt:'Importe as notas de compra recentes para atualizar de uma vez. Os preços vindos da planilha não tinham data de cotação.',lista:velhos});
  const acima=[];for(const f of S.fichas.values()){const c=custoFicha(f);const p=precos(f,c);if((p.real!=null&&p.real>p.cmv+0.005)||(p.realI!=null&&p.realI>p.cmv+0.005))acima.push({f,c,p});}
  if(acima.length)P.push({sev:'bad',k:'acima',titulo:`${acima.length} ficha(s) com CMV acima da meta`,txt:'O preço de venda cadastrado (salão ou iFood, já descontada a comissão) não cobre a meta de CMV com o custo atual.',lista:acima});
  const nomes=new Map();for(const f of S.fichas.values()){const k=f.categoria+'|'+fold(f.nome);nomes.set(k,[...(nomes.get(k)||[]),f]);}
  const dup=[...nomes.values()].filter(a=>a.length>1);
  if(dup.length)P.push({sev:'info',k:'dup',titulo:`${dup.length} nome(s) de ficha repetido(s) na mesma categoria`,txt:'Diferencie os nomes (ex.: tamanho ou versão) para não confundir no PDV e nos relatórios.',lista:dup});
  return P;
}
function alertas(){
  const A=[];const lim=Number(S.config.alertaVar)||0.15;
  for(const i of S.insumos.values()){if(i.fichaId||!i.precoAnterior||!i.dataPreco||daysSince(i.dataPreco)>30)continue;const v=(i.preco-i.precoAnterior)/i.precoAnterior;
    if(Math.abs(v)>=lim)A.push({sev:v>0?'bad':'good',t:`${i.nome} ${v>0?'subiu':'caiu'} ${pct(Math.abs(v))}`,s:`${brl(i.precoAnterior)} → ${brl(i.preco)} · ${fmtDate(i.dataPreco)} · ${i.origemPreco||'manual'}`,ins:i.id});}
  for(const f of S.fichas.values()){const c=custoFicha(f);const p=precos(f,c);
    if(p.real!=null&&p.real>p.cmv+0.005)A.push({sev:'bad',t:`${f.nome}: CMV salão ${pct(p.real)} (meta ${pct(p.cmv,0)})`,s:`custo ${brl(c.un)} · venda ${brl(p.pv)} · sugerido ${brl(p.sug)}`,fic:f.id});
    if(p.realI!=null&&p.realI>p.cmv+0.005)A.push({sev:'bad',t:`${f.nome}: CMV iFood ${pct(p.realI)} (meta ${pct(p.cmv,0)})`,s:`venda iFood ${brl(p.pvI)} · sugerido iFood ${brl(p.sugI)}`,fic:f.id});
    const ref=p.pvI||p.pv;if(p.conc&&ref){const d=(ref-p.conc.media)/p.conc.media;if(Math.abs(d)>=lim)A.push({sev:d>0?'warn':'info',t:`${f.nome}: ${d>0?'acima':'abaixo'} da concorrência em ${pct(Math.abs(d))}`,s:`nosso ${brl(ref)} · média de ${p.conc.rest} restaurante(s) ${brl(p.conc.media)}`,fic:f.id});}}
  return A;
}

/* ============ sugestão de vínculo por nome ============ */
const STOP=new Set(['DE','DA','DO','COM','E','EM','A','O','KG','UN','G','LT','L','ML','CX','PCT','TIPO','C','S','SEM','P','KILO','AO','NA','NO','MOLHO']);
function toks(s){return fold(s).replace(/[^A-Z0-9 ]/g,' ').split(' ').filter(t=>t.length>1&&!STOP.has(t)&&!/^\d+([.,]\d+)?$/.test(t));}
function sugerirEm(nome,lista,n=3){const a=new Set(toks(nome));if(!a.size)return[];const out=[];
  for(const x of lista){const b=new Set(toks(x.nome));if(!b.size)continue;let inter=0;a.forEach(t=>{if(b.has(t))inter++;else{for(const u of b){if(u.length>3&&t.length>3&&(u.startsWith(t)||t.startsWith(u))){inter+=.7;break;}}}});
    const sc=inter/Math.min(a.size+b.size-inter,Math.max(a.size,b.size)+1);if(sc>0)out.push({i:x,sc});}
  return out.sort((x,y)=>y.sc-x.sc).slice(0,n);}
const sugerir=(nome,n)=>sugerirEm(nome,[...S.insumos.values()],n);
const fichasVenda=()=>[...S.fichas.values()].filter(f=>f.categoria!=='Pré-preparo'&&f.categoria!=='Modelo').sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));

/* ============ persistência ============ */
async function write(path,data,merge){
  if(!S.db){toast('Base indisponível nesta visualização.');throw new Error('nodb');}
  try{const ref=S.db.doc(path);if(merge)await ref.update(data);else await ref.set(data);}
  catch(e){if(e&&e.code==='invalid_argument'&&!merge){S.canWrite=false;renderSync();toast('Você tem acesso só de leitura.');}
    else if(e&&e.code==='quota_exceeded')toast('A base atingiu o limite de documentos. Exclua notas antigas.');
    else toast('Não foi possível salvar: '+(e&&e.message||'erro'));throw e;}
}
function clean(o){return JSON.parse(JSON.stringify(o,(k,v)=>k.startsWith('__')?undefined:v));}
async function salvarInsumo(i){const d=clean(i);delete d.id;await write('insumos/'+i.id,d);}
async function salvarFicha(f){const d=clean(f);delete d.id;await write('fichas/'+f.id,d);}
async function salvarConc(c){const d=clean(c);delete d.id;await write('concorrentes/'+c.id,d);}
async function lerHistorico(id){if(!S.db)return[];try{const s=await S.db.doc('historico/'+id).get();return s.exists?(s.data().entries||[]):[];}catch(e){return[];}}
async function registrarHistorico(insId,entry){const ent=await lerHistorico(insId);
  try{await S.db.doc('historico/'+insId).set({entries:[{...entry,em:new Date().toISOString(),por:S.uid||null},...ent].slice(0,80)});}catch(e){}}
async function atualizarPreco(i,novo,meta){
  const ant=Number(i.preco)||null;const ent=await lerHistorico(i.id);
  const e={preco:r4(novo),anterior:ant,origem:meta.origem||'manual',fornecedor:meta.fornecedor||i.fornecedor||null,nf:meta.nf||null,data:meta.data||today(),qtd:meta.qtd||null,em:new Date().toISOString(),por:S.uid||null};
  const all=[e,...ent].slice(0,80);
  const lim=Date.now()-90*864e5;const cq=all.filter(x=>Number(x.qtd)>0&&toDate(x.data||String(x.em).slice(0,10))>=lim);
  const pm=cq.length?cq.reduce((s,x)=>s+x.preco*x.qtd,0)/cq.reduce((s,x)=>s+Number(x.qtd),0):e.preco;
  const up={...i,preco:e.preco,precoAnterior:ant,precoMedio:r4(pm),dataPreco:e.data,origemPreco:e.origem};
  if(meta.fornecedor)up.fornecedor=meta.fornecedor;if(meta.nf)up.ultimaNF=meta.nf;
  await salvarInsumo(up);
  try{await S.db.doc('historico/'+i.id).set({entries:all});}catch(err){}
}

       ${[['todos','Todos'],['comprados','Comprados'],['produzidos','Produzidos (pré-preparo)'],['semdata','Sem data de preço'],['vinculados','Ligados ao estoque'],['semvinculo','Sem ligação com o estoque'],['semconv','Aguardando conversão']].map(([v,l])=>`<option value="${v}" ${UI.fIns===v?'selected':''}>${l}</option>`).join('')}
     </select>
     <select class="input" id="gCat" style="width:auto">
       <option value="todas">Todas as categorias</option>${catsOrdenadas().map(c=>`<option value="${esc(c.id)}" ${UI.gCat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}<option value="${PREP_CAT}" ${UI.gCat===PREP_CAT?'selected':''}>Pré-preparo (produzido na cozinha)</option>
     </select>
     <span class="muted small">${list.length} itens</span>
   </div>
   <div class="tbl-wrap"><table><thead><tr><th>Insumo</th><th>Un.</th><th class="r">FC</th><th class="r">Último preço</th><th class="r">Média 90d</th><th class="r">Var.</th><th>Fornecedor</th><th>Atualizado</th><th class="r">Fichas</th><th>Produto no estoque</th></tr></thead><tbody>
   ${ordem.map(k=>`<tr class="grp"><td colspan="10">${esc(catNome(k))} · ${grupos.get(k).length}</td></tr>`+grupos.get(k).map(i=>{const p=precoInsumo(i);const v=i.precoAnterior&&!i.fichaId?(i.preco-i.precoAnterior)/i.precoAnterior:null;const fc=fcOf(i);
     return `<tr class="click" data-ins="${esc(i.id)}"><td>${esc(i.nome)} ${i.fichaId?'<span class="pill prep">ficha</span>':''}${i.codigoEstoque?` <span class="small muted">${esc(i.codigoEstoque)}</span>`:''}</td><td class="muted">${esc(i.un)}</td>
     <td class="r num ${fc>1.0001||fc<=0?'up':''}">${n2(fc)}</td><td class="r num">${i.fichaId?brl(p):Number(i.preco)>0?brl(Number(i.preco)):'<span class="up">sem preço</span>'}</td>
     <td class="r num muted">${!i.fichaId&&i.precoMedio?brl(i.precoMedio):''}</td>
     <td class="r num ${v>0?'up':v<0?'down':''}">${v==null?'':(v>0?'+':'')+pct(v)}</td><td class="small">${esc(i.fornecedor||'')}</td>
     <td class="small muted">${i.fichaId?'automático':fmtDate(i.dataPreco)}</td><td class="r num">${uso.get(i.id)||0}</td>
     <td class="small">${i.fichaId?'<span class="muted">—</span>':(i.produtoIds||[]).length?`🔗 ${esc(prodsDe(i).map(p=>p.name).join(' · ')||i.vinculoNome||'')}${semConv(i)?' <span class="pill warn">definir conversão</span>':''}`:'<span class="muted">sem ligação</span>'}</td></tr>`}).join('')).join('')||`<tr><td colspan="10" class="empty">Nenhum insumo encontrado.</td></tr>`}
   </tbody></table></div></section>`;
  const qi=$('#qIns');qi.oninput=()=>{UI.qIns=qi.value;const pos=qi.selectionStart;render();const n=$('#qIns');n.focus();n.setSelectionRange(pos,pos);};
  $('#fIns').onchange=e=>{UI.fIns=e.target.value;render();};
  $('#gCat').onchange=e=>{UI.gCat=e.target.value;render();};
  $('#catI').onclick=abrirCategoriasInsumos;
  $('#novoIns').onclick=()=>abrirInsumo(null);
  $('#pdfI').onclick=gerarPdfInsumos;
}

function abrirInsumo(id,nomeInicial){
  const orig=id?S.insumos.get(id):null;
  const d=orig?JSON.parse(JSON.stringify(orig)):{id:'i-'+rid(),nome:fold(nomeInicial||''),un:'KG',pesoBruto:1,pesoLiquido:1,preco:null,fornecedor:'',dataPreco:null,fichaId:null,codigos:[],codigoEstoque:'',__novo:true};
  const L=$('#layer');
  const fichasPrep=[...S.fichas.values()].filter(f=>f.categoria==='Pré-preparo').sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  const uso=orig?usoDireto(orig.id):[];
  function body(){
    const prod=!!d.fichaId;const fc=fcOf(d);
    const novoP=parseNum($('#iPreco')?.value);
    let imp=[];if(orig&&!prod&&isFinite(novoP)&&novoP>0&&Math.abs(novoP-(orig.preco||0))>1e-9){imp=impacto(new Map([[orig.id,novoP]]));}
    return `
    <div class="fgrid">
      <label class="f" style="grid-column:1/-1">Nome<input class="input" id="iNome" value="${esc(d.nome)}"></label>
      <label class="f">Unidade<select class="input" id="iUn">${['KG','LT','UN'].map(u=>`<option ${d.un===u?'selected':''}>${u}</option>`).join('')}</select></label>
      <label class="f">Tipo<select class="input" id="iTipo"><option value="c" ${!prod?'selected':''}>Comprado</option><option value="p" ${prod?'selected':''}>Produzido (pré-preparo)</option></select></label>
      <label class="f">Código no estoque<input class="input" id="iCod" value="${esc(d.codigoEstoque||'')}" placeholder="ex.: 001234"></label>
      ${prod?'':`<label class="f">Categoria<select class="input" id="iCat"><option value="">Sem categoria</option>${catsOrdenadas().map(c=>`<option value="${esc(c.id)}" ${d.categoriaId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>`}
      ${prod?`<label class="f" style="grid-column:span 2">Ficha de origem<select class="input" id="iFicha">${fichasPrep.map(f=>`<option value="${esc(f.id)}" ${d.fichaId===f.id?'selected':''}>${esc(f.nome)}</option>`).join('')}</select></label>`
      :`<label class="f">Preço por ${esc(d.un)}<input class="input num" id="iPreco" inputmode="decimal" value="${d.preco!=null?nIn(d.preco):''}"></label>
        <label class="f">Fornecedor<input class="input" id="iForn" value="${esc(d.fornecedor||'')}"></label>`}
    </div>
    ${prod?'':(()=>{const ps=(d.produtoIds||[]).map(id=>S.prods.get(id)).filter(Boolean);const p0=ps[0];
      const sug=sugerirEm(d.nome,[...S.prods.values()].filter(p=>!(d.produtoIds||[]).includes(p.id)).map(p=>({...p,nome:p.name})),3);
      return `<div class="panel"><h3>Produto no estoque</h3><p class="small muted" style="margin:4px 0 10px">Ligado ao produto do estoque, o preço fica unificado: quando o custo muda no estoque, a ficha atualiza; quando o preço muda aqui, o custo do produto no estoque também muda.</p>
      <div class="row">${ps.map(p=>`<span class="chip acc">🔗 ${esc(p.name)} <span class="small">(${esc(p.unit||'un')} · ${brl(Number(p.cost)||0)})</span> <button class="x" data-unlink="${esc(p.id)}" aria-label="Desligar">×</button></span>`).join('')||'<span class="muted small">Sem ligação.</span>'}</div>
      <div class="fgrid" style="margin-top:10px"><label class="f">Ligar a um produto<select class="input" id="iLink"><option value="">— escolher —</option>${sug.length?`<optgroup label="Sugestões pelo nome">${sug.map(x=>`<option value="${esc(x.i.id)}">${esc(x.i.name)}</option>`).join('')}</optgroup>`:''}<optgroup label="Todos os produtos">${[...S.prods.values()].filter(p=>!(d.produtoIds||[]).includes(p.id)).sort((a,b)=>(a.name||'').localeCompare(b.name||'','pt-BR')).map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</optgroup></select></label>
      ${p0?`<label class="f">1 ${esc(p0.unit||'un')} do estoque = quantos ${esc(d.un)}?<input class="input num" id="iConv" inputmode="decimal" value="${Number(d.conv)>0?nIn(d.conv):''}" placeholder="ex.: 1"></label>`:''}</div>
      ${p0&&!(Number(d.conv)>0)?`<p class="note" style="margin:10px 0 0">Defina a conversão para o preço sincronizar. Ex.: se o estoque conta o pé de alface em <b>un</b> e a ficha usa <b>kg</b>, informe quanto pesa 1 unidade (0,3). Se for a mesma unidade, informe 1.</p>`:''}
      ${p0&&Number(d.conv)>0?`<p class="small muted" style="margin:8px 0 0">Preço equivalente pelo estoque: <b>${brl((Number(p0.cost)||0)/Number(d.conv))}</b> por ${esc(d.un)}.</p>`:''}</div>`;})()}
    ${!prod&&orig&&orig.precoMedio?`<p class="small muted" style="margin:0">Média ponderada das compras dos últimos 90 dias: <b>${brl(orig.precoMedio)}</b>${S.config.regraPreco==='medio'?' (é este o valor usado nas fichas)':''}.</p>`:''}
    <div class="panel"><h3>Fator de correção</h3><p class="small muted" style="margin:4px 0 10px">${prod?'Pré-preparo: o FC vem da planilha e é mantido como informado. Ex.: FC 0,95 = 95% aproveitado, 5% de perda.':'Quanto sobra para uso depois de limpar, descascar ou desossar. FC = peso líquido ÷ peso bruto. Ex.: FC 0,95 = 95% aproveitado, 5% de perda.'}</p>
      <div class="fgrid"><label class="f">Peso bruto<input class="input num" id="iBruto" inputmode="decimal" value="${nIn(d.pesoBruto)}"></label>
      <label class="f">Peso líquido<input class="input num" id="iLiq" inputmode="decimal" value="${nIn(d.pesoLiquido)}"></label>
      <div class="f">FC<div class="num" style="font-size:20px;padding-top:4px">${n2(fc)}</div></div>
      ${!prod&&fc>0?`<div class="f">Custo real por ${esc(d.un)} limpo<div class="num" style="font-size:20px;padding-top:4px">${brl((Number(d.preco)||0)/fc)}</div></div>`:''}</div>
      ${prod&&Math.abs(fc-1)>1e-4?`<p class="note" style="margin:10px 0 0">FC ${n2(fc)} = ${pct(fc,0)} aproveitado (${pct(1-fc,0)} de perda). Valor mantido como informado.</p>`:''}
      ${(!prod&&fc>1.0001)?`<p class="note" style="margin:10px 0 0">Peso líquido maior que o bruto. Confira se não foi digitado ${n3(d.pesoLiquido)} no lugar de ${n3(d.pesoLiquido/100)}.</p>`:''}
    </div>
    ${imp.length?`<div class="panel"><h3>Impacto do novo preço</h3><div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>Ficha</th><th class="r">Custo atual</th><th class="r">Novo custo</th><th class="r">Var.</th></tr></thead><tbody>
      ${imp.slice(0,30).map(x=>`<tr><td>${esc(x.f.nome)} <span class="small muted">${esc(x.f.categoria)}</span></td><td class="r num">${brl(x.a.un)}</td><td class="r num">${brl(x.b.un)}</td><td class="r num ${x.b.total>x.a.total?'up':'down'}">${pct((x.b.total-x.a.total)/(x.a.total||1))}</td></tr>`).join('')}</tbody></table></div>
      ${imp.length>30?`<p class="small muted">+ ${imp.length-30} fichas</p>`:''}</div>`:''}
    ${orig?`<div class="panel"><h3>Usado em ${uso.length} ficha(s)</h3><div class="row" style="margin-top:8px">${uso.map(f=>`<button class="btn sm" data-fic="${esc(f.id)}">${esc(f.nome)}</button>`).join('')||'<span class="muted">Nenhuma ficha usa este insumo.</span>'}</div></div>`:''}
    ${orig&&!prod?`<div class="panel"><h3>Histórico de preço</h3><div id="hist" class="list" style="margin-top:6px"><span class="muted small">Carregando…</span></div>
      ${(d.codigos||[]).length?`<p class="small muted">Vinculado na NF como: ${(d.codigos||[]).map(esc).join(' · ')}</p>`:''}</div>`:''}
    ${orig&&orig.nomeOriginal&&orig.nomeOriginal!==orig.nome?`<p class="small muted">Nome na planilha: ${esc(orig.nomeOriginal)}</p>`:''}`;
  }
  L.innerHTML=`<div class="scrim" data-close></div><div class="drawer" role="dialog" aria-modal="true" aria-label="Insumo">
    <div class="dh"><h2>${orig?esc(orig.nome):'Novo insumo'}</h2><button class="x" data-close aria-label="Fechar">×</button></div>
    <div class="db" id="dBody">${body()}</div>
    <div class="df">${orig&&!usoDireto(orig.id).length?`<button class="btn danger" id="iDel">Excluir</button>`:''}<span class="grow"></span><button class="btn" data-close>Cancelar</button><button class="btn primary" id="iSave" ${S.canWrite?'':'disabled'}>Salvar</button></div></div>`;
  function grab(){const g=s=>$(s);d.nome=fold(g('#iNome').value);d.un=g('#iUn').value;d.codigoEstoque=g('#iCod').value.trim();
    if(g('#iCat'))d.categoriaId=g('#iCat').value||null;
    if(g('#iConv')){const cv=parseNum(g('#iConv').value);d.conv=isFinite(cv)&&cv>0?cv:null;}
    if(g('#iLink')&&g('#iLink').value){d.produtoIds=[...(d.produtoIds||[]),g('#iLink').value];if(!(Number(d.conv)>0)){const p=S.prods.get(g('#iLink').value);const pu=String(p&&p.unit||'').toLowerCase();if((pu==='kg'&&d.un==='KG')||((pu==='l'||pu==='lt')&&d.un==='LT')||(pu==='un'&&d.un==='UN'))d.conv=1;}}
    d.vinculoNome=(d.produtoIds||[]).map(id=>S.prods.get(id)).filter(Boolean).map(p=>p.name).join(' · ')||null;
    d.pesoBruto=parseNum(g('#iBruto').value)||0;d.pesoLiquido=parseNum(g('#iLiq').value)||0;
    if(g('#iTipo').value==='p'){d.fichaId=g('#iFicha')?g('#iFicha').value:(fichasPrep[0]&&fichasPrep[0].id)||null;}
    else{d.fichaId=null;if(g('#iPreco')){const p=parseNum(g('#iPreco').value);d.preco=isFinite(p)?p:null;}if(g('#iForn'))d.fornecedor=g('#iForn').value.trim();}}
  function rebind(){const ae=document.activeElement&&document.activeElement.id;const pos=document.activeElement&&document.activeElement.selectionStart;
    $('#dBody').innerHTML=body();bindBody();if(ae&&$('#'+ae)){const el=$('#'+ae);el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}loadHist();}
  function bindBody(){
    ['#iUn','#iTipo','#iFicha','#iLink','#iConv'].forEach(s=>{const e=$(s);if(e)e.onchange=()=>{grab();rebind();};});
    document.querySelectorAll('#dBody [data-unlink]').forEach(b=>b.onclick=()=>{grab();d.produtoIds=(d.produtoIds||[]).filter(x=>x!==b.dataset.unlink);if(!d.produtoIds.length){d.produtoIds=null;d.conv=null;}d.vinculoNome=(d.produtoIds||[]).map(id=>S.prods.get(id)).filter(Boolean).map(p=>p.name).join(' · ')||null;rebind();});
    ['#iBruto','#iLiq'].forEach(s=>{$(s).onchange=()=>{grab();rebind();};});
    const ip=$('#iPreco');if(ip){let t;ip.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{grab();rebind();},350);};}
    const fx=$('#iFix');if(fx)fx.onclick=()=>{grab();d.pesoLiquido=d.pesoBruto;rebind();};
  }
  async function loadHist(){const h=$('#hist');if(!h||!orig)return;const ent=await lerHistorico(orig.id);
      let names={};const ids=[...new Set(ent.map(e=>e.por).filter(Boolean))];if(ids.length&&S.user&&S.user.profiles){try{names=await S.user.profiles(ids)}catch(e){}}
      const hh=$('#hist');if(!hh)return;
      hh.innerHTML=ent.length?ent.map(e=>`<div class="li"><span class="t small">${fmtDate(e.data||e.em)} · ${esc(e.origem)}${e.fornecedor?' · '+esc(e.fornecedor):''}${e.qtd?' · '+n3(e.qtd)+' '+esc(orig.un):''}${e.por?' · '+esc((names[e.por]&&names[e.por].name)||'alguém'):''}</span><span class="num muted">${brl(e.anterior)}</span><span class="num">${brl(e.preco)}</span></div>`).join(''):`<span class="muted small">Sem alterações registradas. Preço inicial veio da planilha${orig.precoPlanilha!=null?' ('+brl(orig.precoPlanilha)+')':''}.</span>`;}
  bindBody();loadHist();
  L.onclick=async e=>{
    if(e.target.closest('[data-close]')){L.innerHTML='';return;}
    const fb=e.target.closest('[data-fic]');if(fb){L.innerHTML='';abrirFicha(fb.dataset.fic);return;}
    if(e.target.id==='iDel'){if(e.target.dataset.ok){await S.db.doc('insumos/'+orig.id).delete();L.innerHTML='';toast('Insumo excluído');}else{e.target.dataset.ok=1;e.target.textContent='Confirmar exclusão';}return;}
    if(e.target.id==='iSave'){grab();if(!d.nome){toast('Informe o nome do insumo.');return;}
      if([...S.insumos.values()].some(x=>x.id!==d.id&&fold(x.nome)===d.nome)){toast('Já existe um insumo com esse nome.');return;}
      e.target.disabled=true;
      try{const precoMudou=orig&&!d.fichaId&&Number(d.preco)!==Number(orig.preco);
        if(d.__novo){d.id='i-'+slug(d.nome);if(S.insumos.has(d.id))d.id+='-'+rid();d.dataPreco=d.preco?today():null;d.precoMedio=d.preco||null;delete d.__novo;await salvarInsumo(d);if(d.preco)await registrarHistorico(d.id,{preco:d.preco,anterior:null,origem:'cadastro',data:today()});}
        else if(precoMudou){await atualizarPreco({...d,preco:orig.preco},d.preco,{origem:'manual',fornecedor:d.fornecedor});}
        else await salvarInsumo(d);
        L.innerHTML='';toast('Insumo salvo');}catch(err){e.target.disabled=false;}
    }
  };
}

/* ---------- Fichas ---------- */
const CATS=['Pré-preparo','Pratos','Saladas','Adicionais','Congelados','Home','Combos','Modelo'];
const CATS_FIXAS=['Pré-preparo','Modelo']; // usadas pelo cálculo (pré-preparo vira insumo; modelo não é prato)
function catsFichas(){const base=Array.isArray(S.config.categoriasFichas)&&S.config.categoriasFichas.length?S.config.categoriasFichas:CATS;
  return [...new Set([...base,...CATS_FIXAS,...[...S.fichas.values()].map(f=>f.categoria).filter(Boolean)])];}
function vFichas(m){
  const q=fold(UI.qFic);
  let list=[...S.fichas.values()].filter(f=>(!q||fold(f.nome).includes(q)||fold(f.codigoPdv).includes(q))&&(UI.fCat==='todas'||f.categoria===UI.fCat));
  const cats=catsFichas();
  const byCat=new Map();list.forEach(f=>{byCat.set(f.categoria,[...(byCat.get(f.categoria)||[]),f]);});
  let rows='';
  for(const c of cats){const fs=byCat.get(c);if(!fs)continue;fs.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
    rows+=`<tr class="grp"><td colspan="10">${esc(c)} · ${fs.length}</td></tr>`;
    rows+=fs.map(f=>{const cc=custoFicha(f);const p=precos(f,cc);const st=p.real==null?'':p.real>p.cmv+0.005?'bad':'good';
      return `<tr class="click" data-fic="${esc(f.id)}"><td>${esc(f.nome)}${f.aba?`<div class="small muted">aba ${esc(f.aba)}</div>`:''} ${cc.falt?`<span class="pill bad" title="Itens sem cadastro ou sem FC">${cc.falt} sem custo</span>`:''}${!(f.itens||[]).length?'<span class="pill warn">montar</span>':''}</td>
      <td class="r num">${f.rendimento>0?n3(f.rendimento)+' '+esc(f.unidadeRend||''):'<span class="up">—</span>'}</td>
      <td class="r num"><b>${brl(cc.un)}</b></td><td class="r num muted">${pct(p.cmv,0)}</td>
      <td class="r num">${brl(p.sug)}</td><td class="r num">${p.pv?brl(p.pv):'<span class="muted">—</span>'}</td>
      <td class="r">${p.real==null?'':`<span class="pill ${st}">${pct(p.real)}</span>`}</td>
      <td class="r num">${p.pvD?brl(p.pvD):`<span class="muted">${brl(p.sugD)}</span>`}</td>
      <td class="r num">${p.pvI?brl(p.pvI):`<span class="muted">${brl(p.sugI)}</span>`}</td>
      <td class="r num">${p.conc?`${brl(p.conc.media)} <span class="small muted">(${p.conc.rest})</span>`:'<span class="muted">—</span>'}</td></tr>`;}).join('');}
  m.innerHTML=`<section class="view">
   <div class="row" style="justify-content:space-between;align-items:flex-end"><div><h2>Fichas técnicas</h2><p class="lead">Custo recalculado na hora com o preço atual de cada insumo. Preço sugerido = custo ÷ CMV meta. No iFood soma-se a comissão de ${pct(S.config.comissaoIfood,0)} (valor em cinza quando ainda não há preço cadastrado).</p></div>
   <div class="row"><button class="btn" id="pdfL">PDF da lista</button><button class="btn" id="pdfT">PDF das fichas</button><button class="btn" id="expF">Exportar CSV</button><button class="btn" id="catF">Editar categorias</button><button class="btn primary" id="novaF">+ Nova ficha</button></div></div>
   <div class="row"><input class="input grow" id="qFic" placeholder="Buscar ficha ou código do PDV" value="${esc(UI.qFic)}" style="max-width:420px">
    <select class="input" id="fCat" style="width:auto"><option value="todas">Todas as categorias</option>${cats.map(c=>`<option ${UI.fCat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
    <span class="muted small">${list.length} fichas</span></div>
   <div class="tbl-wrap"><table><thead><tr><th>Ficha</th><th class="r">Rendimento</th><th class="r">Custo/porção·kg</th><th class="r">CMV meta</th><th class="r">Sugerido salão</th><th class="r">Venda salão</th><th class="r">CMV salão</th><th class="r">Delivery</th><th class="r">Plataforma</th><th class="r">Média concorrência</th></tr></thead>
   <tbody>${rows||`<tr><td colspan="9" class="empty">Nenhuma ficha encontrada.</td></tr>`}</tbody></table></div></section>`;
  const qi=$('#qFic');qi.oninput=()=>{UI.qFic=qi.value;const pos=qi.selectionStart;render();const n=$('#qFic');n.focus();n.setSelectionRange(pos,pos);};
  $('#fCat').onchange=e=>{UI.fCat=e.target.value;render();};
  $('#novaF').onclick=()=>abrirFicha(null);
  $('#catF').onclick=abrirCategoriasFichas;

function gaveta(titulo,corpo,rodape){
  const L=$('#layer');
  L.innerHTML=`<div class="scrim" data-close></div><div class="drawer" role="dialog" aria-modal="true" aria-label="${esc(titulo)}" style="width:min(640px,100%)">

function abrirCategoriasFichas(){
  // rascunho: {nome original, nome novo, destino ao excluir}
  let rows=catsFichas().map(c=>({orig:c,nome:c,del:false,dest:''}));
  const conta=c=>[...S.fichas.values()].filter(f=>f.categoria===c).length;
  function corpo(){
    const vivas=rows.filter(r=>!r.del).map(r=>r.nome);
    return `<p class="lead" style="margin:0">Renomeie, reordene, crie ou exclua categorias das fichas. Renomear muda a categoria de todas as fichas dela. <b>Pré-preparo</b> e <b>Modelo</b> são usadas no cálculo e não podem ser renomeadas.</p>
    <div class="panel"><div class="list">${rows.map((r,k)=>{const n=conta(r.orig),fixa=CATS_FIXAS.includes(r.orig);
      return `<div class="li" style="flex-wrap:wrap;${r.del?'opacity:.55':''}"><span class="row" style="gap:2px"><button class="btn sm" data-up="${k}" ${k?'':'disabled'} aria-label="Subir">↑</button><button class="btn sm" data-dn="${k}" ${k<rows.length-1?'':'disabled'} aria-label="Descer">↓</button></span>
        <input class="input grow" data-nm="${k}" value="${esc(r.nome)}" ${fixa||r.del?'disabled':''} style="min-width:160px">
        <span class="small muted" style="white-space:nowrap">${n} ficha(s)</span>
        ${fixa?'<span class="pill">fixa</span>':r.del?`<span class="small">excluir${n?` e mover para <select class="input" data-dest="${k}" style="width:auto;display:inline-block">${vivas.map(v=>`<option ${r.dest===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`:''}</span><button class="btn sm" data-undo="${k}">desfazer</button>`:`<button class="btn sm danger" data-del="${k}">Excluir</button>`}</div>`;}).join('')}</div>
      <div class="row" style="margin-top:12px"><input class="input grow" id="cgNova" placeholder="Nova categoria (ex.: Executivos)"><button class="btn" id="cgAdd">+ Adicionar</button></div></div>`;
  }
  const L=gaveta('Categorias das fichas',corpo(),`<button class="btn" data-close>Cancelar</button><button class="btn primary" id="cgSave" ${S.canWrite?'':'disabled'}>Salvar categorias</button>`);
  function grab(){document.querySelectorAll('#cgBody [data-nm]').forEach(i=>{const r=rows[+i.dataset.nm];if(!i.disabled)r.nome=i.value.trim();});
    document.querySelectorAll('#cgBody [data-dest]').forEach(sel=>{rows[+sel.dataset.dest].dest=sel.value;});}
  function redraw(){$('#cgBody').innerHTML=corpo();}
  $('#cgBody').onclick=e=>{const b=e.target.closest('button');if(!b)return;grab();
    if(b.dataset.up){const k=+b.dataset.up;[rows[k-1],rows[k]]=[rows[k],rows[k-1]];}
    else if(b.dataset.dn){const k=+b.dataset.dn;[rows[k+1],rows[k]]=[rows[k],rows[k+1]];}
    else if(b.dataset.del){const r=rows[+b.dataset.del];r.del=true;r.dest=(rows.find(x=>!x.del&&x!==r)||{}).nome||'';}
    else if(b.dataset.undo){rows[+b.dataset.undo].del=false;}
    else if(b.id==='cgAdd'){const v=$('#cgNova').value.trim();if(!v)return;if(rows.some(r=>!r.del&&fold(r.nome)===fold(v))){toast('Essa categoria já existe.');return;}rows.push({orig:null,nome:v,del:false,dest:''});}
    else return;
    redraw();};
  L.querySelector('#cgSave').onclick=async e=>{grab();
    const vivas=rows.filter(r=>!r.del);
    if(vivas.some(r=>!r.nome)){toast('Informe o nome de todas as categorias.');return;}
    const nomes=vivas.map(r=>fold(r.nome));if(new Set(nomes).size!==nomes.length){toast('Há categorias com o mesmo nome.');return;}
    e.target.disabled=true;e.target.textContent='Salvando…';
    try{
      const mapa=new Map();rows.forEach(r=>{if(r.orig&&r.del&&r.dest)mapa.set(r.orig,r.dest);else if(r.orig&&!r.del&&r.nome!==r.orig)mapa.set(r.orig,r.nome);});
      let n=0;for(const f of S.fichas.values()){const nova=mapa.get(f.categoria);if(nova&&nova!==f.categoria){await salvarFicha({...f,categoria:nova});n++;}}
      await salvarConfig({categoriasFichas:vivas.map(r=>r.nome)});
      if(UI.fCat!=='todas'&&!vivas.some(r=>r.nome===UI.fCat))UI.fCat='todas';
      L.innerHTML='';toast(n?`Categorias salvas · ${n} ficha(s) atualizada(s)`:'Categorias salvas');render();
    }catch(err){e.target.disabled=false;e.target.textContent='Salvar categorias';}
  };
}
function abrirCategoriasInsumos(){
  const contaI=id=>[...S.insumos.values()].filter(i=>!i.fichaId&&i.categoriaId===id).length;
  const contaP=id=>[...S.prods.values()].filter(p=>p.categoryId===id).length;
  const semCat=[...S.insumos.values()].filter(i=>!i.fichaId&&!(i.categoriaId&&S.cats.has(i.categoriaId))).length;
  function corpo(){const cs=catsOrdenadas();
    return `<p class="lead" style="margin:0">As categorias dos insumos são os mesmos <b>gêneros do estoque</b>: o que mudar aqui vale também no cadastro de produtos do estoque.</p>
    <div class="panel"><div class="list">${cs.map(c=>{const ni=contaI(c.id),np=contaP(c.id);
      return `<div class="li" style="flex-wrap:wrap"><input class="input grow" data-cn="${esc(c.id)}" value="${esc(c.name)}" style="min-width:160px">
        <span class="small muted" style="white-space:nowrap">${ni} insumo(s) · ${np} produto(s)</span>
        <button class="btn sm" data-ren="${esc(c.id)}">Renomear</button>
        ${ni?`<select class="input" data-mv="${esc(c.id)}" style="width:auto"><option value="">mover insumos para…</option>${cs.filter(x=>x.id!==c.id).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select>`:''}
        ${!ni&&!np?`<button class="btn sm danger" data-rm="${esc(c.id)}">Excluir</button>`:''}</div>`;}).join('')}</div>
      ${semCat?`<p class="small muted">${semCat} insumo(s) sem categoria: abra o insumo e escolha a categoria.</p>`:''}
      <div class="row" style="margin-top:12px"><input class="input grow" id="ciNova" placeholder="Nova categoria (ex.: Temperos)"><button class="btn" id="ciAdd">+ Adicionar</button></div></div>`;}
  const L=gaveta('Categorias dos insumos',corpo(),`<button class="btn" data-close>Fechar</button>`);
  const redraw=()=>{const b=$('#cgBody');if(b)b.innerHTML=corpo();};
  $('#cgBody').onclick=async e=>{const b=e.target.closest('button');if(!b||!S.canWrite)return;
    try{
      if(b.dataset.ren){const id=b.dataset.ren,v=$(`[data-cn="${id}"]`).value.trim();if(!v){toast('Informe o nome.');return;}
        if([...S.cats.values()].some(c=>c.id!==id&&fold(c.name)===fold(v))){toast('Já existe uma categoria com esse nome.');return;}
        b.disabled=true;await SB.db.doc('categories/'+id).update({name:v});S.cats.set(id,{...S.cats.get(id),name:v});toast('Categoria renomeada');redraw();render();}
      else if(b.dataset.rm){const id=b.dataset.rm;if(!b.dataset.ok){b.dataset.ok=1;b.textContent='Confirmar exclusão';return;}
        b.disabled=true;await SB.db.doc('categories/'+id).delete();S.cats.delete(id);toast('Categoria excluída');redraw();render();}
      else if(b.id==='ciAdd'){const v=$('#ciNova').value.trim();if(!v)return;
        if([...S.cats.values()].some(c=>fold(c.name)===fold(v))){toast('Essa categoria já existe.');return;}
        b.disabled=true;const r=await SB.db.collection('categories').add({name:v,kind:'alimenticio',createdAt:Date.now()});
        S.cats.set(r.id,{id:r.id,name:v,kind:'alimenticio'});toast('Categoria criada');redraw();render();}
    }catch(err){toast('Não foi possível salvar: '+(err&&err.message||'erro'));redraw();}
  };
  $('#cgBody').onchange=async e=>{const sel=e.target.closest('[data-mv]');if(!sel||!sel.value||!S.canWrite)return;
    const de=sel.dataset.mv,para=sel.value;const lista=[...S.insumos.values()].filter(i=>!i.fichaId&&i.categoriaId===de);
    if(!confirm(`Mover ${lista.length} insumo(s) de "${catNome(de)}" para "${catNome(para)}"?`)){sel.value='';return;}
    sel.disabled=true;try{for(const i of lista){await salvarInsumo({...i,categoriaId:para});}toast(`${lista.length} insumo(s) movido(s)`);}catch(err){}
    redraw();render();};
}

  function rebind(){const ae=document.activeElement;const aid=ae&&(ae.id||(ae.dataset&&(ae.dataset.ing!=null?'ing'+ae.dataset.ing:ae.dataset.qtd!=null?'qtd'+ae.dataset.qtd:'')));const pos=ae&&ae.selectionStart;const st=$('#dBody').scrollTop;

    const mk=$('#mkIns');if(mk)mk.onclick=async()=>{grab();const i={id:'i-'+slug(d.nome),nome:d.nome,un:d.unidadeRend==='porção'?'UN':d.unidadeRend,pesoBruto:1,pesoLiquido:1,preco:null,fornecedor:null,dataPreco:null,fichaId:orig.id,codigos:[]};
      if(S.insumos.has(i.id))i.id+='-'+rid();await salvarInsumo(i);toast('Insumo criado: '+i.nome);};
    const at=$('#addT');if(at)at.onclick=()=>{const v=parseNum($('#tObt').value);if(!(v>0)){toast('Informe o peso ou quantidade obtida.');return;}grab();d.testes.push({data:$('#tData').value||today(),obtido:v,obs:$('#tObs').value.trim()});rebind();};
    const ut=$('#useT');if(ut)ut.onclick=()=>{grab();const tv=d.testes.map(t=>Number(t.obtido)).filter(v=>v>0);d.rendimento=Math.round(mean(tv)*1000)/1000;rebind();toast('Rendimento atualizado. Salve a ficha para gravar.');};

/* ---------- Notas de compra (NF-e XML) ---------- */
function tx(el,name){if(!el)return '';const n=el.getElementsByTagNameNS('*',name)[0];return n?n.textContent.trim():'';}
function nx(el,name){const v=parseFloat(tx(el,name));return isFinite(v)?v:0;}
function parseNFe(xmlText){
  const doc=new DOMParser().parseFromString(xmlText,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('XML inválido');
  const inf=doc.getElementsByTagNameNS('*','infNFe')[0];if(!inf)throw new Error('Não é um XML de NF-e (infNFe não encontrado)');
  const emit=inf.getElementsByTagNameNS('*','emit')[0],ide=inf.getElementsByTagNameNS('*','ide')[0];
  const chave=(inf.getAttribute('Id')||'').replace(/^NFe/,'')||rid();
  const nota={chave,numero:tx(ide,'nNF'),serie:tx(ide,'serie'),data:(tx(ide,'dhEmi')||tx(ide,'dEmi')).slice(0,10),
    cnpj:tx(emit,'CNPJ')||tx(emit,'CPF'),fornecedor:tx(emit,'xFant')||tx(emit,'xNome'),razao:tx(emit,'xNome'),
    total:nx(inf.getElementsByTagNameNS('*','ICMSTot')[0],'vNF'),itens:[]};
  for(const det of inf.getElementsByTagNameNS('*','det')){
    const p=det.getElementsByTagNameNS('*','prod')[0];const imp=det.getElementsByTagNameNS('*','imposto')[0];
    const q=nx(p,'qCom');const bruto=nx(p,'vProd');
    const extra=-nx(p,'vDesc')+nx(p,'vFrete')+nx(p,'vSeg')+nx(p,'vOutro')+nx(imp,'vIPI')+nx(imp,'vICMSST')+nx(imp,'vFCPST');
    nota.itens.push({n:det.getAttribute('nItem'),cProd:tx(p,'cProd'),ean:tx(p,'cEAN'),xProd:tx(p,'xProd'),uCom:tx(p,'uCom').toUpperCase(),qCom:q,vUnCom:nx(p,'vUnCom'),vProd:bruto,custoTotal:bruto+extra,custoUn:q>0?(bruto+extra)/q:0});
  }
  return nota;
}
function vincKey(cnpj,cProd){return (String(cnpj).replace(/\D/g,'')||'x')+'-'+slug(cProd);}
function fatorAuto(it,ins){
  const u=it.uCom.replace(/[^A-Z]/g,'');const iu=ins?ins.un:'KG';
  if(['KG','KGS','KILO','QUILO'].includes(u)&&iu==='KG')return{f:1,ok:true};
  if(['G','GR'].includes(u)&&iu==='KG')return{f:0.001,ok:true};
  if(['L','LT','LTS','LITRO'].includes(u)&&iu==='LT')return{f:1,ok:true};
  if(u==='ML'&&iu==='LT')return{f:0.001,ok:true};
  if(['UN','UND','UNID','PC','PECA'].includes(u)&&iu==='UN')return{f:1,ok:true};
  const x=fold(it.xProd).replace(/,/g,'.');let m=x.match(/(\d+)\s*X\s*(\d+(?:\.\d+)?)\s*(KG|G|GR|L|LT|ML)\b/);
  const conv=(v,un)=>{un=un.replace('GR','G').replace('LT','L');if(iu==='KG')return un==='KG'?v:un==='G'?v/1000:null;if(iu==='LT')return un==='L'?v:un==='ML'?v/1000:null;return null;};
  if(m){const v=conv(+m[1]*+m[2],m[3]);if(v)return{f:v,ok:false};}
  m=x.match(/(\d+(?:\.\d+)?)\s*(KG|G|GR|L|LT|ML)\b/);if(m){const v=conv(+m[1],m[2]);if(v)return{f:v,ok:false};}
  if(iu==='UN'){m=x.match(/\b(?:C\/|CX\s*|COM\s*)(\d+)\b/);if(m)return{f:+m[1],ok:false};}
  return{f:1,ok:u===iu};
}
function prepararNota(nota){
  nota.itens.forEach(it=>{const v=S.vinculos.get(vincKey(nota.cnpj,it.cProd));
    if(v&&S.insumos.has(v.insumoId)){it.insumoId=v.insumoId;it.fator=v.fator;it.fonte='vínculo salvo';it.fatorOk=true;}
    else{const sg=sugerir(it.xProd,1)[0];if(sg&&sg.sc>=0.5){it.insumoId=sg.i.id;it.fonte='sugestão';}else{it.insumoId='';it.fonte='';}
      const fa=fatorAuto(it,S.insumos.get(it.insumoId));it.fator=fa.f;it.fatorOk=fa.ok;}
    it.aplicar=!!it.insumoId&&!S.insumos.get(it.insumoId)?.fichaId;});
  return nota;
}
function vNotas(m){
  const N=UI.nota;
  const hist=S.notas.slice().sort((a,b)=>String(b.data).localeCompare(String(a.data))).slice(0,12);
  m.innerHTML=`<section class="view">
   <div><h2>Notas de compra</h2><p class="lead">Importe o XML da NF-e de compra. Cada produto da nota é ligado a um insumo uma única vez; nas próximas notas do mesmo fornecedor o vínculo é automático.</p></div>
   ${N?vNotaRev(N):`<label class="drop" id="drop"><input type="file" id="xmlIn" accept=".xml,text/xml,application/xml" multiple hidden>
     <b style="color:var(--fg);font-size:16px">Solte o XML da nota aqui</b><br>ou toque para escolher o arquivo · aceita várias notas de uma vez</label>`}
   ${UI.impacto?vImpacto(UI.impacto):''}
   <div class="panel"><h3>Notas já aplicadas</h3>${hist.length?`<div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>Data</th><th>Nº</th><th>Fornecedor</th><th class="r">Itens</th><th class="r">Preços alterados</th><th class="r">Valor</th></tr></thead><tbody>
     ${hist.map(n=>`<tr><td>${fmtDate(n.data)}</td><td class="num">${esc(n.numero)}</td><td>${esc(n.fornecedor)}</td><td class="r num">${n.qtdItens||0}</td><td class="r num">${n.aplicados||0}</td><td class="r num">${brl(n.total)}</td></tr>`).join('')}</tbody></table></div>`:`<p class="muted small" style="margin:6px 0 0">Nenhuma nota importada ainda.</p>`}</div>
   <div class="panel"><h3>Como fica a integração com o sistema</h3><p class="small" style="margin:6px 0 0">Hoje a nota entra por XML. Quando o recebimento de notas estiver no sistema de estoque, ele grava os mesmos dados (fornecedor, código do produto, quantidade, custo) e esta tela passa a mostrar só o que precisa de conferência: produtos novos sem vínculo e variações de preço acima de ${pct(S.config.alertaVar,0)}.</p></div>
  </section>`;
  const inp=$('#xmlIn');
  if(inp){const dr=$('#drop');inp.onchange=()=>lerArquivos(inp.files);
    dr.ondragover=e=>{e.preventDefault();dr.classList.add('on');};dr.ondragleave=()=>dr.classList.remove('on');
    dr.ondrop=e=>{e.preventDefault();dr.classList.remove('on');lerArquivos(e.dataTransfer.files);};}
  bindNota();
}
async function lerArquivos(files){const notas=[];for(const f of files){try{notas.push(prepararNota(parseNFe(await f.text())));}catch(e){toast(f.name+': '+e.message);}}
  if(!notas.length)return;UI.fila=notas.slice(1);UI.nota=notas[0];UI.impacto=null;render();}
function vNotaRev(N){

function bindNota(){
  const N=UI.nota;const m=$('#main');
  m.onchange=e=>{if(!N||UI.tab!=='notas')return;const t=e.target;
    if(t.dataset.ap!=null){N.itens[+t.dataset.ap].aplicar=t.checked;render();}
    if(t.dataset.iv!=null){const it=N.itens[+t.dataset.iv];it.insumoId=t.value;it.fonte=t.value?'manual':'';const fa=fatorAuto(it,S.insumos.get(it.insumoId));it.fator=fa.f;it.fatorOk=fa.ok;it.aplicar=!!t.value;render();}
    if(t.dataset.fa!=null){const v=parseNum(t.value);const it=N.itens[+t.dataset.fa];if(v>0){it.fator=v;it.fatorOk=true;}render();}};
  const c=$('#nCancel');if(c)c.onclick=()=>{UI.nota=UI.fila.shift()||null;render();};
  const ic=$('#impClose');if(ic)ic.onclick=()=>{UI.impacto=null;render();};
  const a=$('#nApply');if(a)a.onclick=async()=>{a.disabled=true;a.textContent='Aplicando…';
    const sel=N.itens.filter(it=>it.aplicar&&S.insumos.has(it.insumoId)&&it.fator>0);
    const antes=new Map([...S.fichas.values()].map(f=>[f.id,custoFicha(f).un]));
    const ov=new Map();sel.forEach(it=>ov.set(it.insumoId,it.custoUn/it.fator));
    const mud=impacto(ov).map(x=>x.f.id);
    const nf=`${N.numero} ${N.fornecedor}`.trim();let ok=0;
    try{
      for(const it of N.itens.filter(x=>x.insumoId&&S.insumos.has(x.insumoId)&&x.fator>0)){
        const k=vincKey(N.cnpj,it.cProd);const prev=S.vinculos.get(k);
        if(!prev||prev.insumoId!==it.insumoId||prev.fator!==it.fator)await write('vinculos/'+k,{cnpj:N.cnpj,fornecedor:N.fornecedor,cProd:it.cProd,ean:it.ean,xProd:it.xProd,uCom:it.uCom,insumoId:it.insumoId,fator:it.fator,em:today()});
      }
      for(const it of sel){const i=S.insumos.get(it.insumoId);const novo=it.custoUn/it.fator;
        const cods=new Set(i.codigos||[]);cods.add(`${N.fornecedor}: ${it.xProd}`);
        await atualizarPreco({...i,codigos:[...cods].slice(-6)},novo,{origem:'NF '+N.numero,fornecedor:N.fornecedor,nf,data:N.data||today(),qtd:it.qCom*it.fator});ok++;}
      await write('notas/'+N.chave.slice(0,60),{chave:N.chave,numero:N.numero,serie:N.serie,data:N.data,cnpj:N.cnpj,fornecedor:N.fornecedor,total:N.total,qtdItens:N.itens.length,aplicados:ok,aplicadaEm:new Date().toISOString(),por:S.uid||null,
        itens:N.itens.map(it=>({cProd:it.cProd,xProd:it.xProd,uCom:it.uCom,qCom:it.qCom,custoUn:r4(it.custoUn),insumoId:it.insumoId||null,fator:it.fator,aplicado:!!(it.aplicar&&it.insumoId)}))});
      UI.impacto={nf:N.numero+' · '+N.fornecedor,lista:mud.map(id=>({id,antes:antes.get(id)}))};
      UI.nota=UI.fila.shift()||null;toast(`${ok} preço(s) atualizados`);render();
    }catch(e){a.disabled=false;a.textContent='Tentar novamente';}
  };
}

    ['COMISSÃO DA PLATAFORMA (R$)',brl(p.comI)],['VALOR LÍQUIDO RECEBIDO',brl(p.liqI)],['LUCRO NA PLATAFORMA',brl(p.lucroI)+' ('+pct(p.margI)+')']]});
  for(const[lb,v]of[['TEMPO DE PREPARO',f.tempoPreparo],['MODO DE PREPARO',f.modoPreparo],['UTENSÍLIOS NECESSÁRIOS',f.utensilios]]){
    if(!v||!String(v).trim())continue;ptab(ctx,{w:[W],head:[lb],rows:String(v).split('\n').filter(x=>x.trim()).map(x=>[x]),size:8,gap:4});}
}
function pdfRodape(ctx){const pg=ctx.pdf.getPages();const{rgb}=ctx.P;pg.forEach((pp,k)=>{const t='Página '+(k+1)+' de '+pg.length;const{width}=pp.getSize();pp.drawText(t,{x:width-ctx.M-ctx.font.widthOfTextAtSize(t,8),y:14,size:8,font:ctx.font,color:rgb(.45,.45,.45)});});}
async function salvarPdf(ctx,nome){pdfRodape(ctx);const bytes=await ctx.pdf.save();const blob=new Blob([bytes],{type:'application/pdf'});
  const dl=await claude.use('downloads');if(!dl){toast('Download indisponível.');return;}
  try{await dl.save({filename:nome,data:blob});}catch(e){if(e&&e.code!=='declined')toast('Não foi possível entregar o PDF.');}}
async function comPdf(fn){toast('Gerando PDF…');let P;try{P=await pdfLib();}catch(e){toast('Não consegui carregar o gerador de PDF. Verifique a conexão.');return;}try{await fn(P);}catch(e){console.error(e);toast('Erro ao montar o PDF.');}}
function gerarPdfFichas(fs,titulo){if(!fs.length){toast('Nenhuma ficha na lista.');return;}
  return comPdf(async P=>{const ctx=await novoPdf(P,false,'FICHA TÉCNICA');let first=true;for(const f of fs){await desenharFicha(ctx,f,first);first=false;}
    await salvarPdf(ctx,(fs.length===1?'Ficha-tecnica-'+nomeArq(fs[0].nome):nomeArq(titulo))+'.pdf');});}
function fichasFiltradas(){const q=fold(UI.qFic);const ci=c=>{const k=catsFichas().indexOf(c);return k<0?99:k;};
  return[...S.fichas.values()].filter(f=>(!q||fold(f.nome).includes(q)||fold(f.codigoPdv).includes(q))&&(UI.fCat==='todas'||f.categoria===UI.fCat)).sort((a,b)=>(ci(a.categoria)-ci(b.categoria))||a.nome.localeCompare(b.nome,'pt-BR'));}
function gerarPdfLista(fs){if(!fs.length){toast('Nenhuma ficha na lista.');return;}
  return comPdf(async P=>{const ctx=await novoPdf(P,true,'LISTA DE PRODUTOS — FICHAS TÉCNICAS');const rows=[];let cat=null;
    for(const f of fs){if(f.categoria!==cat){cat=f.categoria;rows.push({group:String(cat||'').toUpperCase()});}
      const c=custoFicha(f),p=precos(f,c);
      rows.push([f.nome+(f.aba?'\n(aba '+f.aba+')':''),pn(f.rendimento,3)+' '+(f.unidadeRend||''),brl(c.total),brl(c.un),brl(p.sug),p.pv?brl(p.pv):'—',brl(p.sugD),p.pvD?brl(p.pvD):'—',brl(p.sugI),p.pvI?brl(p.pvI):'—',brl(p.comI),brl(p.lucroI)]);}
    const cfg=S.config,com=Number(cfg.comissaoIfood)||0;
    ctx.page.drawText(ptx('CMV meta salão '+pct(cfg.cmvPadrao,0)+' · CMV meta delivery '+pct(cfg.cmvDelivery||cfg.cmvPadrao,0)+' · comissão da plataforma '+pct(com,1)+' · plataforma = delivery ÷ (1 − comissão); comissão e lucro calculados sobre a venda da plataforma (ou o sugerido, se não houver venda)'),{x:ctx.M,y:ctx.y,size:8,font:ctx.font});ctx.y-=10;
    ptab(ctx,{w:[140,65,58,55,58,55,62,55,66,62,52,52],head:['PRODUTO','RENDIMENTO','CUSTO RECEITA','CUSTO / UN.','SUGERIDO SALÃO','VENDA SALÃO','SUGERIDO DELIVERY','VENDA DELIVERY','SUGERIDO PLATAFORMA','VENDA PLATAFORMA','COMISSÃO (R$)','LUCRO PLATAF.'],rows,align:['l','r','r','r','r','r','r','r','r','r','r','r'],size:7.5});
    await salvarPdf(ctx,'Lista-de-produtos.pdf');});}
function gerarPdfInsumos(){const list=[...S.insumos.values()].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  return comPdf(async P=>{const ctx=await novoPdf(P,false,'LISTA DE INSUMOS');
    const rows=list.map(i=>{let pr=null;try{pr=precoInsumo(i);}catch(e){}return[i.nome,i.un||'',pctTxt(fcOf(i)),brl(pr),i.fornecedor||'',i.fichaId?'produzido (ficha)':(i.dataPreco?'compra '+i.dataPreco:'planilha')];});
    ptab(ctx,{w:[190,45,55,60,115,70],head:['INSUMO','UNIDADE','RENDIMENTO','PREÇO','FORNECEDOR','ORIGEM DO PREÇO'],rows,align:['l','c','r','r','l','l'],size:8});
    await salvarPdf(ctx,'Lista-de-insumos.pdf');});}
async function salvarArquivo(nome,txt){const dl=await claude.use('downloads');if(!dl){toast('Download indisponível.');return;}
  try{await dl.save({filename:nome,data:'﻿'+txt});}catch(e){if(e&&e.code!=='declined')toast('Não foi possível gerar o arquivo.');}}
const csvc=v=>{const s=typeof v==='number'?v.toLocaleString('pt-BR',{maximumFractionDigits:4,useGrouping:false}):String(v??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
function exportarCSV(){const L=[['Categoria','Ficha','Código PDV','Rendimento','Unidade','Custo receita','Custo por unidade','CMV meta','Sugerido salão','Venda salão','CMV salão','CMV meta delivery','Sugerido delivery','Venda delivery','CMV delivery','Sugerido plataforma','Venda plataforma','CMV plataforma','Comissão plataforma R$','Líquido plataforma','Lucro plataforma','Média concorrência','Restaurantes']];
  for(const f of [...S.fichas.values()].sort((a,b)=>(a.categoria+a.nome).localeCompare(b.categoria+b.nome,'pt-BR'))){const c=custoFicha(f);const p=precos(f,c);const o=x=>x!=null&&isFinite(x)?+x.toFixed(4):'';
    L.push([f.categoria,f.nome,f.codigoPdv||'',f.rendimento??'',f.unidadeRend,o(c.total),o(c.un),p.cmv,o(p.sug),p.pv??'',o(p.real),p.cmvD,o(p.sugD),p.pvD??'',o(p.realD),o(p.sugI),p.pvI??'',o(p.realI),o(p.comI),o(p.liqI),o(p.lucroI),p.conc?o(p.conc.media):'',p.conc?p.conc.rest:'']);}
  salvarArquivo(`fichas-custos-${today()}.csv`,L.map(r=>r.map(csvc).join(';')).join('\n'));}
function exportarInsumos(){const L=[['Insumo','Código estoque','Unidade','Tipo','Peso bruto','Peso líquido','FC','Último preço','Média 90d','Custo usado','Fornecedor','Data do preço']];
  for(const i of [...S.insumos.values()].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')))L.push([i.nome,i.codigoEstoque||'',i.un,i.fichaId?'produzido':'comprado',i.pesoBruto,i.pesoLiquido,+fcOf(i).toFixed(4),i.fichaId?'':(Number(i.preco)||''),i.precoMedio||'',+precoInsumo(i).toFixed(4),i.fornecedor||'',i.dataPreco||'']);
  salvarArquivo(`insumos-${today()}.csv`,L.map(r=>r.map(csvc).join(';')).join('\n'));}

/* ---------- navegação e ações globais ---------- */
$('#tabs').onclick=e=>{const b=e.target.closest('button[data-tab]');if(!b)return;UI.tab=b.dataset.tab;try{localStorage.setItem('ft.tab',UI.tab)}catch(err){}render();window.scrollTo(0,0);};
$('#main').addEventListener('click',async e=>{
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();UI.tab=g.dataset.go;render();window.scrollTo(0,0);return;}
  const cc=e.target.closest('[data-conc]');if(cc){e.preventDefault();abrirConc(cc.dataset.conc);return;}
  const ins=e.target.closest('[data-ins]');if(ins){e.preventDefault();abrirInsumo(ins.dataset.ins);return;}
  const fic=e.target.closest('[data-fic]');if(fic){e.preventDefault();abrirFicha(fic.dataset.fic);return;}
  const lk=e.target.closest('[data-link]');if(lk){const [fid,ix,iid]=lk.dataset.link.split('|');const f=JSON.parse(JSON.stringify(S.fichas.get(fid)));const i=S.insumos.get(iid);
    f.itens[+ix].insumoId=iid;f.itens[+ix].nome=i.nome;f.id=fid;await salvarFicha(f);toast('Vinculado a '+i.nome);return;}
  const ni=e.target.closest('[data-newins]');if(ni){abrirInsumo(null,ni.dataset.newins);return;}
  const f1=e.target.closest('[data-fc1]');if(f1){const i=S.insumos.get(f1.dataset.fc1);await salvarInsumo({...i,pesoLiquido:i.pesoBruto});toast('FC ajustado para 1: '+i.nome);return;}
  const f100=e.target.closest('[data-fc100]');if(f100){const i=S.insumos.get(f100.dataset.fc100);await salvarInsumo({...i,pesoLiquido:i.pesoLiquido/100});toast('Peso líquido corrigido: '+i.nome);return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#layer').innerHTML)$('#layer').innerHTML='';});

/* ============ inicialização ============ */
async function boot(){
  const db=await claude.use('db');S.db=db;renderSync();
  if(!db){$('#main').innerHTML=`<div class="empty"><h2>Acesso restrito</h2><p>As fichas técnicas ficam disponíveis somente para a Diretoria. <a href="index.html">Voltar ao sistema</a></p></div>`;return;}
  claude.use('user').then(async u=>{S.user=u;if(u){try{S.uid=await u.id();}catch(e){}try{const c=await u.can('data.write');if(c===false){S.canWrite=false;renderSync();}}catch(e){}}});
  claude.use('sample').then(async s=>{S.sample=s;if(s){try{const l=await s.limits();S.sampleImg=!!(l&&l.images);}catch(e){}}});
  let t=null;const sched=()=>{clearTimeout(t);t=setTimeout(()=>{if(!$('#layer').innerHTML||UI.tab)render();},40);};
  const watch=(col,fn)=>db.collection(col).onSnapshot(s=>{fn(s);sched();},err=>{if(err&&err.code==='revoked'){S.db=null;renderSync();}});
  watch('insumos',s=>{S.insumos=new Map(s.docs.map(d=>[d.id,{...d.data(),id:d.id}]));S.loaded.insumos=true;});
  watch('fichas',s=>{S.fichas=new Map(s.docs.map(d=>[d.id,{...d.data(),id:d.id}]));S.loaded.fichas=true;});
  watch('vinculos',s=>{S.vinculos=new Map(s.docs.map(d=>[d.id,d.data()]));});
  SB.db.collection('categories').onSnapshot(s=>{S.cats=new Map(s.docs.map(d=>[d.id,{...d.data(),id:d.id}]));sched();},()=>{});
  SB.db.collection('products').onSnapshot(s=>{S.prods=new Map(s.docs.map(d=>[d.id,{...d.data(),id:d.id}]));sched();},()=>{});
  watch('notas',s=>{S.notas=s.docs.map(d=>d.data());});
  watch('concorrentes',s=>{S.concorrentes=new Map(s.docs.map(d=>[d.id,{...d.data(),id:d.id}]));});
  db.doc('config/geral').onSnapshot(s=>{if(s.exists){const c=s.data();S.config={...S.config,...c,perfil:{...DEF_PERFIL,...(c.perfil||{})}};}sched();},()=>{});
}
if(window.claude&&claude.use)boot();else{$('#main').innerHTML=`<div class="empty"><h2>Base indisponível</h2><p>Não foi possível carregar o sistema. <a href="index.html">Entrar no sistema</a></p></div>`;}
})();
